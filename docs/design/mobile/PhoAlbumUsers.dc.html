<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photographer · Choose people</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
.te-person:focus-within{outline:2px solid #262a67;outline-offset:-2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="PhoAlbumPrivacy.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Choose people</h1><span style="font-size: 13px; color: #5b5f86">Taif Rose Farms · 172 travellers</span></div>
</div>

<div role="note" style="padding: 10px 12px; border-radius: 12px; background: #1a1c4b; color: #f6f3e4; display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f89e23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<span style="flex-grow: 1; font-size: 13px; line-height: 18px"><strong style="color: #f89e23">Pro feature preview.</strong> Choosing people needs Pro. Your selection is kept if you upgrade.</span>
<a href="PhoPlanManage.dc.html" style="font-size: 14px; font-weight: 700; color: #ff8655; white-space: nowrap">Upgrade</a>
</div>

<div style="position: relative; display: flex">
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search travellers</label>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#262a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 14px; top: 14px"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
<input id="q" type="search" placeholder="Search by name or seat" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 999px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px 0 44px; font: inherit; font-size: 16px; color: #262a67">
</div>

<div style="display: flex; justify-content: space-between; align-items: center">
<span role="status" style="font-size: 15px; font-weight: 600">{{count}} selected</span>
<button onClick="{{clear}}" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #c93a00; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Clear</button>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{buses}}" as="b" hint-placeholder-count="2">
<fieldset style="margin: 0; padding: 0; border: 0; border-radius: 16px; background: #ffffff; overflow: hidden">
<legend style="float: left; width: 100%; box-sizing: border-box; padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; background: #e6e8f5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM4 11h16M8 18v2M16 18v2M8 14.5h.01M16 14.5h.01"></path></svg>{{b.name}}<span style="margin-inline-start: auto; font-weight: 500; color: #5b5f86">{{b.sel}}</span></legend>
<sc-for list="{{b.people}}" as="p" hint-placeholder-count="3">
<label class="te-person" style="clear: both; min-height: 48px; padding: 0 14px; border-top: 1px solid #e3dfc9; display: flex; align-items: center; gap: 12px; cursor: pointer">
<input type="checkbox" checked="{{p.on}}" onChange="{{p.toggle}}" style="width: 20px; height: 20px; margin: 0; accent-color: #262a67; flex-shrink: 0">
<span style="flex-grow: 1; font-size: 15px">{{p.n}}</span>
<span style="font-size: 13px; color: #5b5f86">{{p.seat}}</span>
</label>
</sc-for>
</fieldset>
</sc-for>
</div>

<a href="PhoAlbumPrivacy.dc.html" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Done · {{count}} people</a>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: { a1: true, a2: true, a3: true, b2: true } }; }
  renderVals() {
    const B = [
      { name: 'Bus 1 · 43 travellers', people: [['a1', 'Sara Al-Qahtani', '3C'], ['a2', 'Faisal Al-Qahtani', '3D'], ['a3', 'Omar Al-Qahtani', '4C'], ['a4', 'Huda Al-Zahrani', '5A']] },
      { name: 'Bus 2 · 43 travellers', people: [['b1', 'Abdullah Al-Mutairi', '1A'], ['b2', 'Layla Hassan', '2B'], ['b3', 'Turki Al-Dosari', '6D']] }
    ];
    const sel = this.state.sel;
    const buses = B.map((b) => {
      const people = b.people.map(([id, n, seat]) => ({ n, seat: 'Seat ' + seat, on: !!sel[id], toggle: () => this.setState({ sel: { ...this.state.sel, [id]: !this.state.sel[id] } }) }));
      const c = people.filter((p) => p.on).length;
      return { name: b.name, people, sel: c + ' selected' };
    });
    const count = Object.values(sel).filter(Boolean).length;
    return { buses, count: String(count), clear: () => this.setState({ sel: {} }) };
  }
}
</script>
</body>
</html>
