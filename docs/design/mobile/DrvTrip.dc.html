<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver · Assigned trip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="DrvTrips.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">AlUla Heritage Weekend</h1><span style="font-size: 13px; color: #5b5f86">Day 2 of 3 · Fri 17 Oct · Sunrise Tours Co.</span></div>
</div>

<div style="padding: 12px 14px; border-radius: 20px; background: #262a67; color: #f6f3e4; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px">
<span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #b8bad6">Bus</span><span style="font-size: 18px; font-weight: 700">Bus 2</span></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #b8bad6">Plate</span><span style="font-size: 18px; font-weight: 700">ABC 4821</span></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #b8bad6">Passengers</span><span style="font-size: 18px; font-weight: 700">43 / 49</span></span>
</div>

<section aria-labelledby="rt-h" style="padding: 12px 16px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 id="rt-h" style="margin: 0; font-size: 15px; font-weight: 600">Route &amp; stops</h2><span style="font-size: 13px; color: #5b5f86">68 km · 12.5 h</span></div>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
<sc-for list="{{stops}}" as="s" hint-placeholder-count="6">
<li style="display: flex; gap: 10px; min-height: 36px">
<span style="width: 44px; flex-shrink: 0; font-size: 14px; font-weight: 700; line-height: 20px">{{s.t}}</span>
<span style="width: 14px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center"><span style="{{s.dot}}"></span><span style="{{s.line}}"></span></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; padding-bottom: 6px"><span style="font-size: 14px; line-height: 20px; font-weight: 600">{{s.n}}</span><sc-if value="{{s.hasSub}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #5b5f86">{{s.sub}}</span></sc-if></span>
</li>
</sc-for>
</ol>
</section>

<section aria-label="Contacts" style="border-radius: 20px; background: #ffffff; display: flex; flex-direction: column">
<sc-for list="{{contacts}}" as="c" hint-placeholder-count="2">
<div style="{{c.rowStyle}}">
<img src="{{c.img}}" alt="" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; object-fit: cover">
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{c.n}}</span><span style="font-size: 13px; color: #5b5f86">{{c.r}}</span></span>
<a href="#" aria-label="{{c.aria}}" style="width: 44px; height: 44px; border-radius: 999px; background: #f6f3e4; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></a>
</div>
</sc-for>
</section>

<div style="display: flex; gap: 8px">
<a href="#" style="flex: 1 1 0; height: 44px; border-radius: 12px; background: #ffffff; border: 1px solid #e3dfc9; color: #262a67; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c93a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5"></path></svg>Route permit</a>
<a href="#" style="flex: 1 1 0; height: 44px; border-radius: 12px; background: #ffffff; border: 1px solid #e3dfc9; color: #262a67; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c93a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5"></path></svg>Day 2 itinerary</a>
</div>

<a href="DrvPreTrip.dc.html" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Start pre-trip check</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = [
      ['07:40', 'Pickup · Shaden Resort lobby', 'Main group · 31 passengers', 'pick'],
      ['07:55', 'Pickup · Habitas AlUla gate', '12 passengers', 'pick'],
      ['10:30', 'Hegra', 'Guided tour · park in bay C', ''],
      ['13:30', 'AlUla Old Town', 'Walk · lunch break', ''],
      ['16:30', 'Elephant Rock', 'Dinner program until 19:30', ''],
      ['20:30', 'Drop-off · Shaden Resort', '', 'end']
    ];
    const stops = S.map(([t, n, sub, k], i) => ({ t, n, sub, hasSub: !!sub,
      dot: 'width: 12px; height: 12px; box-sizing: border-box; border-radius: 999px; margin-top: 4px; flex-shrink: 0; ' + (k === 'pick' ? 'background: #ff6c2e;' : k === 'end' ? 'background: #262a67;' : 'background: #ffffff; border: 2px solid #262a67;'),
      line: 'flex-grow: 1; width: 2px; ' + (i === S.length - 1 ? 'background: transparent;' : 'background: #e3dfc9;') }));
    const contacts = [
      { ini: 'NY', img: '../assets/28ad7d346304ae503024b63430b79f78.svg', n: 'Nadia Yusuf', r: 'Moderator · Bus 2', aria: 'Call Nadia Yusuf' },
      { ini: 'YA', img: '../assets/752b7ab031f2f70a93ff8107886b5b7e.svg', n: 'Yousef Amin', r: 'Operations · Sunrise Tours Co.', aria: 'Call Yousef Amin' }
    ].map((c, i) => ({ ...c, rowStyle: 'padding: 10px 16px; display: flex; align-items: center; gap: 12px; ' + (i ? 'border-top: 1px solid #e3dfc9;' : '') }));
    return { stops, contacts };
  }
}
</script>
</body>
</html>
