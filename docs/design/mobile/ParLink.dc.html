<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parent · Link child to a trip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 10px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="ParHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Link a child to a trip</h1>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Who is travelling?</legend>
<div style="display: flex; gap: 10px">
<sc-for list="{{kids}}" as="k" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{k.checked}}" onClick="{{k.on}}" style="{{k.style}}">
<span aria-hidden="true" style="{{k.avatar}}"><img src="{{k.av}}" alt="" style="width: 100%; height: 100%; border-radius: 999px; object-fit: cover; display: block"></span>
<span style="display: flex; flex-direction: column; align-items: flex-start"><span style="font-size: 16px; font-weight: 600">{{k.name}}</span><span style="font-size: 13px; color: #5b5f86">{{k.age}}</span></span>
</button>
</sc-for>
</div>
</fieldset>

<div role="tablist" aria-label="Link with" style="display: flex; padding: 4px; border-radius: 999px; background: #ffffff; border: 1px solid #e3dfc9">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{m.sel}}" onClick="{{m.on}}" style="{{m.style}}">{{m.t}}</button></sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ref" style="font-size: 14px; font-weight: 600">{{fieldLabel}}</label>
<input id="ref" type="text" value="{{value}}" autocomplete="off" aria-invalid="{{invalid}}" aria-describedby="ref-help" style="{{inputStyle}}">
<span id="ref-help" style="{{helpStyle}}">{{help}}</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cname" style="font-size: 14px; font-weight: 600">Child’s full name, as on the booking</label>
<input id="cname" type="text" value="{{fullName}}" autocomplete="off" aria-invalid="{{invalid}}" style="{{inputStyle}}">
</div>

<div style="display: flex; gap: 10px">
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="rel" style="font-size: 14px; font-weight: 600">You are their</label>
<select id="rel" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 10px; font: inherit; font-size: 16px; color: #262a67"><option selected>Mother</option><option>Father</option><option>Legal guardian</option></select>
</div>
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="dob" style="font-size: 14px; font-weight: 600">Date of birth</label>
<input id="dob" type="text" value="{{dob}}" inputmode="numeric" aria-describedby="dob-help" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 12px; font: inherit; font-size: 16px; color: #262a67; min-width: 0">
</div>
</div>
<span id="dob-help" style="margin-top: -4px; font-size: 12px; line-height: 16px; color: #5b5f86">Used only to confirm your child is under 18. Not shown to the organizer.</span>

<label style="min-height: 44px; display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 19px; cursor: pointer">
<input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #262a67">
<span>I am this child’s parent or legal guardian, and I may receive their trip updates.</span>
</label>

<sc-if value="{{ok}}" hint-placeholder-val="{{true}}">
<div role="status" style="padding: 12px 14px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 4px">
<span style="align-self: flex-start; padding: 2px 10px; border-radius: 999px; background: #e3f3ea; color: #1f7a4d; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>Trip found</span>
<span style="font-size: 16px; line-height: 21px; font-weight: 600">{{foundTitle}}</span>
<span style="font-size: 13px; line-height: 18px; color: #5b5f86">{{foundMeta}}</span>
</div>
</sc-if>

<sc-if value="{{refused}}" hint-placeholder-val="{{false}}">
<div role="alert" style="{{refuseStyle}}"><strong style="font-size: 14px">{{refuseTitle}}</strong><span>{{refuseText}}</span></div>
</sc-if>

<sc-if value="{{ok}}" hint-placeholder-val="{{true}}">
<a href="ParChild.dc.html" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">{{cta}}</a>
</sc-if>
<sc-if value="{{refused}}" hint-placeholder-val="{{false}}">
<a href="{{refuseHref}}" style="{{refuseBtn}}">{{refuseCta}}</a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["found","noMatch","orgOff","freePlan"],"default":"found"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { kid: 'Omar', mode: 'ref' }; }
  renderVals() {
    const result = this.props.result ?? 'found';
    const err = result === 'noMatch';
    const R = {
      noMatch: ['We couldn’t link this child', 'Check the reference and your child’s full name exactly as they appear on the booking, then try again.', 'bad', 'Try again', 'ParLink.dc.html'],
      orgOff: ['Tracking isn’t offered on this trip', 'The organizer hasn’t turned on child tracking for this trip, so it can’t be linked. You still get the trip reminder with the booking.', 'info', 'Back to family', 'ParHome.dc.html'],
      freePlan: ['Child tracking needs Explorer or VIP', 'You’re on the Free plan. Upgrade to link your child and get boarding and stop alerts.', 'info', 'See plans', 'ParGate.dc.html']
    }[result];
    const { kid, mode } = this.state;
    const AVK = { Omar: '../assets/e627328c50e6893b77803c4a27b29c6e.svg', Lina: '../assets/1cd63ceb2af4109eddb6e3740d99b590.svg' };
    const K = [['Omar', 'Age 9', 'O'], ['Lina', 'Age 6', 'L']];
    const kids = K.map(([name, age, initial]) => {
      const on = kid === name;
      return { name, age, initial, av: AVK[name], checked: on ? 'true' : 'false', on: () => this.setState({ kid: name }),
        avatar: 'width: 36px; height: 36px; flex-shrink: 0; overflow: hidden; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-weight: 700; ' + (name === 'Omar' ? 'background: #e6e8f5;' : 'background: #ffe7dc; color: #c93a00;'),
        style: 'flex: 1 1 0; height: 64px; padding: 0 12px; border-radius: 16px; background: #ffffff; font: inherit; color: #262a67; cursor: pointer; display: flex; align-items: center; gap: 10px; ' + (on ? 'border: 2px solid #fb8030;' : 'border: 1px solid #e3dfc9;') };
    });
    const modes = [['ref', 'Booking reference'], ['code', 'School code']].map(([id, t]) => ({ t, sel: mode === id ? 'true' : 'false', on: () => this.setState({ mode: id }),
      style: 'flex: 1 1 0; height: 40px; border: 0; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (mode === id ? 'background: #262a67; color: #f6f3e4;' : 'background: transparent; color: #262a67;') }));
    const isRef = mode === 'ref';
    const value = err ? (isRef ? 'TE-48 213' : 'ALNOOR-G 4') : (isRef ? 'TE-48213' : 'ALNOOR-G4');
    const trip = isRef ? 'AlUla Heritage Weekend' : 'Al Noor School · Grade 4 Zoo Day';
    const meta = isRef ? ('Thu 16 Oct · Bus 2 · Seat ' + (kid === 'Omar' ? '4C' : '4D') + ' · Sunrise Tours Co.') : 'Today · Bus 1 · seat given at boarding · Al Noor School';
    return {
      kids, modes, value, ok: !R, refused: !!R, invalid: err ? 'true' : 'false',
      fullName: kid === 'Omar' ? 'Omar Faisal Al-Qahtani' : 'Lina Faisal Al-Qahtani', dob: kid === 'Omar' ? '12/03/2017' : '04/09/2020',
      refuseTitle: R ? R[0] : '', refuseText: R ? R[1] : '', refuseCta: R ? R[3] : '', refuseHref: R ? R[4] : '#',
      refuseBtn: 'margin-top: auto; height: 52px; flex-shrink: 0; box-sizing: border-box; border-radius: 12px; color: #262a67; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; ' + (result === 'orgOff' ? 'background: #ffffff; border: 1px solid #7b7fa6;' : 'background: #ff6c2e;'),
      refuseStyle: 'padding: 12px 14px; border-radius: 16px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 18px; ' + (R && R[2] === 'bad' ? 'background: #fde8e6; color: #b42318;' : 'background: #e6e8f5; color: #262a67;'),
      fieldLabel: isRef ? 'Booking reference' : 'School or company code',
      help: isRef ? 'On the booking confirmation, for example TE-48213' : 'Given by the school, for example ALNOOR-G4',
      helpStyle: 'font-size: 13px; line-height: 18px; color: #5b5f86;',
      inputStyle: 'height: 52px; box-sizing: border-box; border-radius: 8px; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; letter-spacing: 0.04em; color: #262a67; border: ' + (err ? '2px solid #b42318;' : '1px solid #7b7fa6;'),
      foundTitle: kid + ' → ' + trip, foundMeta: meta, cta: 'Link ' + kid
    };
  }
}
</script>
</body>
</html>
