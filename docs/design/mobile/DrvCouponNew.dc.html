<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver · New coupon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="DrvCoupons.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">New coupon</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="code" style="font-size: 14px; font-weight: 600">Code</label>
<div style="display: flex; gap: 8px">
<input id="code" type="text" value="{{code}}" style="flex-grow: 1; min-width: 0; height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font-family: ui-monospace, Menlo, monospace; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; color: #262a67; text-transform: uppercase">
<button type="button" onClick="{{gen}}" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg>Generate</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span id="type-l" style="font-size: 14px; font-weight: 600">Type</span>
<div role="radiogroup" aria-labelledby="type-l" style="display: flex; gap: 6px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{t.sel}}" onClick="{{t.go}}" style="{{t.style}}">{{t.t}}</button>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="val" style="font-size: 14px; font-weight: 600">{{valLabel}}</label><input id="val" type="text" inputmode="numeric" value="{{valDefault}}" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="min" style="font-size: 14px; font-weight: 600">Min booking (SAR)</label><input id="min" type="text" inputmode="numeric" value="{{minDefault}}" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="lim" style="font-size: 14px; font-weight: 600">Total uses</label><input id="lim" type="text" inputmode="numeric" value="40" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="per" style="font-size: 14px; font-weight: 600">Per company</label><input id="per" type="text" inputmode="numeric" value="1" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="from" style="font-size: 14px; font-weight: 600">Valid from</label><input id="from" type="text" value="Sat 1 Nov" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="to" style="font-size: 14px; font-weight: 600">Valid until</label><input id="to" type="text" value="Wed 31 Dec" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67; width: 100%"></div>
</div>

<div style="display: flex; gap: 10px; align-items: flex-end">
<div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px">
<span id="aud-l" style="font-size: 14px; font-weight: 600">Audience</span>
<div role="radiogroup" aria-labelledby="aud-l" style="height: 44px; box-sizing: border-box; padding: 3px; border-radius: 999px; background: #ffffff; border: 1px solid #7b7fa6; display: flex">
<sc-for list="{{aud}}" as="a" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{a.sel}}" onClick="{{a.go}}" style="{{a.style}}">{{a.t}}</button>
</sc-for>
</div>
</div>
<div style="flex: 1 1 0; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; box-sizing: border-box; border-radius: 12px; background: #ffffff">
<span id="stk-l" style="font-size: 14px; font-weight: 600">Stackable</span>
<button type="button" role="switch" aria-checked="{{stkAria}}" aria-labelledby="stk-l" onClick="{{togStk}}" style="{{stkTrack}}"><span style="width: 22px; height: 22px; border-radius: 999px; background: #ffffff; display: block"></span></button>
</div>
</div>

<div style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: #efecdc; display: flex; align-items: center; gap: 10px; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<span style="flex-grow: 1"><strong>Scope:</strong> Your bookings only</span><span style="font-size: 12px; color: #5b5f86">Locked</span>
</div>

<div style="margin-top: auto; display: flex; gap: 10px">
<a href="DrvCoupons.dc.html" style="flex: 1 1 0; height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Save as draft</a>
<a href="DrvCoupons.dc.html" style="flex: 1 1 0; height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Activate</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { type: 1, aud: 0, stk: false, code: 'KHALIDWINTER' }; }
  renderVals() {
    const T = ['Fixed', 'Percentage', 'First booking', 'Min spend'];
    const types = T.map((t, i) => {
      const on = this.state.type === i;
      return { t, sel: on ? 'true' : 'false', go: () => this.setState({ type: i }),
        style: 'flex: 1 1 auto; height: 44px; padding: 0 8px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; ' + (on ? 'background: #262a67; color: #f6f3e4; border: 1px solid #262a67;' : 'background: #ffffff; color: #262a67; border: 1px solid #7b7fa6;') };
    });
    const aud = ['Public', 'Targeted'].map((t, i) => {
      const on = this.state.aud === i;
      return { t, sel: on ? 'true' : 'false', go: () => this.setState({ aud: i }),
        style: 'flex: 1 1 0; border: none; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #262a67; color: #f6f3e4;' : 'background: transparent; color: #262a67;') };
    });
    const ty = this.state.type;
    const pct = ty === 1 || ty === 2;
    const stk = this.state.stk;
    const codes = ['KHALID-7Q2M', 'KHALID-R4TX', 'KHALID-9BNW', 'KHALIDWINTER'];
    return {
      types, aud,
      code: this.state.code,
      gen: () => { const c = codes[(codes.indexOf(this.state.code) + 1) % codes.length]; this.setState({ code: c }); },
      valLabel: pct ? 'Discount (%)' : 'Discount (SAR)',
      valDefault: pct ? '10' : '150',
      minDefault: ty === 3 ? '1,000' : '500',
      stkAria: stk ? 'true' : 'false', togStk: () => this.setState({ stk: !stk }),
      stkTrack: 'width: 48px; height: 28px; flex-shrink: 0; border-radius: 999px; border: none; padding: 3px; cursor: pointer; display: flex; ' + (stk ? 'background: #1f7a4d; justify-content: flex-end;' : 'background: #7b7fa6; justify-content: flex-start;')
    };
  }
}
</script>
</body>
</html>
