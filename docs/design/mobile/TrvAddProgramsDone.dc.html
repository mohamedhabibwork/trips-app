<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Programs added</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding-top: 8px">
<span style="width: 64px; height: 64px; border-radius: 999px; background: #e3f3ea; color: #1f7a4d; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Programs added</h1>
<p style="margin: 0; font-size: 15px; line-height: 21px; color: #5b5f86">Paid 752.40 SAR with mada •••• 4821. Your group's tickets now include the new programs.</p>
</div>

<div style="border-radius: 20px; background: #ffffff; padding: 4px 16px">
<sc-for list="{{progs}}" as="p" hint-placeholder-count="8"><div style="{{p.row}}"><span style="width: 48px; flex-shrink: 0; font-size: 13px; font-weight: 700">{{p.time}}</span><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; line-height: 17px"><span style="font-size: 14px; font-weight: 600">{{p.name}}</span><span style="font-size: 12px; color: #5b5f86">{{p.meet}}</span></span><sc-if value="{{p.isNew}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 8px; border-radius: 999px; background: #fb8030; color: #262a67; font-size: 11px; font-weight: 700">New</span></sc-if></div></sc-for>
</div>

<a href="TrvInvoice.dc.html" style="min-height: 48px; padding: 0 14px; border-radius: 12px; background: #ffffff; display: flex; align-items: center; gap: 10px; color: #262a67; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5"></path></svg><span style="flex-grow: 1; font-size: 15px; font-weight: 600">Tax invoice INV-48213-02</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>

<div style="margin-top: auto; display: flex; gap: 8px">
<a href="TrvProgramsSchedule.dc.html" style="flex: 1 1 0; height: 52px; border-radius: 12px; background: #ffffff; border: 1px solid #7b7fa6; box-sizing: border-box; color: #262a67; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">My programs</a>
<a href="TrvTicket.dc.html" style="flex: 1 1 0; height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">View ticket</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { time: 'Thu', name: 'Old Town walk · 18:10', meet: 'Old Town gate · all 4', isNew: true },
      { time: 'Thu', name: 'Elephant Rock dinner · 19:30', meet: 'Hotel lobby 19:00 · Standard ×2, Basic ×2', isNew: true },
      { time: 'Thu', name: 'Desert camp kit × 2', meet: 'Collect from Nadia on Bus 2', isNew: true },
      { time: 'Fri', name: 'Hegra guided tour · 08:00', meet: 'Hegra visitor centre · all 4', isNew: false },
      { time: 'Fri', name: 'Hegra by night · 20:00', meet: 'Hegra visitor centre · Sara, Faisal', isNew: true },
      { time: 'Sat', name: 'Group photo package · 09:00', meet: 'Hotel garden · Noura Al-Shehri', isNew: true },
      { time: 'All', name: 'Travel insurance', meet: 'Covers all 4 travellers', isNew: false }
    ];
    const progs = list.map((p, i) => Object.assign({}, p, { row: 'min-height: 50px; display: flex; align-items: center; gap: 10px; ' + (i ? 'border-top: 1px solid #e3dfc9;' : '') }));
    return { progs };
  }
}
</script>
</body>
</html>
