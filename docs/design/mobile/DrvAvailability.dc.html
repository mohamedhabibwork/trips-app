<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver · Availability</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="DrvProfile.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Availability</h1>
</div>

<section aria-labelledby="mo-h" style="padding: 12px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
<button type="button" aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #f6f3e4; color: #262a67; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<h2 id="mo-h" style="margin: 0; font-size: 17px; font-weight: 600">October</h2>
<button type="button" aria-label="Next month" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #f6f3e4; color: #262a67; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; font-weight: 600; color: #5b5f86">
<sc-for list="{{wd}}" as="w" hint-placeholder-count="7"><span>{{w}}</span></sc-for>
</div>
<div role="group" aria-label="Days in October" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<sc-if value="{{c.blank}}" hint-placeholder-val="{{false}}"><span></span></sc-if>
<sc-if value="{{c.day}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{c.go}}" aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" aria-disabled="{{c.dis}}" style="{{c.style}}">{{c.n}}</button></sc-if>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 4px 0; font-size: 12px; color: #5b5f86">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #ffffff; border: 1px solid #7b7fa6"></span>Available</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #ff6c2e"></span>Booked</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #fdf0d5; border: 1px dashed #8a4b00; box-sizing: border-box"></span>Deal pending</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #5b5f86"></span>Unavailable</span>
</div>
</section>
<div role="radiogroup" aria-label="How to mark dates" style="height: 44px; flex-shrink: 0; box-sizing: border-box; padding: 4px; border-radius: 999px; background: #ffffff; border: 1px solid #e3dfc9; display: flex; margin-top: -4px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{m.sel}}" onClick="{{m.go}}" style="{{m.style}}">{{m.t}}</button>
</sc-for>
</div>
<span style="font-size: 13px; line-height: 18px; color: #5b5f86; margin-top: -6px">{{hint}}</span>

<sc-if value="{{hasConflict}}" hint-placeholder-val="{{true}}">
<div role="alert" style="padding: 10px 12px; border-radius: 12px; background: #fde8e6; color: #b42318; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 18px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l9.5 17h-19zM12 10v4M12 17h.01"></path></svg>
<span>{{conflict}}</span>
</div>
</sc-if>

<section aria-labelledby="ul-h" style="display: flex; flex-direction: column; gap: 6px; min-height: 0">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 id="ul-h" style="margin: 0; font-size: 15px; font-weight: 600">Unavailable dates</h2><span style="font-size: 12px; color: #5b5f86">Offers on these dates are refused</span></div>
<sc-if value="{{noRanges}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: #5b5f86">No dates marked. Organizers can send offers for any free day.</span></sc-if>
<sc-for list="{{ranges}}" as="r" hint-placeholder-count="2">
<div style="min-height: 48px; box-sizing: border-box; padding: 0 4px 0 14px; border-radius: 12px; background: #ffffff; border: 1px solid #e3dfc9; display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 10h16M8 3v4M16 3v4"></path></svg>
<span style="flex-grow: 1; font-size: 14px; font-weight: 600">{{r.t}}</span>
<span style="font-size: 12px; color: #5b5f86">{{r.kind}}</span>
<button type="button" onClick="{{r.go}}" aria-label="{{r.aria}}" style="width: 44px; height: 44px; border: none; border-radius: 999px; background: transparent; color: #b42318; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
</div>
</sc-for>
</section>

<a href="DrvProfile.dc.html" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Save availability</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { blocked: [19, 20, 21, 28], mode: 0, start: 0, conflict: 'Thu 16 Oct has an assignment (AlUla Heritage Weekend), so it cannot be marked unavailable. Ask the organizer to reassign first.' }; }
  renderVals() {
    const today = 17;
    const booked = [4, 11, 16, 17, 18, 24];
    const pending = [25];
    const bl = this.state.blocked;
    const wdn = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const cells = [];
    for (let i = 0; i < 3; i++) cells.push({ blank: true, day: false });
    for (let d = 1; d <= 31; d++) {
      const isB = booked.includes(d), isP = pending.includes(d), isX = bl.includes(d), past = d < today;
      const lock = past || isB || isP;
      let look = 'background: #ffffff; color: #262a67; border: 1px solid #e3dfc9;';
      let state = 'available';
      if (isB) { look = 'background: #ff6c2e; color: #262a67; border: none; font-weight: 700;'; state = 'booked'; }
      else if (isP) { look = 'background: #fdf0d5; color: #8a4b00; border: 1px dashed #8a4b00; font-weight: 700;'; state = 'deal pending'; }
      else if (isX) { look = 'background: #5b5f86; color: #ffffff; border: none; text-decoration: line-through;'; state = 'blocked'; }
      if (past && !isB) look += ' opacity: 0.55;';
      if (d === today) look += ' box-shadow: 0 0 0 2px #262a67 inset;';
      if (d === this.state.start) look += ' box-shadow: 0 0 0 2px #fb8030 inset;';
      cells.push({ blank: false, day: true, n: String(d), dis: lock ? "true" : "false", pressed: isX ? 'true' : 'false',
        aria: wdn[(d + 2) % 7] + ' ' + d + ' October, ' + (isX ? 'unavailable' : state) + (d === today ? ', today' : ''),
        go: () => {
          if (past) return;
          if (isB) { this.setState({ conflict: wdn[(d + 2) % 7] + ' ' + d + ' Oct has an assignment, so it cannot be marked unavailable. Ask the organizer to reassign first.', start: 0 }); return; }
          if (isP) { this.setState({ conflict: wdn[(d + 2) % 7] + ' ' + d + ' Oct has a deal waiting for your answer. Decline it in Offers before marking the day unavailable.', start: 0 }); return; }
          if (this.state.mode === 0) { this.setState({ conflict: '', blocked: isX ? bl.filter((x) => x !== d) : bl.concat([d]) }); return; }
          const s = this.state.start;
          if (!s) { this.setState({ start: d, conflict: '' }); return; }
          const a = Math.min(s, d), b = Math.max(s, d);
          const hit = booked.concat(pending).find((x) => x >= a && x <= b);
          if (hit) { this.setState({ start: 0, conflict: 'The range ' + a + '–' + b + ' Oct includes ' + hit + ' Oct, which has an assignment or open deal. Pick dates around it.' }); return; }
          const add = []; for (let x = a; x <= b; x++) if (!bl.includes(x)) add.push(x);
          this.setState({ start: 0, conflict: '', blocked: bl.concat(add) });
        },
        style: 'height: 36px; border-radius: 10px; font: inherit; font-size: 14px; padding: 0; cursor: ' + (lock ? 'default' : 'pointer') + '; ' + look });
    }
    const modes = ['Single date', 'Date range'].map((t, i) => {
      const on = this.state.mode === i;
      return { t, sel: on ? 'true' : 'false', go: () => this.setState({ mode: i, start: 0 }),
        style: 'flex: 1 1 0; border: none; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #262a67; color: #f6f3e4;' : 'background: transparent; color: #262a67;') };
    });
    const hint = this.state.mode === 0 ? 'Tap a free day to mark it unavailable; tap again to free it. Days with an assignment stay locked.'
      : (this.state.start ? 'Start: ' + this.state.start + ' Oct. Now tap the last day of the range.' : 'Tap the first day, then the last day of the range.');
    const sorted = bl.slice().sort((a, b) => a - b);
    const groups = [];
    sorted.forEach((d) => { const g = groups[groups.length - 1]; if (g && d === g[1] + 1) g[1] = d; else groups.push([d, d]); });
    const ranges = groups.map(([a, b]) => ({
      t: a === b ? wdn[(a + 2) % 7] + ' ' + a + ' Oct' : wdn[(a + 2) % 7] + ' ' + a + ' – ' + wdn[(b + 2) % 7] + ' ' + b + ' Oct',
      kind: a === b ? 'Single date' : (b - a + 1) + ' days',
      aria: 'Remove unavailable ' + (a === b ? a + ' October' : a + ' to ' + b + ' October'),
      go: () => this.setState({ blocked: bl.filter((x) => x < a || x > b) })
    }));
    return { wd: wdn, cells, modes, hint, ranges, noRanges: ranges.length === 0, hasConflict: !!this.state.conflict, conflict: this.state.conflict };
  }
}
</script>
</body>
</html>
