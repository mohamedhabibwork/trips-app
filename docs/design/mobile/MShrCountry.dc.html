<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile · Country and language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Cairo:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<img src="../assets/1fbce194fcb16bf54904c32c189fca31.svg" alt="Trips Enjoy" style="align-self: center; height: 32px; width: auto">

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700">Where are you travelling from?</h1>
<p lang="ar" dir="rtl" style="margin: 0; font-family: Cairo, sans-serif; font-size: 16px; line-height: 24px; color: #5b5f86">من أين تسافر؟ اختر بلدك ولغتك</p>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Language</legend>
<div style="display: flex; gap: 8px">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="2"><button type="button" lang="{{l.code}}" aria-pressed="{{l.sel}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.t}}</button></sc-for>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Country</legend>
<sc-for list="{{countries}}" as="c" hint-placeholder-count="3">
<button type="button" aria-pressed="{{c.sel}}" onClick="{{c.pick}}" style="{{c.style}}">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #e6e8f5; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.code}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-align: start"><span style="font-size: 16px; font-weight: 600">{{c.name}} <span lang="ar" style="font-family: Cairo, sans-serif; font-weight: 600; color: #5b5f86">{{c.ar}}</span></span><span style="font-size: 13px; color: #5b5f86">{{c.cur}}</span></span>
<span style="{{c.dot}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
</button>
</sc-for>
</fieldset>

<div role="status" style="padding: 14px 16px; border-radius: 20px; background: #262a67; color: #f6f3e4; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #b8bad6">Prices and payment follow your country</span>
<div style="display: flex; gap: 10px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff8655" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9zM7.5 7.5h.01"></path></svg><span style="font-size: 15px; line-height: 21px">Prices in <strong>{{curName}}</strong>, for example {{example}}</span></div>
<div style="display: flex; gap: 10px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff8655" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M4 7a2 2 0 0 1 2-2h12v4M4 7v11a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2zM16 14.5h.01"></path></svg><span style="font-size: 15px; line-height: 21px">{{pay}}</span></div>
<span style="font-size: 13px; color: #b8bad6">Trip times show in each trip's local time. Change both later in Settings.</span>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="TrvHome.dc.html" style="height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
<div style="display: flex; gap: 10px">
<a href="MobileSignIn.dc.html" style="flex: 1 1 0; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Sign in</a>
<a href="TrvSearch.dc.html" style="flex: 1 1 0; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Browse trips</a>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lang: 'en', country: 'EG' }; }
  renderVals() {
    const s = this.state;
    const L = [{ code: 'ar', t: 'العربية' }, { code: 'en', t: 'English' }];
    const C = [
      { code: 'EG', name: 'Egypt', ar: 'مصر', cur: 'Egyptian pound · EGP', curName: 'Egyptian pounds (EGP)', example: '4,950 EGP',
        pay: 'Pay by card or wallet on Paymob’s secure page, or in cash at any Fawry outlet with a reference code.' },
      { code: 'SA', name: 'Saudi Arabia', ar: 'السعودية', cur: 'Saudi riyal · SAR', curName: 'Saudi riyals (SAR)', example: '1,250 SAR',
        pay: 'Pay by card, mada or Apple Pay on the payment provider’s secure page.' },
      { code: 'AE', name: 'United Arab Emirates', ar: 'الإمارات', cur: 'UAE dirham · AED', curName: 'UAE dirhams (AED)', example: '1,250 AED',
        pay: 'Pay by card or Apple Pay on Tap’s secure payment page.' }
    ];
    const cur = C.find(c => c.code === s.country) || C[0];
    const langStyle = (sel, ar) => 'flex: 1 1 0; height: 52px; border-radius: 12px; font-family: ' + (ar ? 'Cairo, sans-serif' : 'inherit') + '; font-size: 17px; font-weight: 700; cursor: pointer; ' + (sel ? 'background: #262a67; color: #f6f3e4; border: 2px solid #262a67' : 'background: #ffffff; color: #262a67; border: 1px solid #7b7fa6');
    const rowStyle = sel => 'min-height: 64px; padding: 8px 14px 8px 8px; border-radius: 12px; background: #ffffff; color: #262a67; font: inherit; display: flex; align-items: center; gap: 12px; cursor: pointer; border: ' + (sel ? '2px solid #fb8030' : '1px solid #e3dfc9');
    const dot = sel => 'width: 24px; height: 24px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; ' + (sel ? 'background: #fb8030; color: #262a67' : 'border: 2px solid #7b7fa6; color: transparent; box-sizing: border-box');
    return {
      langs: L.map(l => ({ ...l, sel: s.lang === l.code, style: langStyle(s.lang === l.code, l.code === 'ar'), pick: () => this.setState({ lang: l.code }) })),
      countries: C.map(c => ({ ...c, sel: s.country === c.code, style: rowStyle(s.country === c.code), dot: dot(s.country === c.code), pick: () => this.setState({ country: c.code }) })),
      curName: cur.curName, example: cur.example, pay: cur.pay
    };
  }
}
</script>
</body>
</html>
