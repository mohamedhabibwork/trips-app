<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traveler · Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Cairo:wght@600&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 8px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="TrvProfile.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Settings</h1>
</div>

<h2 id="lang-h" style="margin: 2px 0 0; font-size: 14px; font-weight: 600; color: #5b5f86">Language</h2>
<div role="radiogroup" aria-labelledby="lang-h" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #ffffff; border: 1px solid #e3dfc9">
<button type="button" role="radio" aria-checked="{{lang.en}}" onClick="{{setEn}}" style="{{lang.enStyle}}">English</button>
<button type="button" role="radio" aria-checked="{{lang.ar}}" onClick="{{setAr}}" lang="ar" dir="rtl" style="{{lang.arStyle}}">العربية</button>
</div>

<h2 id="look-h" style="margin: 2px 0 0; font-size: 14px; font-weight: 600; color: #5b5f86">Appearance</h2>
<div role="radiogroup" aria-labelledby="look-h" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #ffffff; border: 1px solid #e3dfc9">
<sc-for list="{{looks}}" as="l" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{l.sel}}" onClick="{{l.on}}" style="{{l.style}}">{{l.t}}</button></sc-for>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<h2 style="margin: 2px 0 0; font-size: 14px; font-weight: 600; color: #5b5f86">{{g.t}}</h2>
<div style="border-radius: 20px; background: #ffffff; padding: 0 16px">
<sc-for list="{{g.items}}" as="s" hint-placeholder-count="2">
<div style="{{s.row}}">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span id="{{s.id}}" style="font-size: 15px; font-weight: 600">{{s.t}}</span><span style="font-size: 12px; line-height: 16px; color: #5b5f86">{{s.d}}</span></span>
<button type="button" role="switch" aria-checked="{{s.checked}}" aria-labelledby="{{s.id}}" onClick="{{s.toggle}}" style="{{s.sw}}"><span style="width: 26px; height: 26px; border-radius: 999px; background: #ffffff; display: block"></span></button>
</div>
</sc-for>
</div>
</sc-for>

<a href="TrvHome.dc.html" style="margin-top: auto; height: 48px; border-radius: 12px; background: #ffffff; border: 1px solid #7b7fa6; box-sizing: border-box; color: #b42318; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Sign out</a>
<span style="font-size: 12px; color: #5b5f86; text-align: center">Version 2.4.0 · Signed in as +966 55 ••• 4821</span>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lang: 'en', look: 'System', on: { remind: true, board: true, offers: false, loc: true, name: true } }; }
  renderVals() {
    const seg = (on, extra) => 'flex: 1 1 0; height: 40px; border: 0; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; ' + (extra || 'font-family: inherit;') + (on ? ' background: #262a67; color: #f6f3e4;' : ' background: transparent; color: #262a67;');
    const L = this.state.lang;
    const lang = { en: L === 'en' ? 'true' : 'false', ar: L === 'ar' ? 'true' : 'false', enStyle: seg(L === 'en'), arStyle: seg(L === 'ar', 'font-family: Cairo, sans-serif;') };
    const looks = ['Light', 'Dark', 'System'].map((t) => ({ t, sel: this.state.look === t ? 'true' : 'false', on: () => this.setState({ look: t }), style: seg(this.state.look === t) }));
    const on = this.state.on;
    const G = [
      ['Notifications', [
        ['remind', 'Trip reminders', '3 days and 1 day before, with pickup time'],
        ['board', 'Boarding alerts', 'When you or your children check in or out'],
        ['offers', 'Offers', 'Coupons and new trips from organizers you follow']
      ]],
      ['Location', [['loc', 'Share location on trip days', 'Only while a trip is live, so Nadia can find you']]],
      ['Privacy', [['name', 'Show first name on reviews', 'Off shows “Trips Enjoy traveller”']]]
    ];
    const groups = G.map(([t, items]) => ({ t, items: items.map(([id, tt, d], i) => ({
      id: 'set-' + id, t: tt, d, checked: on[id] ? 'true' : 'false',
      toggle: () => this.setState({ on: { ...this.state.on, [id]: !this.state.on[id] } }),
      row: 'min-height: 56px; display: flex; align-items: center; gap: 12px;' + (i < items.length - 1 ? ' border-bottom: 1px solid #e3dfc9;' : ''),
      sw: 'width: 52px; height: 32px; flex-shrink: 0; padding: 3px; border-radius: 999px; border: 0; cursor: pointer; display: flex; ' + (on[id] ? 'background: #262a67; justify-content: flex-end;' : 'background: #7b7fa6; justify-content: flex-start;')
    })) }));
    return { lang, setEn: () => this.setState({ lang: 'en' }), setAr: () => this.setState({ lang: 'ar' }), looks, groups };
  }
}
</script>
</body>
</html>
