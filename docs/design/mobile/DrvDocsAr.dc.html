<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>سائق · المستندات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f3e4; color: #262a67; font-family: Cairo, 'Readex Pro', Tahoma, sans-serif; display: flex; flex-direction: column; padding: 56px 16px 32px; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="DrvVehicleAr.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #262a67"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></a>
<span style="font-size: 13px; font-weight: 600; color: #5b5f86">الخطوة ٦ من ٧</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 26px; line-height: 40px; font-weight: 700">مستندات السائق</h1>
<p style="margin: 0; font-size: 14px; line-height: 22px; font-weight: 500; color: #5b5f86">صور واضحة تظهر فيها الزوايا الأربع.</p>
</div>
<sc-for list="{{docs}}" as="d" hint-placeholder-count="5">
<div style="{{d.box}}">
<span style="{{d.iconStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{d.icon}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{d.t}}</span><span style="{{d.noteStyle}}">{{d.note}}</span></span>
<button style="height: 44px; padding: 0 8px; border: none; background: transparent; color: #c93a00; font-family: inherit; font-size: 14px; font-weight: 700">{{d.btn}}</button>
</div>
</sc-for>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 20px; font-weight: 500"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #262a67; flex-shrink: 0">أوافق على إجراء تحاليل مخبرية متى طلبت تريبس إنجوي ذلك، ويُوقف حسابي حتى اعتماد النتيجة.</label>
<a href="DrvReviewAr.dc.html" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">إرسال للمراجعة</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const box = (dashed) => 'display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #ffffff; border: 1px ' + (dashed ? 'dashed #7b7fa6;' : 'solid #e3dfc9;');
const ic = (bg, fg) => 'width: 36px; height: 36px; flex-shrink: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: ' + bg + '; color: ' + fg + ';';
const ok = { box: box(false), icon: 'M5 12l5 5L20 7', iconStyle: ic('#e3f3ea', '#1f7a4d'), noteStyle: 'font-size: 13px; font-weight: 500; color: #1f7a4d;', btn: 'استبدال' };
const bad = { box: box(false), icon: 'M12 8v5M12 16.5v.01', iconStyle: ic('#fde8e6', '#b42318'), noteStyle: 'font-size: 13px; font-weight: 500; color: #b42318;', btn: 'إعادة التصوير' };
const add = { box: box(true), icon: 'M12 5v14M5 12h14', iconStyle: ic('#f6f3e4', '#262a67'), noteStyle: 'font-size: 13px; font-weight: 500; color: #5b5f86;', btn: 'إضافة' };
return { docs: [
{ ...ok, t: 'الهوية الوطنية', note: 'تم الرفع · الوجهان' },
{ ...bad, t: 'رخصة القيادة', note: 'الصورة غير واضحة — أعد التصوير في إضاءة جيدة' },
{ ...add, t: 'استمارة المركبة', note: 'مطلوبة' },
{ ...add, t: 'صورة شخصية مع الهوية', note: 'لمطابقة وجهك مع الهوية' },
{ ...add, t: 'نتيجة التحليل المخبري الأولي', note: 'فحص مخدرات صادر خلال ٣٠ يوماً' }
] };
}
}
</script>
</body>
</html>
