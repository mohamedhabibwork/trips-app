<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moderator · Check-in result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #1d2050; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">

<div style="position: absolute; top: 56px; left: 16px; right: 16px; display: flex; align-items: center; gap: 10px">
<a href="ModScan.dc.html" aria-label="Back to scanner" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; background: rgba(255,255,255,0.78); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 10px 30px rgba(38,42,103,0.18); border-radius: 999px; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="height: 44px; padding: 0 18px; box-sizing: border-box; background: rgba(255,255,255,0.78); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 10px 30px rgba(38,42,103,0.18); border-radius: 999px; display: flex; align-items: center"><h1 style="margin: 0; font-size: 16px; font-weight: 700">Check-in result · Bus 2</h1></div>
</div>

<section aria-labelledby="cr-h" style="position: absolute; left: 0; right: 0; bottom: 0; top: 140px; box-sizing: border-box; padding: 20px 16px 132px; background: #ffffff; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 12px">

<div role="alert" style="{{bannerStyle}}">
<span style="{{iconWrap}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icon}}"></path></svg></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em">{{kicker}}</span>
<h2 id="cr-h" style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 700; color: #262a67">{{headline}}</h2>
<span style="font-size: 14px; line-height: 20px; color: #262a67">{{detail}}</span>
</div>
</div>

<sc-if value="{{isRedirect}}" hint-placeholder-val="{{true}}">
<div role="img" aria-label="This booking belongs to vehicle 3" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: #262a67; color: #f6f3e4">
<span style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 16px; background: #ff6c2e; color: #262a67; font-size: 40px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #b8bad6">Send the traveler to</span><span style="font-size: 22px; font-weight: 700">Vehicle 3</span><span style="font-size: 13px; color: #b8bad6">Not checked in on Bus 2</span></span>
</div>
</sc-if>

<dl style="margin: 0; padding: 4px 16px; border-radius: 16px; border: 1px solid #e3dfc9; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #e3dfc9; font-size: 14px"><dt style="color: #5b5f86">{{r.k}}</dt><dd style="margin: 0; font-weight: 600; text-align: end">{{r.v}}</dd></div>
</sc-for>
</dl>

<sc-if value="{{isQueued}}" hint-placeholder-val="{{false}}">
<a href="ModSyncQueue.dc.html" style="min-height: 44px; padding: 8px 12px; box-sizing: border-box; border-radius: 12px; background: #e6e8f5; color: #262a67; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg><span style="flex-grow: 1">4 events waiting to send</span><span style="color: #c93a00">Open queue</span></a>
</sc-if>

<p style="margin: 0; display: flex; gap: 8px; font-size: 13px; line-height: 18px; color: #5b5f86"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#262a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4"></path></svg><span>{{note}}</span></p>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<a href="ModScan.dc.html" style="height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"></path></svg>Next traveler</a>
<a href="ModManifest.dc.html" style="height: 44px; border-radius: 12px; color: #262a67; font-weight: 600; font-size: 15px; text-decoration: none; display: flex; align-items: center; justify-content: center">Back to manifest</a>
</div>
</section>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px">
<dc-import name="TabBar" role="moderator" active="scan" hint-size="390px,120px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["redirect","accepted","refused","duplicate","full","queued"],"default":"redirect"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      check: 'M5 12.5l4.5 4.5L19 7',
      alert: 'M12 3l9.5 17h-19zM12 10v4M12 17h.01',
      close: 'M6 6l12 12M18 6L6 18',
      arrow: 'M5 12h14M13 6l6 6-6 6',
      clock: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2',
      bus: 'M6 4h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM4 11h16M8 18v2M16 18v2M8 14.5h.01M16 14.5h.01'
    };
    const T = {
      ok: ['#e3f3ea', '#1f7a4d'], warn: ['#fdf0d5', '#8a4b00'], bad: ['#fde8e6', '#b42318'], info: ['#e6e8f5', '#262a67'], live: ['#ffe7dc', '#c93a00']
    };
    const S = {
      redirect: { tone: 'live', icon: I.arrow, kicker: 'DIFFERENT VEHICLE', headline: 'Belongs to vehicle 3', detail: 'This booking is on the same trip, on another vehicle.',
        rows: [['Code scanned', 'TE-48455'], ['Time', '06:04'], ['Checked in here', 'No']],
        note: 'Only operations can move a booking to another vehicle. Every move is logged.' },
      accepted: { tone: 'ok', icon: I.check, kicker: 'BOARDED', headline: 'Faisal Al-Qahtani · Seat 3D', detail: 'Checked in on Bus 2 at 06:04.',
        rows: [['On board', '32 of 43'], ['Booking', 'TE-48207'], ['Parent notice', 'Sent']],
        note: 'A check-in cannot be undone on this phone. Ask operations to correct a mistake.' },
      refused: { tone: 'bad', icon: I.close, kicker: 'NOT ALLOWED TO BOARD', headline: 'Booking cancelled and refunded', detail: 'This code is no longer valid for any vehicle on this trip.',
        rows: [['Code scanned', 'TE-48390'], ['Time', '06:04'], ['Other reasons', 'Different trip · No booking']],
        note: 'Walk-ins are not allowed. Send the traveler to operations to book.' },
      duplicate: { tone: 'warn', icon: I.alert, kicker: 'ALREADY CHECKED IN', headline: 'Sara Al-Qahtani · Seat 3C', detail: 'First checked in on Bus 2 at 05:51. Nothing was recorded this time.',
        rows: [['First check-in', '05:51'], ['This scan', '06:04'], ['On board', '31 of 43']],
        note: 'Duplicate scans are logged but never counted twice.' },
      full: { tone: 'bad', icon: I.bus, kicker: 'VEHICLE FULL', headline: 'Bus 2 has no free seat', detail: 'All 43 booked seats are checked in. This traveler cannot board Bus 2.',
        rows: [['Code scanned', 'TE-48511'], ['On board', '43 of 43'], ['Time', '06:04']],
        note: 'Contact operations. Only they can place a traveler on another vehicle.' },
      queued: { tone: 'info', icon: I.clock, kicker: 'SAVED ON THIS DEVICE', headline: 'Omar Al-Qahtani · Seat 4C', detail: 'You are offline. The check-in will send when the connection returns.',
        rows: [['Event time', '06:04'], ['Status', 'Waiting to send'], ['Final result', 'After sync']],
        note: 'The server can still change this result; any change shows in the queue.' }
    };
    const key = S[this.props.result] ? this.props.result : 'redirect';
    const s = S[key];
    const [bg, fg] = T[s.tone];
    return {
      bannerStyle: 'padding: 14px; border-radius: 16px; background: ' + bg + '; color: ' + fg + '; display: flex; gap: 12px; align-items: flex-start',
      iconWrap: 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: ' + fg + '; display: flex; align-items: center; justify-content: center',
      frame: 'position: absolute; left: 135px; top: 60px; width: 120px; height: 68px; box-sizing: border-box; border-radius: 20px; border: 3px solid ' + (s.tone === 'ok' ? '#3fb27f' : s.tone === 'bad' ? '#e5534b' : s.tone === 'info' ? '#b8bad6' : '#ff8655'),
      icon: s.icon, kicker: s.kicker, headline: s.headline, detail: s.detail, note: s.note,
      rows: s.rows.map(([k, v]) => ({ k, v })),
      isRedirect: key === 'redirect', isQueued: key === 'queued'
    };
  }
}
</script>
</body>
</html>
