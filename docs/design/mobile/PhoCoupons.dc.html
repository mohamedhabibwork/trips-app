<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photographer · Coupons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="PhoEarnings.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">My coupons</h1><span style="font-size: 13px; color: #5b5f86">Limit 2 of 10 used · Studio</span></div>
</div>

<div style="padding: 12px 14px; border-radius: 12px; background: #e6e8f5; display: flex; gap: 10px; font-size: 14px; line-height: 20px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8h.01"></path></svg>
<span>Only applies to bookings where you are the photographer. Trip seats and programs are priced by the company and can't be discounted here.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{coupons}}" as="c" hint-placeholder-count="3">
<section style="padding: 14px 16px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="padding: 4px 10px; border-radius: 8px; border: 1px dashed #262a67; font-size: 16px; font-weight: 700; letter-spacing: 0.04em">{{c.code}}</span>
<span style="flex-grow: 1"></span>
<span style="{{c.ss}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>{{c.status}}</span>
</div>
<span style="font-size: 15px; font-weight: 600">{{c.what}}</span>
<span style="font-size: 13px; line-height: 18px; color: #5b5f86">{{c.rules}}</span>
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex-grow: 1; height: 6px; border-radius: 999px; background: #e3dfc9; display: flex; overflow: hidden"><span style="{{c.bar}}"></span></span>
<span style="font-size: 13px; font-weight: 600">{{c.used}}</span>
</div>
<sc-if value="{{c.canToggle}}" hint-placeholder-val="{{true}}">
<div style="display: flex; gap: 8px; padding-top: 4px">
<button onClick="{{c.toggle}}" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{c.toggleLabel}}</button>
<button style="height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: #b42318; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Revoke</button>
</div>
</sc-if>
</section>
</sc-for>
</div>

<a href="PhoCouponNew.dc.html" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Create coupon</a>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { paused: { FIRSTSHOOT: true } }; }
  renderVals() {
    const ICON = { Active: 'M5 12.5l4.5 4.5L19 7', Paused: 'M9 6v12M15 6v12', Expired: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2' };
    const TONE = { Active: 'background: #e3f3ea; color: #1f7a4d;', Paused: 'background: #fdf0d5; color: #8a4b00;', Expired: 'background: #e6e8f5; color: #262a67;' };
    const C = [
      { code: 'NOURA15', what: '15% off my photo packages', rules: 'Percentage · 1 use per person · ends Wed 31 Dec · public', u: 9, max: 50, live: true },
      { code: 'FIRSTSHOOT', what: '200 SAR off your first booking with me', rules: 'First booking · min 1,000 SAR · ends Sat 15 Nov', u: 3, max: 20, live: true },
      { code: 'SUMMER10', what: '10% off summer trips', rules: 'Percentage · ended Sun 31 Aug', u: 14, max: 30, live: false }
    ];
    const coupons = C.map((c) => {
      const status = !c.live ? 'Expired' : (this.state.paused[c.code] ? 'Paused' : 'Active');
      return { ...c, status, icon: ICON[status], used: c.u + ' of ' + c.max + ' used',
        ss: 'display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; ' + TONE[status],
        bar: 'width: ' + Math.round(c.u / c.max * 100) + '%; background: #262a67; border-radius: 999px',
        canToggle: c.live, toggleLabel: status === 'Paused' ? 'Resume' : 'Pause',
        toggle: () => this.setState({ paused: { ...this.state.paused, [c.code]: !this.state.paused[c.code] } }) };
    });
    return { coupons };
  }
}
</script>
</body>
</html>
