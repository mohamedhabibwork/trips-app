<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver · Trip complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="DrvOnRoute.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Trip day complete</h1>
</div>

<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 999px; background: #e3f3ea; color: #1f7a4d; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
<span style="font-size: 15px; line-height: 21px">Everyone on Bus 2 is back at Shaden Resort. Nadia checked out 43 of 43 at 20:34.</span>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="padding: 12px 14px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column"><span style="font-size: 13px; color: #5b5f86">{{s.l}}</span><span style="font-size: 22px; font-weight: 700">{{s.v}}</span></div>
</sc-for>
</div>

<div style="padding: 16px; border-radius: 20px; background: #262a67; color: #f6f3e4; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #b8bad6">Earned for this trip day</span><span style="font-size: 28px; line-height: 34px; font-weight: 700">1,450 SAR</span><span style="font-size: 13px; color: #b8bad6">Payout on Mon 20 Oct · bank ending 2207</span></span>
<a href="DrvEarnings.dc.html" style="font-size: 14px; font-weight: 600; color: #ff8655">Earnings</a>
</div>

<section aria-labelledby="rate-h" style="padding: 14px 16px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 10px">
<h2 id="rate-h" style="margin: 0; font-size: 16px; font-weight: 600">Rate Sunrise Tours Co.</h2>
<div role="radiogroup" aria-label="Rating" style="display: flex; gap: 4px">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{s.sel}}" aria-label="{{s.aria}}" onClick="{{s.go}}" style="width: 48px; height: 48px; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></button>
</sc-for>
</div>
<div role="group" aria-label="What went well" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="4">
<button type="button" aria-pressed="{{t.sel}}" onClick="{{t.go}}" style="{{t.style}}">{{t.t}}</button>
</sc-for>
</div>
</section>

<a href="DrvHome.dc.html" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">{{cta}}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { rating: 5, tags: [true, true, false, false] }; }
  renderVals() {
    const stats = [['Distance', '68 km'], ['Duration', '12 h 50 m'], ['Stops', '4 of 4'], ['Passengers', '43']].map(([l, v]) => ({ l, v }));
    const r = this.state.rating;
    const stars = [1, 2, 3, 4, 5].map((n) => ({ sel: n === r ? 'true' : 'false', aria: n + (n === 1 ? ' star' : ' stars'),
      fill: n <= r ? '#f89e23' : 'none', stroke: n <= r ? '#8a4b00' : '#7b7fa6', go: () => this.setState({ rating: n }) }));
    const tg = this.state.tags;
    const tags = ['On time', 'Clear itinerary', 'Helpful ops', 'Easy parking'].map((t, i) => ({ t, sel: tg[i] ? 'true' : 'false',
      go: () => { const a = tg.slice(); a[i] = !a[i]; this.setState({ tags: a }); },
      style: 'height: 40px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (tg[i] ? 'background: #262a67; color: #f6f3e4; border: 1px solid #262a67;' : 'background: #ffffff; color: #262a67; border: 1px solid #7b7fa6;') }));
    return { stats, stars, tags, cta: 'Send rating & go home' };
  }
}
</script>
</body>
</html>
