<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إنشاء حساب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&amp;family=Outfit:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f3e4; color: #262a67; font-family: Cairo, 'Readex Pro', Tahoma, sans-serif; display: flex; flex-direction: column; padding: 48px 16px 24px; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="{{back}}" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #262a67"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></a>
<span style="font-size: 13px; font-weight: 600; color: #5b5f86">{{step}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 26px; line-height: 40px; font-weight: 700">أنشئ حسابك</h1>
<p style="margin: 0; font-size: 15px; line-height: 24px; font-weight: 500; color: #5b5f86">التسجيل كـ <span style="font-weight: 700; color: #262a67">{{roleAr}}</span> · <a href="MobileRoleAr.dc.html" style="font-weight: 700">تغيير</a></p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ar-su-n" style="font-size: 14px; font-weight: 600">الاسم الكامل</label>
<input id="ar-su-n" dir="auto" autocomplete="name" value="{{person}}" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font-family: inherit; font-size: 16px">
</div>
<dc-import name="CountryField" label="الدولة" country="SA" dir="rtl" field-id="ar-su-c" hint-size="100%,78px"></dc-import>
<dc-import name="PhoneField" label="رقم الجوال" value="551234821" country="SA" dir="rtl" field-id="ar-su-p" hint-size="100%,78px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ar-su-e" style="font-size: 14px; font-weight: 600">البريد الإلكتروني <span style="font-weight: 500; color: #5b5f86">(اختياري)</span></label>
<input id="ar-su-e" type="email" dir="ltr" placeholder="name@example.com" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font-family: Outfit, sans-serif; font-size: 16px; text-align: right">
</div>
<dc-import name="PasswordField" label="كلمة المرور" value="Trips2026" show-strength="{{yes}}" is-new="{{yes}}" dir="rtl" field-id="ar-su-pw" hint-size="100%,112px"></dc-import>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 22px"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #262a67; flex-shrink: 0">أوافق على <a href="#">الشروط</a> و<a href="#">سياسة الخصوصية</a>.</label>
<a href="{{next}}" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">إنشاء الحساب</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["traveler","driver","photographer"],"default":"traveler"},"step":{"editor":"text","default":"الخطوة ٢ من ٤"},"next":{"editor":"text","default":"MobileOtpAr.dc.html"},"back":{"editor":"text","default":"MobileRoleAr.dc.html"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const r = this.props.role ?? 'traveler';
const L = { traveler: ['مسافر', 'سارة القحطاني'], driver: ['سائق', 'خالد الحربي'], photographer: ['مصوّر', 'نورة الشهري'] }[r] || ['مسافر', 'سارة القحطاني'];
return { yes: true, roleAr: L[0], person: L[1], step: this.props.step ?? 'الخطوة ٢ من ٤', next: this.props.next ?? 'MobileOtpAr.dc.html', back: this.props.back ?? 'MobileRoleAr.dc.html' }; }
}
</script>
</body>
</html>
