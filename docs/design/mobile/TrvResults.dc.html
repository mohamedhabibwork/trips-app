<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traveler · Search results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 120px; display: flex; flex-direction: column; gap: 12px">

<div style="height: 52px; box-sizing: border-box; padding: 0 6px 0 16px; border-radius: 999px; background: #ffffff; border: 1px solid #7b7fa6; display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#262a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; line-height: 18px">
<span style="font-size: 15px; font-weight: 600">AlUla &amp; nearby · from Riyadh</span>
<span style="font-size: 13px; color: #5b5f86">16 – 18 Oct · 2 adults, 2 children</span>
</span>
<a href="TrvSearch.dc.html" style="height: 40px; padding: 0 14px; border-radius: 999px; background: #f6f3e4; color: #262a67; font-size: 14px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Edit</a>
</div>

<div role="group" aria-label="Sort and filters" style="display: flex; gap: 8px; overflow: hidden; margin-inline-end: -16px">
<a href="TrvSearch.dc.html" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; background: #262a67; color: #f6f3e4; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filters · 4</a>
<sc-for list="{{sorts}}" as="c" hint-placeholder-count="3"><button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.t}}</button></sc-for>
</div>

<p style="margin: 0; font-size: 14px; color: #5b5f86"><strong style="color: #262a67">24 trips</strong> match · {{sortLabel}}</p>

<sc-for list="{{trips}}" as="t" hint-placeholder-count="4">
<a href="TrvTrip.dc.html" style="padding: 10px; border-radius: 20px; background: #ffffff; color: #262a67; text-decoration: none; display: flex; gap: 12px">
<span style="position: relative; width: 92px; height: 98px; flex-shrink: 0; border-radius: 12px; background: #262a67; overflow: hidden; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.hasImg}}" hint-placeholder-val="{{true}}"><img src="{{t.img}}" alt="{{t.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></sc-if>
<sc-if value="{{t.noImg}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#b8bad6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM20 15l-5-5L5 20"></path></svg></sc-if>
</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; line-height: 20px; font-weight: 600">{{t.title}}</span>
<span style="font-size: 13px; line-height: 17px; color: #5b5f86">{{t.company}} · {{t.date}}</span>
<span style="font-size: 13px; line-height: 17px; color: #5b5f86">From {{t.from}} · <span style="{{t.seatStyle}}">{{t.seats}}</span></span>
<span style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px">
<span style="{{t.badgeStyle}}">{{t.badge}}</span>
<span style="font-size: 12px; color: #5b5f86; white-space: nowrap">from <strong style="font-size: 16px; color: #262a67">{{t.price}}</strong> SAR</span>
</span>
</span>
</a>
</sc-for>

</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px">
<dc-import name="TabBar" role="traveler" active="explore" hint-size="390px,120px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sort: 'Soonest' }; }
  renderVals() {
    const cur = this.state.sort;
    const sorts = ['Soonest', 'Lowest price', 'Top rated'].map((t) => ({ t, on: t === cur ? 'true' : 'false', pick: () => this.setState({ sort: t }),
      style: 'flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (t === cur ? 'background: rgba(255,108,46,0.16); color: #c93a00; border: 1px solid #fb8030;' : 'background: #ffffff; color: #262a67; border: 1px solid #7b7fa6;') }));
    const T = [
      { title: 'AlUla Heritage Weekend', company: 'Sunrise Tours Co.', date: 'Thu 16 Oct', from: 'Riyadh', seats: '23 seats left', low: false, price: '1,250', badge: 'Child tracking', kind: 'info', img: '../assets/44a218548719fe367b614a0dd5151345.svg', alt: 'AlUla sandstone rock formations under a night sky' },
      { title: 'Red Sea Snorkel Day', company: 'Sunrise Tours Co.', date: 'Fri 24 Oct', from: 'Jeddah', seats: '4 seats left', low: true, price: '320', badge: 'Almost full', kind: 'amber', img: '../assets/dc9df8d5382e0fc7d2bf084f5632c713.svg', alt: 'A boat on turquoise water over a Red Sea coral reef' },
      { title: 'Edge of the World Hike', company: 'Najd Adventures', date: 'Sat 25 Oct', from: 'Riyadh', seats: '18 seats left', low: false, price: '275', badge: 'VIP early access', kind: 'navy', img: '../assets/767dc865917d29911dbc19beb44053f6.svg', alt: 'Hikers at the Edge of the World cliffs at sunrise' },
      { title: 'Taif Rose Farms', company: 'Hijaz Journeys', date: 'Fri 31 Oct', from: 'Riyadh', seats: '31 seats left', low: false, price: '410', badge: 'Seat selection', kind: 'info', img: '../assets/cc51d7ccafd703646b5cfbed3b8222aa.svg', alt: 'Rows of pink roses at a Taif rose farm' }
    ];
    const B = { info: 'background: #e6e8f5; color: #262a67;', amber: 'background: #f89e23; color: #262a67;', navy: 'background: #262a67; color: #f6f3e4;' };
    let trips = T.map((t) => ({ ...t, hasImg: !!t.img, noImg: !t.img,
      seatStyle: 'font-weight: 600; color: ' + (t.low ? '#b42318;' : '#1f7a4d;'),
      badgeStyle: 'padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; ' + B[t.kind] }));
    if (cur === 'Lowest price') trips = trips.slice().sort((a, b) => parseInt(a.price.replace(',', '')) - parseInt(b.price.replace(',', '')));
    return { sorts, trips, sortLabel: 'sorted by ' + cur.toLowerCase() };
  }
}
</script>
</body>
</html>
