<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photographer · Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 16px 32px; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="PhoOtp.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #262a67"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="font-size: 13px; font-weight: 500; color: #5b5f86">Step 4 of 6</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700">Your photographer profile</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #5b5f86">This is what trip organizers and travelers see.</p>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<img src="../assets/380d7985babc06d16544f4085cdec2d7.svg" alt="Your profile photo" style="width: 64px; height: 64px; border-radius: 999px; object-fit: cover; object-position: center">
<button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font-family: inherit; font-size: 14px; font-weight: 600">Upload profile photo</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="pp-name" style="font-size: 14px; font-weight: 600">Display name</label><input id="pp-name" dir="auto" value="Noura Shots" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font-family: inherit; font-size: 16px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="pp-id" style="font-size: 14px; font-weight: 600">National ID / Iqama number</label><input id="pp-id" inputmode="numeric" value="1093318820" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font-family: inherit; font-size: 16px"></div>
<fieldset style="margin: 0; padding: 0; border: none">
<legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">What do you shoot?</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
<button aria-pressed="{{t.on}}" onClick="{{t.tog}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="pp-price" style="font-size: 14px; font-weight: 600">Starting price per trip (SAR)</label><input id="pp-price" inputmode="numeric" value="750" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font-family: inherit; font-size: 16px"></div>
<a href="PhoSignUpPortfolio.dc.html" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { on: { 'Group trips': true, 'Events': true } }; }
renderVals() {
const xs = ['Group trips', 'Events', 'School trips', 'Drone', 'Video', 'Portraits'];
return { tags: xs.map(l => { const on = !!this.state.on[l]; return { label: l, on: on ? 'true' : 'false',
style: 'height: 40px; padding: 0 14px; border-radius: 999px; background: #ffffff; color: #262a67; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'border: 2px solid #fb8030;' : 'border: 1px solid #7b7fa6;'),
tog: () => this.setState({ on: { ...this.state.on, [l]: !on } }) }; }) };
}
}
</script>
</body>
</html>
