<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traveler · Help &amp; support</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="TrvProfile.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Help &amp; support</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="help-q" style="font-size: 14px; font-weight: 600">Search help</label>
<div style="position: relative">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#262a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; top: 16px; inset-inline-start: 14px"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
<input id="help-q" type="search" placeholder="e.g. change my seat" style="width: 100%; box-sizing: border-box; height: 52px; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px 0 44px; font: inherit; font-size: 16px; color: #262a67">
</div>
</div>

<h2 style="margin: 2px 0 0; font-size: 16px; font-weight: 600">Popular topics</h2>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="4">
<a href="#" style="min-height: 60px; padding: 10px 12px; box-sizing: border-box; border-radius: 12px; background: #ffffff; color: #262a67; text-decoration: none; display: flex; align-items: center; gap: 10px">
<span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #e6e8f5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>
<span style="font-size: 14px; line-height: 18px; font-weight: 600">{{t.t}}</span>
</a>
</sc-for>
</div>

<h2 style="margin: 2px 0 0; font-size: 16px; font-weight: 600">Contact us</h2>
<div style="border-radius: 20px; background: #ffffff; padding: 0 16px">
<a href="TrvChat.dc.html" style="min-height: 56px; display: flex; align-items: center; gap: 12px; color: #262a67; text-decoration: none; border-bottom: 1px solid #e3dfc9"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM4 11h16M8 18v2M16 18v2M8 14.5h.01M16 14.5h.01"></path></svg><span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Chat with your organizer</span><span style="font-size: 12px; color: #5b5f86">Sunrise Tours Co. · bookings, programs, pickup</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<a href="TrvChat.dc.html" style="min-height: 56px; display: flex; align-items: center; gap: 12px; color: #262a67; text-decoration: none; border-bottom: 1px solid #e3dfc9"><img src="../assets/d8314577d8376991a72b92ec8ec2dadb.svg" alt="" style="width: 20px; height: 20px; object-fit: contain"><span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Chat with Trips Enjoy</span><span style="font-size: 12px; color: #5b5f86">Payments, refunds, your account · priority for Explorer</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<a href="#" style="min-height: 56px; display: flex; align-items: center; gap: 12px; color: #262a67; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg><span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Call us</span><span style="font-size: 12px; color: #5b5f86">800 124 0099 · daily 08:00–22:00</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
</div>

<h2 style="margin: 2px 0 0; font-size: 16px; font-weight: 600">Your requests</h2>
<div style="border-radius: 20px; background: #ffffff; padding: 0 16px">
<sc-for list="{{tickets}}" as="k" hint-placeholder-count="2">
<a href="TrvChat.dc.html" style="{{k.row}}">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{k.t}}</span><span style="font-size: 12px; color: #5b5f86">{{k.meta}}</span></span>
<span style="{{k.pill}}">{{k.status}}</span>
</a>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const topics = [
      ['Cancellations', 'M6 6l12 12M18 6L6 18'],
      ['Refunds', 'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7'],
      ['Seat changes', 'M7 4h7a2 2 0 0 1 2 2v7H7zM5 13h12a2 2 0 0 1 2 2v2H5zM7 17v3M17 17v3'],
      ['Child tracking', 'M12 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM8.5 15.5a5 5 0 0 1 0-7M15.5 8.5a5 5 0 0 1 0 7M5.6 18.4a9 9 0 0 1 0-12.8M18.4 5.6a9 9 0 0 1 0 12.8']
    ].map(([t, d]) => ({ t, d }));
    const K = [
      { t: 'Album download stopped halfway', meta: '#S-20418 · Trips Enjoy · updated today', status: 'In progress', c: 'background: #fdf0d5; color: #8a4b00;' },
      { t: 'Wheelchair space on Bus 2', meta: '#S-20377 · Sunrise Tours Co. · Sat 4 Oct', status: 'Answered', c: 'background: #e3f3ea; color: #1f7a4d;' }
    ];
    const tickets = K.map((k, i) => ({ ...k,
      pill: 'flex-shrink: 0; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; ' + k.c,
      row: 'min-height: 60px; display: flex; align-items: center; gap: 12px; color: #262a67; text-decoration: none;' + (i < K.length - 1 ? ' border-bottom: 1px solid #e3dfc9;' : '') }));
    return { topics, tickets };
  }
}
</script>
</body>
</html>
