<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traveler · Tax invoices &amp; receipts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="TrvProfile.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Tax invoices &amp; receipts</h1>
</div>

<div style="display: flex; align-items: center; gap: 8px">
<div role="group" aria-label="Year" style="display: flex; gap: 8px; flex-grow: 1">
<sc-for list="{{years}}" as="y" hint-placeholder-count="2"><button type="button" aria-pressed="{{y.sel}}" onClick="{{y.on}}" style="{{y.style}}">{{y.t}}</button></sc-for>
</div>
<span style="font-size: 13px; color: #5b5f86">{{summary}}</span>
</div>

<div style="border-radius: 20px; background: #ffffff; padding: 0 8px 0 14px">
<sc-for list="{{items}}" as="r" hint-placeholder-count="6">
<div style="{{r.row}}">
<span style="{{r.iconBox}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg></span>
<a href="{{r.href}}" aria-label="{{r.open}}" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; color: #262a67; text-decoration: none">
<span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span>
<span style="font-size: 12px; font-weight: 600; color: #c93a00">{{r.doc}}</span>
<span style="font-size: 12px; color: #5b5f86; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.meta}}</span>
</a>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0">
<span style="font-size: 15px; font-weight: 700">{{r.amt}}</span>
<span style="{{r.pill}}">{{r.status}}</span>
</span>
<a href="../pdf/PdfInvoiceB2C.dc.html" aria-label="{{r.dl}}" style="width: 40px; height: 44px; flex-shrink: 0; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg></a>
</div>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<div style="padding: 12px 14px; border-radius: 12px; background: #ffffff; border: 1px solid #e3dfc9; display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Export to CSV</span><span style="font-size: 13px; color: #5b5f86">Export needs VIP. You’re on Explorer.</span></span>
<a href="TrvPlan.dc.html" style="font-size: 14px; font-weight: 600">See VIP</a>
</div>
<a href="../pdf/PdfInvoiceB2C.dc.html" style="height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>{{pdfLabel}}</a>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { year: '2026' }; }
  renderVals() {
    const I = {
      ticket: 'M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2.5 2.5 0 0 0 0 5v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3a2.5 2.5 0 0 0 0-5zM14 5v14',
      star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',
      refresh: 'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7'
    };
    const D = {
      '2026': [
        { k: 'ticket', t: 'AlUla Heritage Weekend', meta: 'INV-ST-2026-004812 · Mon 6 Oct · Visa 4421', amt: '4,592 SAR', st: 'paid' },
        { k: 'refresh', t: 'Edge of the World Hike', meta: 'CN-ST-2026-000877 · Fri 3 Oct · 2 seats', amt: '+550 SAR', st: 'refunded' },
        { k: 'star', t: 'Explorer plan · October', meta: 'Wed 1 Oct · monthly', amt: '19 SAR', st: 'paid' },
        { k: 'ticket', t: 'Red Sea Snorkel Day', meta: 'TE-47760 · Sun 28 Sep · Visa 4421', amt: '640 SAR', st: 'paid' },
        { k: 'ticket', t: 'Taif Rose Farms', meta: 'TE-46102 · Mon 15 Sep · mada', amt: '1,860 SAR', st: 'paid' },
        { k: 'star', t: 'Explorer plan · September', meta: 'Mon 1 Sep · monthly', amt: '19 SAR', st: 'paid' },
        { k: 'ticket', t: 'Jeddah Corniche Night', meta: 'TE-44391 · Tue 2 Sep · Apple Pay', amt: '380 SAR', st: 'paid' }
      ],
      '2025': [
        { k: 'star', t: 'Explorer plan · December', meta: 'Mon 1 Dec · monthly', amt: '19 SAR', st: 'paid' },
        { k: 'ticket', t: 'Edge of the World Hike', meta: 'TE-31877 · Fri 14 Nov · mada', amt: '550 SAR', st: 'paid' },
        { k: 'refresh', t: 'Jeddah Corniche Night', meta: 'Partial refund · Sun 5 Oct', amt: '+190 SAR', st: 'refunded' }
      ]
    };
    const P = {
      paid: ['Paid', 'background: #e3f3ea; color: #1f7a4d;'],
      refunded: ['Refunded', 'background: #e6e8f5; color: #262a67;']
    };
    const DOC = { ticket: 'Tax invoice', refresh: 'Credit note', star: 'Tax invoice · Trips Enjoy' };
    const HREF = { ticket: 'TrvInvoice.dc.html', refresh: 'TrvCancelled.dc.html', star: 'TrvPlan.dc.html' };
    const y = this.state.year;
    const list = D[y];
    const items = list.map((r, i) => ({
      t: r.t, meta: r.meta, amt: r.amt, d: I[r.k], status: P[r.st][0], dl: 'Download PDF of ' + DOC[r.k].toLowerCase() + ' for ' + r.t + ', ' + r.meta,
      pill: 'padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; ' + P[r.st][1],
      doc: DOC[r.k], href: HREF[r.k], open: 'Open ' + DOC[r.k].toLowerCase() + ' for ' + r.t,
      row: 'min-height: 62px; display: flex; align-items: center; gap: 10px;' + (i < list.length - 1 ? ' border-bottom: 1px solid #e3dfc9;' : ''),
      iconBox: 'width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; ' + (r.st === 'refunded' ? 'background: #e3f3ea; color: #1f7a4d;' : 'background: #e6e8f5; color: #262a67;')
    }));
    const years = ['2026', '2025'].map((t) => ({ t, sel: t === y ? 'true' : 'false', on: () => this.setState({ year: t }),
      style: 'height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (t === y ? 'background: #262a67; color: #f6f3e4; border: 1px solid #262a67;' : 'background: #ffffff; color: #262a67; border: 1px solid #7b7fa6;') }));
    return { items, years, summary: list.length + ' records', pdfLabel: 'Download ' + y + ' as PDF' };
  }
}
</script>
</body>
</html>
