<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver · Edit vehicle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 8px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="DrvVehicles.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-size: 22px; line-height: 28px; font-weight: 700">Edit vehicle</h1>
<span style="font-size: 13px; color: #5b5f86">Changes are re-checked</span>
</div>

<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="model" style="font-size: 14px; line-height: 18px; font-weight: 600">Make &amp; model</label><input id="model" type="text" value="Mercedes-Benz Tourismo" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="year" style="font-size: 14px; line-height: 18px; font-weight: 600">Year</label><input id="year" type="text" inputmode="numeric" value="2022" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67; width: 100%"></div>
</div>

<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="plate" style="font-size: 14px; line-height: 18px; font-weight: 600">Plate number</label><input id="plate" type="text" dir="ltr" value="ABC 4821" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font-family: ui-monospace, Menlo, monospace; font-size: 16px; font-weight: 700; letter-spacing: 0.06em; color: #262a67; width: 100%; text-align: left"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="seats" style="font-size: 14px; line-height: 18px; font-weight: 600">Seats</label><input id="seats" type="text" inputmode="numeric" value="{{seats}}" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67; width: 100%"></div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span id="lay-l" style="font-size: 14px; line-height: 18px; font-weight: 600">Seat layout type</span>
<div role="radiogroup" aria-labelledby="lay-l" style="display: flex; gap: 8px">
<sc-for list="{{layouts}}" as="l" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{l.sel}}" onClick="{{l.go}}" style="{{l.style}}"><span style="font-size: 16px; line-height: 20px; font-weight: 700">{{l.n}} seats</span><span style="font-size: 12px; line-height: 16px; font-weight: 500">{{l.t}}</span></button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; line-height: 18px; font-weight: 600">Photos</span><span style="font-size: 13px; line-height: 18px; color: #5b5f86">Exterior 2 · Interior {{interior}}</span></div>
<div style="display: flex; gap: 8px">
<span style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; overflow: hidden; background: #262a67"><img src="../assets/b2dc1c7bb6179469c82e971872c53cdd.svg" alt="Exterior photo 1: coach side view" style="width: 100%; height: 100%; object-fit: cover"></span>
<img src="../assets/b33043139687e3d53c2a4ccf4a1dee44.svg" alt="Exterior photo 2: coach front view" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; object-fit: cover">
<sc-for list="{{inTiles}}" as="p" hint-placeholder-count="1">
<img src="{{p.img}}" alt="{{p.al}}" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; object-fit: cover">
</sc-for>
<button type="button" onClick="{{addPhoto}}" style="flex-grow: 1; height: 56px; border-radius: 12px; border: 1px dashed #7b7fa6; background: #ffffff; color: #262a67; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c93a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h2l2-2h4l2 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM12 9.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"></path></svg>Add photos</button>
</div>
</div>

<section aria-labelledby="docs-h" style="padding: 12px 16px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 10px">
<h2 id="docs-h" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0">Documents</h2>
<div style="min-height: 44px; display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5"></path></svg>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 20px; font-weight: 600">Registration (istimara)</span><span style="font-size: 13px; line-height: 18px; color: #1f7a4d; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>Valid · expires Aug 2027</span></span>
<button type="button" aria-label="Replace registration document" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg></button>
</div>
<div style="border-top: 1px solid #e3dfc9; padding-top: 10px; display: flex; flex-direction: column; gap: 8px">
<div style="min-height: 44px; display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6zM9 12l2 2 4-4"></path></svg>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 20px; font-weight: 600">Insurance policy</span><span style="{{insPill}}">{{insFile}}</span></span>
<button type="button" onClick="{{renew}}" style="height: 44px; padding: 0 12px; flex-shrink: 0; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>{{renewLabel}}</button>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<label for="insexp" style="flex-grow: 1; font-size: 14px; line-height: 18px; font-weight: 600">Insurance expiry<span style="display: block; font-size: 12px; line-height: 16px; font-weight: 400; color: #5b5f86">At least 3 more months</span></label>
<input id="insexp" type="text" value="{{insExp}}" aria-invalid="{{insInvalid}}" aria-describedby="ins-err" style="{{insInput}}">
</div>
<sc-if value="{{insErr}}" hint-placeholder-val="{{true}}"><span id="ins-err" style="font-size: 13px; line-height: 18px; color: #b42318">Insurance must be valid until at least 6 Jan 2027. Upload the renewed policy.</span></sc-if>
</div>
</section>

<div role="group" aria-label="On board" style="display: flex; gap: 8px">
<sc-for list="{{amen}}" as="m" hint-placeholder-count="3">
<button type="button" aria-pressed="{{m.on}}" onClick="{{m.go}}" style="{{m.style}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>{{m.t}}</button>
</sc-for>
</div>

<a href="DrvVehicles.dc.html" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Save vehicle</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lay: 0, renewed: false, inPh: 1, ac: true, wifi: true, ramp: false }; }
  renderVals() {
    const L = [['49', 'Coach 2 + 2'], ['30', 'Coaster'], ['14', 'Hiace']];
    const layouts = L.map(([n, t], i) => {
      const on = this.state.lay === i;
      return { n, t, sel: on ? 'true' : 'false', go: () => this.setState({ lay: i }),
        style: 'flex: 1 1 0; height: 56px; border-radius: 12px; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; ' + (on ? 'background: #262a67; color: #f6f3e4; border: 1px solid #262a67;' : 'background: #ffffff; color: #262a67; border: 1px solid #7b7fa6;') };
    });
    const r = this.state.renewed;
    const n = this.state.inPh;
    const inTiles = [];
    for (let i = 0; i < n; i++) inTiles.push({ al: 'Interior photo ' + (i + 1), img: '../assets/c2b6fb096becc4338329772e0c793a7d.svg' });
    const A = [['ac', 'AC'], ['wifi', 'Wi-Fi'], ['ramp', 'Wheelchair ramp']];
    const amen = A.map(([k, t]) => {
      const on = !!this.state[k];
      return { t, on: on ? 'true' : 'false', d: on ? 'M5 12.5l4.5 4.5L19 7' : 'M12 5v14M5 12h14', go: () => this.setState({ [k]: !this.state[k] }),
        style: 'flex: 1 1 auto; height: 44px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; ' + (on ? 'background: #262a67; color: #f6f3e4; border: 1px solid #262a67;' : 'background: #ffffff; color: #262a67; border: 1px solid #7b7fa6;') };
    });
    return {
      layouts, seats: L[this.state.lay][0],
      inTiles, interior: String(n), addPhoto: () => this.setState({ inPh: Math.min(n + 1, 3) }),
      insFile: r ? 'Valid · renewal in review' : 'Expires in 40 days',
      insPill: 'font-size: 13px; line-height: 18px; font-weight: 600; ' + (r ? 'color: #1f7a4d;' : 'color: #b42318;'),
      renewLabel: r ? 'Replace' : 'Upload',
      renew: () => this.setState({ renewed: true }),
      insExp: r ? '15 Nov 2027' : '15 Nov 2026',
      insInvalid: r ? 'false' : 'true',
      insErr: !r,
      insInput: 'width: 150px; flex-shrink: 0; height: 52px; box-sizing: border-box; border-radius: 8px; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67; ' + (r ? 'border: 1px solid #7b7fa6;' : 'border: 2px solid #b42318;'),
      amen
    };
  }
}
</script>
</body>
</html>
