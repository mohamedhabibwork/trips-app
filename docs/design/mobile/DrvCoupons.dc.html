<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver · My coupons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="DrvHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">My coupons</h1>
</div>

<a href="DrvPlanManage.dc.html" style="padding: 12px 16px; border-radius: 20px; background: #ffffff; color: #262a67; text-decoration: none; display: flex; flex-direction: column; gap: 8px">
<span style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">3 of 10 coupons used</span><span style="color: #5b5f86">Professional plan</span></span>
<span role="meter" aria-valuemin="0" aria-valuemax="10" aria-valuenow="3" aria-label="3 of 10 coupons used" style="height: 8px; border-radius: 999px; background: #e3dfc9; display: flex; overflow: hidden"><span style="width: 30%; background: #ff6c2e; border-radius: 999px"></span></span>
</a>

<p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: #e6e8f5; display: flex; gap: 8px; font-size: 13px; line-height: 18px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4"></path></svg><span>Only applies to bookings where you are the driver. Companies see the discount on your deal price.</span></p>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{coupons}}" as="c" hint-placeholder-count="3">
<div style="padding: 14px 16px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-family: ui-monospace, Menlo, monospace; font-size: 17px; font-weight: 700; letter-spacing: 0.04em">{{c.code}}</span>
<span style="{{c.pill}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>{{c.status}}</span>
</div>
<span style="font-size: 14px">{{c.desc}}</span>
<span style="font-size: 13px; color: #5b5f86">{{c.meta}}</span>
<sc-if value="{{c.hasUse}}" hint-placeholder-val="{{true}}">
<span role="meter" aria-valuemin="0" aria-valuemax="50" aria-valuenow="14" aria-label="{{c.useLabel}}" style="height: 6px; border-radius: 999px; background: #e3dfc9; display: flex; overflow: hidden"><span style="{{c.bar}}"></span></span>
</sc-if>
<sc-if value="{{c.canToggle}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{c.toggle}}" style="align-self: flex-start; height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{c.action}}</button>
</sc-if>
</div>
</sc-for>
</div>

<a href="DrvCouponNew.dc.html" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Create coupon</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { st: { KHALID10: 'Active', RIYADHVAN: 'Paused' } }; }
  renderVals() {
    const st = this.state.st;
    const look = {
      Active: ['background: #e3f3ea; color: #1f7a4d;', 'M5 12.5l4.5 4.5L19 7'],
      Paused: ['background: #fdf0d5; color: #8a4b00;', 'M9 5v14M15 5v14'],
      Expired: ['background: #e6e8f5; color: #5b5f86;', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2']
    };
    const C = [
      { code: 'KHALID10', desc: '10% off · public · not stackable', meta: '14 of 50 used · valid until Sun 30 Nov', used: 14, total: 50 },
      { code: 'RIYADHVAN', desc: '150 SAR off bookings over 1,000 SAR', meta: '3 of 20 used · paused Mon 13 Oct', used: 3, total: 20 },
      { code: 'SUMMER', desc: 'First booking with you · 8% off', meta: '22 of 30 used · ended Tue 30 Sep', used: 22, total: 30, fixed: 'Expired' }
    ];
    const coupons = C.map((c) => {
      const s = c.fixed || st[c.code];
      const live = !c.fixed;
      return { ...c, status: s, pill: 'height: 24px; padding: 0 10px; border-radius: 999px; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; ' + look[s][0], icon: look[s][1],
        hasUse: live, useLabel: c.used + ' of ' + c.total + ' uses',
        bar: 'width: ' + Math.round((c.used / c.total) * 100) + '%; background: #262a67; border-radius: 999px',
        canToggle: live, action: s === 'Active' ? 'Pause' : 'Resume',
        toggle: () => this.setState({ st: { ...st, [c.code]: s === 'Active' ? 'Paused' : 'Active' } }) };
    });
    return { coupons };
  }
}
</script>
</body>
</html>
