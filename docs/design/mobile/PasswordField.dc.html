<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Password field</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Cairo:wght@500;600;700&amp;display=swap">
<style>body{margin:0} .te-pw:focus-visible,.te-pw-t:focus-visible{outline:2px solid #262a67;outline-offset:2px}</style>
</helmet>
<div dir="{{dir}}" style="{{rootStyle}}">
<label for="{{fieldId}}" style="font-size: 14px; line-height: 20px; font-weight: 600">{{label}}</label>
<div style="position: relative">
<input class="te-pw" id="{{fieldId}}" type="{{type}}" autocomplete="{{ac}}" value="{{val}}" onChange="{{onInput}}" aria-invalid="{{invalidStr}}" style="{{inStyle}}">
<button class="te-pw-t" onClick="{{toggle}}" aria-label="{{toggleAria}}" style="{{togStyle}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
<sc-if value="{{strength}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="4"><span style="{{b}}"></span></sc-for>
</div>
<span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #5b5f86">{{strengthText}}</span>
</div>
</sc-if>
<sc-if value="{{hasError}}" hint-placeholder-val="{{false}}">
<span style="display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 500; color: #b42318"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.01"></path></svg>{{error}}</span>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Password"},"value":{"editor":"text","default":"Trips2026!"},"showStrength":{"editor":"boolean","default":false},"isNew":{"editor":"boolean","default":false},"error":{"editor":"text","default":""},"dir":{"editor":"enum","options":["ltr","rtl"],"default":"ltr"},"fieldId":{"editor":"text","default":"password"},"$preview":{"width":358,"height":82}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { show: false, val: null }; }
renderVals() {
const rtl = (this.props.dir ?? 'ltr') === 'rtl';
const val = this.state.val ?? this.props.value ?? '';
const err = this.props.error ?? '';
const border = err ? '1.5px solid #b42318' : '1px solid #7b7fa6';
let s = 0; if (val.length >= 8) s++; if (/[A-Z]/.test(val) && /[a-z]/.test(val)) s++; if (/\d/.test(val)) s++; if (/[^A-Za-z0-9]/.test(val)) s++;
const words = rtl ? ['ضعيفة جداً', 'ضعيفة', 'متوسطة', 'جيدة', 'قوية'] : ['Too weak', 'Weak', 'Fair', 'Good', 'Strong'];
const colors = ['#b42318', '#b42318', '#f89e23', '#1f7a4d', '#1f7a4d'];
const hint = rtl ? ' · ٨ أحرف على الأقل مع رقم ورمز' : ' · 8+ characters with a number and a symbol';
return {
dir: rtl ? 'rtl' : 'ltr', label: this.props.label ?? 'Password', fieldId: this.props.fieldId ?? 'password',
rootStyle: 'display: flex; flex-direction: column; gap: 6px; color: #262a67; font-family: ' + (rtl ? "Cairo, 'Readex Pro', Tahoma, sans-serif" : 'Outfit, Nunito, system-ui, sans-serif') + ';',
type: this.state.show ? 'text' : 'password', ac: this.props.isNew ? 'new-password' : 'current-password', val,
inStyle: 'width: 100%; height: 52px; box-sizing: border-box; padding-inline: 14px 52px; border-radius: 8px; background: #ffffff; color: #262a67; font-family: inherit; font-size: 16px; border: ' + border + ';',
togStyle: 'position: absolute; top: 4px; inset-inline-end: 4px; width: 44px; height: 44px; border: none; border-radius: 8px; background: transparent; color: ' + (this.state.show ? '#262a67' : '#5b5f86') + '; display: flex; align-items: center; justify-content: center; cursor: pointer;',
toggleAria: this.state.show ? (rtl ? 'إخفاء كلمة المرور' : 'Hide password') : (rtl ? 'إظهار كلمة المرور' : 'Show password'),
toggle: () => this.setState({ show: !this.state.show }),
onInput: (e) => this.setState({ val: e.target.value }),
strength: !!this.props.showStrength && !err,
bars: [0, 1, 2, 3].map(i => 'height: 4px; border-radius: 999px; background: ' + (i < s ? colors[s] : '#e3dfc9') + ';'),
strengthText: words[s] + hint,
error: err, hasError: !!err, invalidStr: err ? 'true' : 'false'
};
}
}
</script>
</body>
</html>
