<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traveler · Album viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="TrvAlbums.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Rose harvest day</h1><span style="font-size: 13px; color: #5b5f86">148 photos · by <a href="PhoProfile.dc.html" style="font-weight: 600">Noura Al-Shehri</a></span></div>
<button type="button" aria-pressed="{{selPressed}}" onClick="{{toggleSel}}" style="{{selBtn}}">{{selLabel}}</button>
</div>

<div style="display: flex; gap: 8px">
<a href="#" style="flex: 1 1 0; height: 44px; border-radius: 12px; background: #ffffff; border: 1px solid #7b7fa6; box-sizing: border-box; color: #262a67; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 9l5-5 5 5M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"></path></svg>Share</a>
<a href="#" style="flex: 1 1 0; height: 44px; border-radius: 12px; background: #ffffff; border: 1px solid #7b7fa6; box-sizing: border-box; color: #262a67; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>Favourites · 6</a>
</div>

<div role="list" aria-label="Photos" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-radius: 20px; overflow: hidden">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
<button type="button" role="listitem" aria-label="{{t.aria}}" aria-pressed="{{t.pressed}}" onClick="{{t.on}}" style="position: relative; height: 112px; padding: 0; border: 0; background: #262a67; color: #b8bad6; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.hasImg}}" hint-placeholder-val="{{true}}"><img src="{{t.img}}" alt="" style="{{t.imgStyle}}"></sc-if>
<sc-if value="{{t.noImg}}" hint-placeholder-val="{{false}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM20 15l-5-5L5 20"></path></svg></sc-if>
<sc-if value="{{t.showCheck}}" hint-placeholder-val="{{false}}"><span style="{{t.check}}"><sc-if value="{{t.sel}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#262a67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if></span></sc-if>
</button>
</sc-for>
</div>

<div style="display: flex; gap: 10px; font-size: 13px; line-height: 18px; color: #5b5f86"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8h.01"></path></svg><span>Photos carry a small Noura Al-Shehri watermark. Downloads are full resolution. Showing 12 of 148 — scroll for more.</span></div>

<a href="#" style="margin-top: auto; height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>{{cta}}</a>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { selecting: true, sel: [1, 4, 7] }; }
  renderVals() {
    const A = '../assets/cc51d7ccafd703646b5cfbed3b8222aa.svg', B = '../assets/79a6ce5310828e799852c7aef2cdc987.svg', C = '../assets/073b7fe9ddee4e94c5d8ddaa41cbb4f4.svg', D = '../assets/8e86331acb7080e5e12facebe9aa4069.svg', E = '../assets/b2bcb63d43641eb25576376d35060477.png', G = '../assets/dd052dab07949cd087d95323479af226.svg';
    const T = [[A, '20% 40%'], [B, '50% 30%'], [C, '50% 50%'], [D, '30% 60%'], [A, '70% 50%'], [E, '40% 50%'], [G, '50% 50%'], [B, '80% 70%'], [D, '80% 40%'], [C, '10% 80%'], [A, '45% 85%'], [E, '80% 40%']];
    const { selecting, sel } = this.state;
    const tiles = T.map(([img, pos], i) => {
      const on = sel.indexOf(i) >= 0;
      return {
        img, hasImg: !!img, noImg: !img, sel: on, showCheck: selecting,
        pressed: selecting ? (on ? 'true' : 'false') : 'false',
        aria: 'Photo ' + (i + 1) + ' of 148' + (selecting ? (on ? ', selected' : ', not selected') : ''),
        imgStyle: 'position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: ' + pos + ';' + (on && selecting ? ' opacity: 0.7;' : ''),
        check: 'position: absolute; top: 8px; inset-inline-end: 8px; width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #ff6c2e; border: 2px solid #ffffff;' : 'background: rgba(16,18,48,0.35); border: 2px solid #ffffff;'),
        on: () => { if (!this.state.selecting) return; const s = this.state.sel.slice(); const k = s.indexOf(i); if (k >= 0) s.splice(k, 1); else s.push(i); this.setState({ sel: s }); }
      };
    });
    const n = selecting ? sel.length : 0;
    return {
      tiles,
      selLabel: selecting ? 'Done' : 'Select',
      selPressed: selecting ? 'true' : 'false',
      toggleSel: () => this.setState({ selecting: !this.state.selecting }),
      selBtn: 'height: 44px; padding: 0 16px; border-radius: 999px; border: 0; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (selecting ? 'background: #262a67; color: #f6f3e4;' : 'background: #ffffff; color: #262a67;'),
      cta: n > 0 ? 'Download ' + n + ' selected' : 'Download all · 148 photos'
    };
  }
}
</script>
</body>
</html>
