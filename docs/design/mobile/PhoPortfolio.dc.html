<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photographer · Portfolio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="PhoProfile.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-size: 22px; line-height: 28px; font-weight: 700">Portfolio</h1>
</div>

<div style="padding: 12px 14px; border-radius: 16px; background: #ffffff; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">34 of 50 photos used</span><a href="PhoPlanManage.dc.html" style="font-weight: 600">Unlimited on Pro</a></div>
<div role="progressbar" aria-label="Portfolio space" aria-valuenow="34" aria-valuemin="0" aria-valuemax="50" style="height: 8px; border-radius: 999px; background: #e3dfc9; display: flex; overflow: hidden"><span style="width: 68%; background: #262a67; border-radius: 999px"></span></div>
</div>

<div role="tablist" aria-label="Categories" style="display: flex; gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
<button role="tab" aria-selected="{{c.sel}}" onClick="{{c.go}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="9">
<button onClick="{{t.pick}}" aria-pressed="{{t.selA}}" aria-label="{{t.al}}" style="{{t.style}}">
<sc-if value="{{t.hasImg}}" hint-placeholder-val="{{true}}"><img src="{{t.img}}" alt="" style="{{t.imgStyle}}"></sc-if>
<sc-if value="{{t.noImg}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b8bad6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h2l2-2h4l2 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM12 9.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"></path></svg></sc-if>
<sc-if value="{{t.cover}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 6px; left: 6px; padding: 1px 8px; border-radius: 999px; background: #f89e23; color: #262a67; font-size: 11px; font-weight: 700">Cover</span></sc-if>
<sc-if value="{{t.sel}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 999px; background: #fb8030; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span></sc-if>
</button>
</sc-for>
</div>

<p style="margin: 0; display: flex; gap: 8px; font-size: 13px; line-height: 18px; color: #5b5f86"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8h.01"></path></svg>Press and hold a photo, then drag it to reorder. Companies see the first 6 on your profile.</p>

<div style="margin-top: auto; display: flex; gap: 10px">
<button onClick="{{setCover}}" style="flex: 1 1 0; height: 52px; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{coverLabel}}</button>
<a href="PhoAlbumNew.dc.html" style="flex: 1 1 0; height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add photos</a>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cat: 'trips', sel: 2, cover: 0 }; }
  renderVals() {
    const SETS = {
      trips: [['../assets/b2bcb63d43641eb25576376d35060477.png', 'Beach group, Red Sea', '50% 70%'], ['../assets/073b7fe9ddee4e94c5d8ddaa41cbb4f4.svg', 'Dune jump at sunset', '40% 50%'], ['../assets/44a218548719fe367b614a0dd5151345.svg', 'AlUla rocks under the stars', '50% 50%'], ['../assets/79a6ce5310828e799852c7aef2cdc987.svg', 'Group selfie, AlUla', '50% 35%'], ['../assets/dd052dab07949cd087d95323479af226.svg', 'Camp night, AlUla', '50% 60%'], ['../assets/dc9df8d5382e0fc7d2bf084f5632c713.svg', 'Snorkel boat, Red Sea', '30% 50%'], ['../assets/cc51d7ccafd703646b5cfbed3b8222aa.svg', 'Rose fields, Taif', '50% 70%'], ['../assets/767dc865917d29911dbc19beb44053f6.svg', 'Edge of the World at sunrise', '65% 40%'], ['../assets/ec6a722ee32901158955f2a8dec188bd.svg', 'Old Town walk, Diriyah', '50% 50%']],
      families: [['../assets/7af26845f1899d68ac8358f14ccdccea.png', 'Parent and child at the bus', '50% 50%'], ['../assets/8e86331acb7080e5e12facebe9aa4069.svg', 'Families picking fruit, Taif', '40% 60%'], ['../assets/61261514261614e6b661d310c333264d.svg', 'Family on the beach', '30% 60%'], ['../assets/79a6ce5310828e799852c7aef2cdc987.svg', 'Siblings selfie, AlUla', '75% 40%'], ['../assets/c05dcb937e01218b8073e886669c75d4.svg', 'Grandparents, Corniche', '50% 50%'], ['../assets/2c90013b05936cc82deb2ba3571360d4.svg', 'School day departure', '40% 50%']],
      events: [['../assets/e15e301529dfca735deed42db0d8dd3c.png', 'Group briefing', '50% 40%'], ['../assets/d9f59a124604f8f752246a02064d57f6.svg', 'Graduation night, Al Noor School', '50% 40%'], ['../assets/dd052dab07949cd087d95323479af226.svg', 'Camp night, AlUla', '25% 50%'], ['../assets/073b7fe9ddee4e94c5d8ddaa41cbb4f4.svg', 'Celebration on the sand', '70% 40%']]
    };
    const list = SETS[this.state.cat];
    const tiles = list.map(([img, al, pos], i) => {
      const sel = this.state.sel === i, cover = this.state.cat === 'trips' && this.state.cover === i;
      return { img, hasImg: !!img, noImg: !img, al: al + (cover ? ', cover photo' : ''), sel, cover, selA: sel ? 'true' : 'false',
        pick: () => this.setState({ sel: i }),
        imgStyle: 'position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: ' + (pos || '50% 50%'),
        style: 'position: relative; aspect-ratio: 1 / 1; padding: 0; border-radius: 12px; overflow: hidden; background: #262a67; cursor: pointer; display: flex; align-items: center; justify-content: center; ' + (sel ? 'border: 3px solid #fb8030;' : 'border: 3px solid transparent;') };
    });
    const cats = [['trips', 'Trips 18'], ['families', 'Families 10'], ['events', 'Events 6']].map(([id, label]) => {
      const on = this.state.cat === id;
      return { label, sel: on ? 'true' : 'false', go: () => this.setState({ cat: id, sel: -1 }),
        style: 'height: 40px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #262a67; color: #f6f3e4; border: 1px solid #262a67;' : 'background: #ffffff; color: #262a67; border: 1px solid #7b7fa6;') };
    });
    const isCover = this.state.cat === 'trips' && this.state.sel === this.state.cover;
    return { tiles, cats,
      coverLabel: isCover ? 'This is the cover' : 'Set as cover',
      setCover: () => { if (this.state.sel >= 0) this.setState({ cat: 'trips', cover: this.state.cat === 'trips' ? this.state.sel : this.state.cover }); } };
  }
}
</script>
</body>
</html>
