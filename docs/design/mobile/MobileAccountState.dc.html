<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account status</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 16px 32px; gap: 20px">
<img src="../assets/1fbce194fcb16bf54904c32c189fca31.svg" alt="Trips Enjoy" style="height: 40px; width: auto; align-self: flex-start">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="{{badgeStyle}}">{{badge}}</span>
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 700">{{title}}</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #5b5f86">{{body}}</p>
</div>
<div style="padding: 16px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; font-weight: 600; color: #5b5f86">{{listTitle}}</span>
<sc-for list="{{items}}" as="i" hint-placeholder-count="2">
<div style="display: flex; gap: 12px; align-items: flex-start">
<span style="{{i.dot}}"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{i.t}}</span><span style="font-size: 13px; line-height: 18px; color: #5b5f86">{{i.d}}</span></span>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #5b5f86">{{foot}}</p>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<a href="{{primaryHref}}" style="height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">{{primary}}</a>
<a href="#" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #7b7fa6; color: #262a67; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">{{secondary}}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["changes","rejected","suspended","payment"],"default":"changes"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dot = (c) => 'width: 10px; height: 10px; margin-top: 6px; flex-shrink: 0; border-radius: 999px; background: ' + c + ';';
const pill = (bg, fg) => 'align-self: flex-start; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: ' + bg + '; color: ' + fg + ';';
const S = {
changes: { badge: 'Changes needed', badgeStyle: pill('#f89e23', '#262a67'), title: 'Fix one item to finish your driver application', body: 'Reviewed on 6 Oct. Everything else is approved — only this needs another look.', listTitle: 'WHAT TO FIX', items: [{ t: 'Driving licence', d: 'Expired on 12 Aug 2026. Upload your renewed licence.', dot: dot('#b42318') }, { t: 'Vehicle registration', d: 'Approved', dot: dot('#1f7a4d') }], foot: 'Fix it within 14 days or the application closes and you start again.', primary: 'Upload new licence', primaryHref: 'MobileApply.dc.html', secondary: 'Message the review team' },
rejected: { badge: 'Not approved', badgeStyle: pill('#fde8e6', '#b42318'), title: "We couldn't approve your photographer application", body: 'Decided on 6 Oct by the Trips Enjoy review team.', listTitle: 'REASON', items: [{ t: 'Portfolio below our quality bar', d: 'Most photos were out of focus or not group/outdoor work.', dot: dot('#b42318') }], foot: 'You can apply again after 5 Nov with a new portfolio. Your traveler account still works.', primary: 'Keep using Trips Enjoy as a traveler', primaryHref: 'MobileReady.dc.html', secondary: 'Appeal this decision' },
payment: { badge: 'Payment failed', badgeStyle: pill('#f89e23', '#262a67'), title: "We couldn't renew your Professional plan", body: 'Your card ending 2210 was declined on 18 Oct. Your plan stays active during a 7-day grace period.', listTitle: 'WHAT HAPPENS NEXT', items: [{ t: 'Until 25 Oct', d: 'Everything works as normal while we retry the payment.', dot: dot('#f89e23') }, { t: 'After 25 Oct', d: 'You move to Basic: 3 bookings a month and new bookings beyond that are blocked.', dot: dot('#b42318') }], foot: 'Update your payment method and we retry straight away. Your plan comes back instantly once paid.', primary: 'Update payment method', primaryHref: 'MobileCheckout.dc.html', secondary: 'Switch to Basic now' },
suspended: { badge: 'Account suspended', badgeStyle: pill('#fde8e6', '#b42318'), title: 'Your driver account is suspended', body: 'Suspended on 8 Oct: the requested lab test was not completed by the deadline.', listTitle: 'WHAT THIS MEANS', items: [{ t: 'No trip offers or assignments', d: 'Earnings already due are still paid on the usual date.', dot: dot('#b42318') }, { t: 'You can request a review', d: 'Complete the lab test and send it with your appeal.', dot: dot('#262a67') }], foot: 'Suspensions over 30 days close the driver account. Contact support if you think this is a mistake.', primary: 'Book lab test and appeal', primaryHref: 'DrvLabBook.dc.html', secondary: 'Contact support' }
};
return S[this.props.state ?? 'changes'] || S.changes;
}
}
</script>
</body>
</html>
