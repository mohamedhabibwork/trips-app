<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parent · Alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 120px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Alerts</h1>
<span style="font-size: 13px; color: #5b5f86">2 new today</span>
</div>

<div role="group" aria-label="Filter by child" style="display: flex; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.on}}" style="{{c.style}}">{{c.t}}</button></sc-for>
</div>

<a href="ParSafetyReport.dc.html" style="min-height: 44px; flex-shrink: 0; padding: 0 14px; border-radius: 12px; background: #ffffff; border: 1px solid #e3dfc9; color: #262a67; text-decoration: none; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6zM12 9v3M12 15h.01"></path></svg><span style="flex-grow: 1">Report a child-safety concern</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>

<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
<sc-for list="{{items}}" as="a" hint-placeholder-count="6">
<li>
<a href="{{a.href}}" style="padding: 10px 12px; border-radius: 16px; background: #ffffff; color: #262a67; text-decoration: none; display: flex; gap: 12px; align-items: center">
<span style="{{a.iconStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 600">{{a.t}}</span><sc-if value="{{a.isNew}}" hint-placeholder-val="{{false}}"><span style="padding: 0 6px; border-radius: 999px; background: #f89e23; font-size: 11px; font-weight: 700">New</span></sc-if></span>
<span style="font-size: 13px; line-height: 18px; color: #5b5f86">{{a.body}}</span>
</span>
<span style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 13px; font-weight: 600">{{a.time}}</span><span style="font-size: 12px; color: #5b5f86">{{a.day}}</span></span>
</a>
</li>
</sc-for>
</ul>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px">
<dc-import name="TabBar" role="parent" active="alerts" hint-size="390px,120px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { child: 'All' }; }
  renderVals() {
    const P = {
      check: 'M5 12.5l4.5 4.5L19 7', bus: 'M6 4h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM4 11h16M8 18v2M16 18v2M8 14.5h.01M16 14.5h.01',
      pin: 'M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21zM12 7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',
      out: 'M5 12h14M13 6l6 6-6 6', flag: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2', alert: 'M12 3l9.5 17h-19zM12 10v4M12 17h.01'
    };
    const A = [
      ['Omar', 'Trip started', 'Bus 1 left Al Noor School with Omar on board', '07:45', 'Today', 'bus', 'info', true, 'ParLive'],
      ['Omar', 'Boarding confirmed', 'Omar boarded Bus 1 · Seat 4C · checked in by Nadia Yusuf', '07:32', 'Today', 'check', 'ok', true, 'ParChild'],
      ['Omar', 'Trip ended', 'Grade 4 Museum Visit · Bus 1 back at Al Noor School', '14:58', 'Thu 2 Oct', 'flag', 'info', false, 'ParChild'],
      ['Omar', 'Checked out', 'Omar left Bus 1 at Al Noor School gate', '14:52', 'Thu 2 Oct', 'out', 'ok', false, 'ParChild'],
      ['Omar', 'Stop reached', 'Bus 1 arrived at National Museum, Al Murabba', '09:04', 'Thu 2 Oct', 'pin', 'info', false, 'ParChild'],
      ['Lina', 'Not boarded', 'Lina wasn’t on Bus 3 · you marked her not travelling at 07:46', '07:44', 'Sun 28 Sep', 'alert', 'bad', false, 'ParNotBoarded']
    ];
    const tone = { ok: 'background: #e3f3ea; color: #1f7a4d;', info: 'background: #e6e8f5; color: #262a67;', bad: 'background: #fde8e6; color: #b42318;' };
    const sel = this.state.child;
    const items = A.filter((a) => sel === 'All' || a[0] === sel).slice(0, 7).map(([c, t, body, time, day, ic, tn, isNew, href]) => ({
      t: t + ' · ' + c, body, time, day, d: P[ic], isNew, href: href + '.dc.html',
      iconStyle: 'width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; ' + tone[tn]
    }));
    const chips = ['All', 'Omar', 'Lina'].map((t) => ({ t, pressed: sel === t ? 'true' : 'false', on: () => this.setState({ child: t }),
      style: 'height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (sel === t ? 'background: #262a67; color: #f6f3e4; border: 1px solid #262a67;' : 'background: #ffffff; color: #262a67; border: 1px solid #7b7fa6;') }));
    return { chips, items };
  }
}
</script>
</body>
</html>
