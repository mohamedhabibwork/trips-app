<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moderator · Check-out at stop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="ModOnTrip.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Check-out · Hegra</h1><span style="font-size: 13px; color: #5b5f86">Bus 2 · arrived 10:28</span></div>
</div>

<div style="padding: 12px 14px; border-radius: 16px; background: #ffffff; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span role="status" style="font-size: 16px; font-weight: 600">{{progress}}</span><span style="font-size: 13px; color: #5b5f86">{{left}}</span></div>
<div role="progressbar" aria-label="Checked out" aria-valuemin="0" aria-valuemax="41" aria-valuenow="{{out}}" style="height: 8px; border-radius: 999px; background: #e3dfc9; overflow: hidden"><span style="{{bar}}"></span></div>
</div>

<div style="padding: 12px 14px; border-radius: 16px; background: #ffffff; display: flex; align-items: center; gap: 12px">
<span id="fd-l" style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Final destination</span><span style="font-size: 13px; color: #5b5f86">Turn on only at the trip's last stop</span></span>
<button type="button" role="switch" aria-checked="{{finalA}}" aria-labelledby="fd-l" onClick="{{toggleFinal}}" style="{{swStyle}}"><span style="{{knob}}"></span></button>
</div>

<p style="{{noteStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8h.01"></path></svg>{{note}}</p>

<ul aria-label="Passengers" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<li style="padding: 8px 8px 8px 12px; border-radius: 14px; background: #ffffff; display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #e6e8f5; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{r.seat}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{r.name}}</span><span style="font-size: 12px; color: #5b5f86">{{r.sub}}</span></span>
<button type="button" aria-pressed="{{r.p}}" aria-label="{{r.label}}" onClick="{{r.on}}" style="{{r.style}}">{{r.btn}}</button>
</li>
</sc-for>
</ul>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
<a href="{{doneHref}}" style="height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">{{doneLabel}}</a>
<span style="font-size: 13px; color: #5b5f86; text-align: center">Each check-out logs time and GPS · Hegra visitor centre</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { fin: false, out: [true, true, false, false, true] }; }
  renderVals() {
    const { fin, out } = this.state;
    const P = [['Sara Al-Qahtani', '3C'], ['Omar Al-Qahtani', '4C', true], ['Lina Al-Qahtani', '4D', true], ['Huda Mansour', '5B'], ['Majed Al-Otaibi', '6A']];
    const n = 19 + out.filter(Boolean).length;
    const rows = P.map(([name, seat, child], i) => {
      const on = out[i];
      return { name, seat, p: on ? 'true' : 'false',
        sub: on ? ('Out 10:3' + (i + 1) + (child ? ' · Child · guardian notified' : '')) : (child ? 'Child · on board' : 'On board'),
        btn: on ? 'Checked out' : 'Check out', label: (on ? 'Undo check-out for ' : 'Check out ') + name,
        on: () => { const o = out.slice(); o[i] = !o[i]; this.setState({ out: o }); },
        style: 'height: 40px; padding: 0 12px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0; ' + (on ? 'background: #e3f3ea; color: #1f7a4d; border: 1px solid #1f7a4d;' : 'background: #ffffff; color: #262a67; border: 1px solid #7b7fa6;') };
    });
    return {
      rows, out: n, progress: n + ' of 41 checked out', left: (41 - n) + ' still on board',
      bar: 'display: block; height: 100%; width: ' + (n / 41 * 100).toFixed(1) + '%; background: #1f7a4d;',
      finalA: fin ? 'true' : 'false', toggleFinal: () => this.setState({ fin: !fin }),
      swStyle: 'width: 52px; height: 32px; flex-shrink: 0; padding: 3px; box-sizing: border-box; border-radius: 999px; border: 0; cursor: pointer; display: flex; ' + (fin ? 'background: #262a67; justify-content: flex-end;' : 'background: #b8bad6; justify-content: flex-start;'),
      knob: 'width: 26px; height: 26px; border-radius: 999px; background: #ffffff;',
      note: fin ? 'Last stop: check-out ends the trip for each passenger and frees their seat.' : 'Intermediate stop: passengers re-board here at 13:00. Their seats stay theirs; check them back in on return.',
      noteStyle: 'margin: 0; padding: 10px 12px; border-radius: 12px; display: flex; gap: 8px; font-size: 13px; line-height: 18px; ' + (fin ? 'background: #fdf0d5; color: #8a4b00;' : 'background: #e6e8f5; color: #262a67;'),
      doneHref: fin ? 'ModReport.dc.html' : 'ModOnTrip.dc.html',
      doneLabel: fin ? 'Finish trip · go to report' : 'Done at Hegra'
    };
  }
}
</script>
</body>
</html>
