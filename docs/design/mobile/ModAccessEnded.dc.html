<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moderator · Access ended</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 10px">
<img src="../assets/1fbce194fcb16bf54904c32c189fca31.svg" alt="Trips Enjoy" style="height: 32px; width: auto">
<span style="margin-inline-start: auto; padding: 4px 10px; border-radius: 999px; background: #e6e8f5; font-size: 13px; font-weight: 600">Moderator · Nadia Yusuf</span>
</div>

<div style="height: 200px; border-radius: 20px; overflow: hidden; background: #262a67; position: relative">
<img src="../assets/e15e301529dfca735deed42db0d8dd3c.png" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; opacity: 0.5">
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center"><span style="width: 72px; height: 72px; border-radius: 999px; background: #f6f3e4; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4"></path></svg></span></span>
</div>

<div role="alert" style="display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: #fde8e6; color: #b42318; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>Check-in no longer allowed</span>
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">{{title}}</h1>
<p style="margin: 0; font-size: 16px; line-height: 23px; color: #5b5f86">{{body}}</p>
</div>

<sc-if value="{{hasQueued}}" hint-placeholder-val="{{true}}">
<div style="padding: 12px 14px; border-radius: 16px; background: #ffffff; display: flex; gap: 12px; align-items: center">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #e6e8f5; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">3</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">3 saved events moved to review</span><span style="font-size: 13px; line-height: 18px; color: #5b5f86">They stay on this phone and go to operations for review. They will not be sent as check-ins.</span></span>
</div>
</sc-if>

<p style="margin: 0; font-size: 13px; line-height: 18px; color: #5b5f86">{{why}}</p>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="ModSignIn.dc.html" style="height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Sign out</a>
<div style="display: flex; gap: 10px">
<a href="ModOpsChat.dc.html" style="flex: 1 1 0; height: 52px; box-sizing: border-box; border-radius: 12px; background: #ffffff; border: 1px solid #7b7fa6; color: #262a67; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"></path></svg>Message operations</a>
<a href="#" aria-label="Call operations, Sunrise Tours Co." style="width: 52px; height: 52px; flex-shrink: 0; box-sizing: border-box; border-radius: 12px; background: #ffffff; border: 1px solid #7b7fa6; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"reason":{"editor":"enum","options":["replaced","completed"],"default":"replaced"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const done = this.props.reason === 'completed';
    return {
      title: done ? 'This trip is complete' : 'Your access to this vehicle has ended',
      body: done
        ? 'The trip ended and your report was submitted. Access to the vehicle closed, so no more check-ins or check-outs can be made from this phone.'
        : 'Operations assigned another moderator to this vehicle at 10:42. Check-in and check-out are no longer allowed from this phone.',
      why: done
        ? 'Staff codes stay valid until 24 hours after the trip ends, then sign-in closes for this trip.'
        : 'Your sign-in works on one phone and one vehicle at a time. If you think this is a mistake, contact operations; only they can restore access.',
      hasQueued: !done
    };
  }
}
</script>
</body>
</html>
