<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اختر نوع الحساب</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f3e4; color: #262a67; font-family: Cairo, 'Readex Pro', Tahoma, sans-serif; display: flex; flex-direction: column; padding: 56px 16px 32px; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="MainAr.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #262a67"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></a>
<span style="font-size: 13px; font-weight: 600; color: #5b5f86">الخطوة ١</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 26px; line-height: 40px; font-weight: 700">كيف ستستخدم تريبس إنجوي؟</h1>
<p style="margin: 0; font-size: 15px; line-height: 26px; font-weight: 500; color: #5b5f86">يمكنك التقديم على دور آخر لاحقاً من ملفك الشخصي.</p>
</div>
<div role="radiogroup" aria-label="نوع الحساب" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
<button role="radio" aria-checked="{{r.checked}}" onClick="{{r.pick}}" style="{{r.style}}">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; text-align: start">
<span style="font-size: 16px; font-weight: 700">{{r.title}}</span>
<span style="font-size: 13px; line-height: 20px; font-weight: 500; color: #5b5f86">{{r.desc}}</span>
</span>
<sc-if value="{{r.review}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 10px; border-radius: 999px; background: #f89e23; color: #262a67; font-size: 12px; font-weight: 700; white-space: nowrap">يخضع للمراجعة</span></sc-if>
</button>
</sc-for>
</div>
<p style="margin: 0; padding: 12px; border-radius: 12px; background: #ffffff; font-size: 13px; line-height: 22px; font-weight: 500; color: #5b5f86">حسابات المصورين والسائقين والجهات يراجعها فريقنا قبل تفعيلها — عادة خلال يومي عمل.</p>
<a href="{{next}}" style="margin-top: auto; height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">متابعة</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { picked: 'traveler' }; }
renderVals() {
const base = 'display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 72px; border-radius: 12px; background: #ffffff; color: #262a67; font-family: inherit; cursor: pointer; ';
const xs = [
{ id: 'traveler', title: 'مسافر', desc: 'احجز الرحلات والمقاعد لك ولعائلتك.', review: false },
{ id: 'photographer', title: 'مصوّر', desc: 'قدّم خدمات تصوير الرحلات وشارك الألبومات.', review: true },
{ id: 'driver', title: 'سائق', desc: 'قد حافلات الرحلات الجماعية واقبل المهام.', review: true },
{ id: 'org', title: 'جهة / شركة', desc: 'بِع الرحلات والفعاليات. يكمل التسجيل على الويب.', review: true }
];
return { next: { traveler: 'MobileSignUpAr.dc.html', driver: 'DrvAccountAr.dc.html', photographer: 'PhoAccountAr.dc.html', org: 'OrgRegister.dc.html' }[this.state.picked],
roles: xs.map(x => ({ ...x, checked: this.state.picked === x.id ? 'true' : 'false', style: base + (this.state.picked === x.id ? 'border: 2px solid #fb8030;' : 'border: 1px solid #e3dfc9;'), pick: () => this.setState({ picked: x.id }) })) };
}
}
</script>
</body>
</html>
