<head>

<x-dc>

a{color:#c93a00}a:hover{color:#262a67}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">

<a href="PhoPlanManage.dc.html" style="position: absolute; top: 52px; right: 16px; height: 44px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,0.78); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: 1px solid rgba(255,255,255,0.7); color: #262a67; font-size: 14px; font-weight: 600; display: flex; align-items: center; text-decoration: none">My plan</a>

<div style="position: absolute; top: 132px; left: 0; right: 0; bottom: 120px; box-sizing: border-box; padding: 0 16px; display: flex; flex-direction: column; gap: 12px">

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px">
<h1 style="margin: 0; font-size: 22px; line-height: 26px; font-weight: 700">Noura Al-Shehri</h1>
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px">
<span style="display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: #e3f3ea; color: #1f7a4d; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6zM9 12l2 2 4-4"></path></svg>Verified</span>

<span style="color: #5b5f86">· 7 years</span>
</span>
</div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<div style="padding: 10px 14px; border-radius: 16px; background: #ffffff; display: flex; flex-direction: column"><span style="font-size: 13px; color: #5b5f86">Half day · 5 h</span><span style="font-size: 18px; font-weight: 700">1,400 <span style="font-size: 13px; font-weight: 500; color: #5b5f86">SAR</span></span></div>
<div style="padding: 10px 14px; border-radius: 16px; background: #ffffff; display: flex; flex-direction: column"><span style="font-size: 13px; color: #5b5f86">Full day · 10 h</span><span style="font-size: 18px; font-weight: 700">2,400 <span style="font-size: 13px; font-weight: 500; color: #5b5f86">SAR</span></span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21zM12 7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"></path></svg>Works in</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{regions}}" as="r" hint-placeholder-count="4"><span style="padding: 4px 12px; border-radius: 999px; background: #ffffff; border: 1px solid #e3dfc9; font-size: 13px; font-weight: 600">{{r}}</span></sc-for>
</div>
<span style="font-size: 13px; line-height: 18px; color: #5b5f86"><strong style="color: #262a67">Kit:</strong> Sony A7 IV · 24–70 mm f/2.8 · 70–200 mm f/4 · DJI Mini 4 Pro drone (GACA registered)</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 16px; font-weight: 600">Portfolio</h2><a href="PhoPortfolio.dc.html" style="font-size: 14px; font-weight: 600">Manage 34 photos</a></div>
<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<a href="PhoPortfolio.dc.html" aria-label="{{t.al}}" style="position: relative; height: 72px; border-radius: 12px; overflow: hidden; background: #262a67; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.hasImg}}" hint-placeholder-val="{{true}}"><img src="{{t.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></sc-if>
<sc-if value="{{t.noImg}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#b8bad6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h2l2-2h4l2 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM12 9.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"></path></svg></sc-if>
</a>
</sc-for>
</div>
</div>

<figure style="margin: 0; padding: 12px 14px; border-radius: 16px; background: #ffffff; display: flex; flex-direction: column; gap: 6px">
<blockquote style="margin: 0; font-size: 14px; line-height: 20px">“Delivered 212 edited photos from AlUla in under two days. Our travellers shared them all week.”</blockquote>
<figcaption style="font-size: 13px; color: #5b5f86">Mona Saleh · Sunrise Tours Co. · 5 stars · Nov 2025</figcaption>
</figure>

<a href="PhoProfileEdit.dc.html" style="margin-top: auto; height: 48px; flex-shrink: 0; border-radius: 12px; background: #262a67; color: #f6f3e4; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"></path></svg>Edit profile</a>

</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px">
<dc-import name="TabBar" role="photographer" active="profile" hint-size="390px,120px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tiles = [
      ['../assets/b2bcb63d43641eb25576376d35060477.png', 'Beach group, Red Sea'],
      ['../assets/073b7fe9ddee4e94c5d8ddaa41cbb4f4.svg', 'Dune jump at sunset'],
      ['../assets/44a218548719fe367b614a0dd5151345.svg', 'AlUla rocks under the stars'],
      ['../assets/79a6ce5310828e799852c7aef2cdc987.svg', 'Group selfie, AlUla']
    ].map(([img, al]) => ({ img, al: 'Portfolio photo: ' + al, hasImg: !!img, noImg: !img }));
    return { tiles, regions: ['Riyadh', 'AlUla', 'Jeddah', 'Taif'] };
  }
}
</script>
</body>
</html>
