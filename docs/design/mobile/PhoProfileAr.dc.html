<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { on: { 'رحلات جماعية': true, 'فعاليات': true } }; }
renderVals() {
const xs = ['رحلات جماعية', 'فعاليات', 'رحلات مدرسية', 'درون', 'فيديو', 'بورتريه'];
return { tags: xs.map(l => { const on = !!this.state.on[l]; return { label: l, on: on ? 'true' : 'false',
style: 'height: 40px; padding: 0 14px; border-radius: 999px; background: #ffffff; color: #262a67; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ' + (on ? 'border: 2px solid #fb8030;' : 'border: 1px solid #7b7fa6;'),
tog: () => this.setState({ on: { ...this.state.on, [l]: !on } }) }; }) };
}
}
</script>
