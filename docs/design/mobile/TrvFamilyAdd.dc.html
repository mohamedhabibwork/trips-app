<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traveler · Add family member</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="TrvFamily.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Add family member</h1>
</div>

<div role="radiogroup" aria-label="Member type" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #ffffff; border: 1px solid #e3dfc9">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{k.sel}}" onClick="{{k.on}}" style="{{k.style}}">{{k.t}}</button></sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fm-name" style="font-size: 14px; font-weight: 600">Full name</label>
<input id="fm-name" type="text" autocomplete="off" placeholder="{{namePh}}" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67">
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="fm-dob" style="font-size: 14px; font-weight: 600">Date of birth</label>
<input id="fm-dob" type="text" inputmode="numeric" placeholder="DD / MM / YYYY" style="height: 52px; box-sizing: border-box; width: 100%; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 12px; font: inherit; font-size: 16px; color: #262a67">
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="fm-rel" style="font-size: 14px; font-weight: 600">Relationship</label>
<select id="fm-rel" style="height: 52px; box-sizing: border-box; width: 100%; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 10px; font: inherit; font-size: 16px; color: #262a67">
<sc-for list="{{rels}}" as="r" hint-placeholder-count="4"><option>{{r.t}}</option></sc-for>
</select>
</div>
</div>

<sc-if value="{{isAdult}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fm-id" style="font-size: 14px; font-weight: 600">National ID or iqama <span style="font-weight: 400; color: #5b5f86">(optional)</span></label>
<input id="fm-id" type="text" inputmode="numeric" placeholder="10 digits" aria-describedby="fm-id-h" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67">
<span id="fm-id-h" style="font-size: 13px; color: #5b5f86">Some trips ask for it at boarding. You can add it later.</span>
</div>
</sc-if>

<sc-if value="{{isChild}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fm-code" style="font-size: 14px; font-weight: 600">School or company code <span style="font-weight: 400; color: #5b5f86">(optional)</span></label>
<input id="fm-code" type="text" placeholder="e.g. ANS-G4-2291" aria-describedby="fm-code-h" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67">
<span id="fm-code-h" style="font-size: 13px; color: #5b5f86">Links school trips to your child. Ask the school office for it.</span>
</div>
</sc-if>

<div style="padding: 12px 14px; border-radius: 20px; background: #ffffff; display: flex; align-items: center; gap: 12px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span id="trk-l" style="font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px">Allow live tracking<span style="padding: 1px 8px; border-radius: 999px; background: #f89e23; color: #262a67; font-size: 11px; font-weight: 700">Explorer</span></span>
<span style="font-size: 13px; line-height: 18px; color: #5b5f86">{{trackNote}}</span>
</span>
<button type="button" role="switch" aria-checked="{{trkChecked}}" aria-labelledby="trk-l" onClick="{{toggleTrack}}" style="{{sw}}"><span style="width: 26px; height: 26px; border-radius: 999px; background: #ffffff; display: block"></span></button>
</div>

<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 19px; cursor: pointer">
<input type="checkbox" checked="" style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #262a67">
<span>{{consent}}</span>
</label>

<a href="TrvFamily.dc.html" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">Save family member</a>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { kind: 'child', track: true }; }
  renderVals() {
    const kind = this.state.kind;
    const child = kind === 'child';
    const on = this.state.track;
    const kinds = [['child', 'Child'], ['adult', 'Adult']].map(([v, t]) => ({ t, sel: kind === v ? 'true' : 'false',
      on: () => this.setState({ kind: v }),
      style: 'flex: 1 1 0; height: 44px; border: 0; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; ' + (kind === v ? 'background: #262a67; color: #f6f3e4;' : 'background: transparent; color: #262a67;') }));
    return {
      kinds, isChild: child, isAdult: !child,
      namePh: child ? 'e.g. Yara Al-Qahtani' : 'e.g. Faisal Al-Qahtani',
      rels: (child ? ['Daughter', 'Son', 'Niece or nephew', 'Other child in my care'] : ['Husband', 'Wife', 'Mother', 'Father', 'Sibling', 'Other']).map((t) => ({ t })),
      trackNote: child
        ? (on ? 'On · boarding, stop and drop-off alerts, live bus location' : 'Off · no alerts for this child')
        : (on ? 'On · they get an invite to share their location' : 'Off · adults can share from their own account'),
      trkChecked: on ? 'true' : 'false',
      toggleTrack: () => this.setState({ track: !this.state.track }),
      sw: 'width: 52px; height: 32px; flex-shrink: 0; padding: 3px; border-radius: 999px; border: 0; cursor: pointer; display: flex; ' + (on ? 'background: #262a67; justify-content: flex-end;' : 'background: #7b7fa6; justify-content: flex-start;'),
      consent: child ? 'I am this child’s parent or legal guardian and agree to Trips Enjoy storing their details for bookings.' : 'They agreed to me saving their details and booking trips for them.'
    };
  }
}
</script>
</body>
</html>
