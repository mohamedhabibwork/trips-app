<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photographer · Earnings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 120px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Earnings</h1>
<a href="PhoCoupons.dc.html" style="height: 44px; padding: 0 14px; border-radius: 999px; background: #ffffff; color: #262a67; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9zM7.5 7.5h.01"></path></svg>Coupons</a>
</div>

<div role="tablist" aria-label="Period" style="display: flex; padding: 4px; border-radius: 999px; background: #ffffff; gap: 4px">
<sc-for list="{{periods}}" as="p" hint-placeholder-count="2">
<button role="tab" aria-selected="{{p.sel}}" onClick="{{p.go}}" style="{{p.style}}">{{p.label}}</button>
</sc-for>
</div>

<section style="padding: 16px; border-radius: 20px; background: #1a1c4b; color: #f6f3e4; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: #b8bad6">{{d.label}} · net after platform commission</span>
<span style="font-size: 34px; line-height: 40px; font-weight: 700">{{d.total}} <span style="font-size: 16px; font-weight: 500; color: #b8bad6">SAR</span></span>
<div style="display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px">
<span style="padding: 4px 10px; border-radius: 999px; background: #31367a">Paid {{d.paid}} SAR</span>
<span style="padding: 4px 10px; border-radius: 999px; background: #31367a; color: #f89e23">Pending {{d.pending}} SAR</span>
</div>
</section>

<div style="padding: 12px 14px; border-radius: 16px; background: #ffffff; display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #e3f3ea; color: #1f7a4d; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12v4M4 7v11a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2zM16 14.5h.01"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Next payout Mon 13 Oct · 2,400 SAR</span><span style="font-size: 13px; color: #5b5f86">To Al Rajhi Bank •• 4410 · weekly, Mondays 06:00</span></span>
</div>

<section aria-labelledby="shoots-h" style="border-radius: 20px; background: #ffffff; padding: 12px 0 4px">
<h2 id="shoots-h" style="margin: 0; padding: 0 16px 6px; font-size: 16px; font-weight: 600">Per shoot</h2>
<sc-for list="{{d.rows}}" as="r" hint-placeholder-count="3">
<div style="padding: 10px 16px; border-top: 1px solid #e3dfc9; display: flex; align-items: center; gap: 10px">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{r.t}}</span><span style="font-size: 13px; color: #5b5f86">{{r.sub}}</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px"><span style="font-size: 15px; font-weight: 700">{{r.amt}}</span><span style="{{r.ps}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>{{r.s}}</span></span>
</div>
</sc-for>
</section>

<a href="PhoPlanManage.dc.html" style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: #5b5f86; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4"></path></svg><span>Export to CSV or PDF needs Pro. <span style="color: #c93a00; font-weight: 600">See plans</span></span></a>

</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px">
<dc-import name="TabBar" role="photographer" active="earnings" hint-size="390px,120px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { per: 'oct' }; }
  renderVals() {
    const OK = 'M5 12.5l4.5 4.5L19 7', CL = 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2';
    const pill = (paid) => 'display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; ' + (paid ? 'background: #e3f3ea; color: #1f7a4d;' : 'background: #fdf0d5; color: #8a4b00;');
    const P = {
      oct: { label: 'October so far', total: '4,900', paid: '1,100', pending: '3,800', rows: [
        ['Taif Rose Farms', 'Sat 4 Oct · released after album delivery', '1,400', false],
        ['Al Noor School Graduation', 'Thu 2 Oct · in Mon 13 Oct payout', '2,400', false],
        ['Diriyah Evening Walk', 'Fri 26 Sep shoot · paid Mon 6 Oct', '1,100', true]
      ] },
      sep: { label: 'September', total: '6,300', paid: '6,300', pending: '0', rows: [
        ['Jeddah Corniche Night', 'Fri 19 Sep · paid Mon 29 Sep', '1,500', true],
        ['Edge of the World Hike', 'Sat 13 Sep · paid Mon 22 Sep', '1,400', true],
        ['Hegra Night Tour', 'Thu 4 Sep · paid Mon 15 Sep', '3,400', true]
      ] }
    };
    const src = P[this.state.per];
    const d = { ...src, rows: src.rows.map(([t, sub, amt, paid]) => ({ t, sub, amt: amt + ' SAR', s: paid ? 'Paid' : 'Pending', ps: pill(paid), icon: paid ? OK : CL })) };
    const periods = [['oct', 'This month'], ['sep', 'Last month']].map(([id, label]) => {
      const on = this.state.per === id;
      return { label, sel: on ? 'true' : 'false', go: () => this.setState({ per: id }),
        style: 'flex: 1 1 0; height: 40px; border: 0; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #262a67; color: #f6f3e4;' : 'background: transparent; color: #262a67;') };
    });
    return { d, periods };
  }
}
</script>
</body>
</html>
