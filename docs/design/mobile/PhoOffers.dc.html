<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photographer · Offers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 120px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Offers</h1>
<a href="PhoBookings.dc.html" style="height: 44px; padding: 0 14px; border-radius: 999px; background: #ffffff; color: #262a67; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM4 10h16M8 3v4M16 3v4"></path></svg>Bookings</a>
</div>

<div role="tablist" aria-label="Offer status" style="display: flex; padding: 4px; border-radius: 999px; background: #ffffff; gap: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.sel}}" onClick="{{t.go}}" style="{{t.style}}">{{t.label}}<span style="{{t.cs}}">{{t.count}}</span></button>
</sc-for>
</div>

<p style="margin: 0; font-size: 14px; line-height: 20px; color: #5b5f86">{{hint}}</p>

<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{deals}}" as="d" hint-placeholder-count="3">
<a href="PhoOffer.dc.html" style="padding: 16px; border-radius: 20px; background: #ffffff; color: #262a67; display: flex; flex-direction: column; gap: 10px; text-decoration: none">
<span style="display: flex; align-items: center; gap: 12px">
<img src="{{d.logo}}" alt="" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; object-fit: cover">
<span style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 16px; font-weight: 600">{{d.trip}}</span>
<span style="font-size: 13px; color: #5b5f86">{{d.co}} · {{d.date}}</span>
</span>
</span>
<span style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid #e3dfc9">
<span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #5b5f86">{{d.priceLabel}}</span><span style="font-size: 18px; font-weight: 700">{{d.price}} <span style="font-size: 13px; font-weight: 500; color: #5b5f86">SAR</span></span></span>
<span style="{{d.ps}}">{{d.status}}</span>
</span>
<span style="font-size: 13px; color: #5b5f86">{{d.note}}</span>
</a>
</sc-for>
</div>

</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px">
<dc-import name="TabBar" role="photographer" active="offers" hint-size="390px,120px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'new' }; }
  renderVals() {
    const pill = (tone) => 'padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; ' + ({ new: 'background: #fb8030; color: #262a67;', warn: 'background: #fdf0d5; color: #8a4b00;', info: 'background: #e6e8f5; color: #262a67;', ok: 'background: #e3f3ea; color: #1f7a4d;', bad: 'background: #fde8e6; color: #b42318;' })[tone];
    const D = {
      new: [
        { ini: 'ST', trip: 'Red Sea Snorkel Day', co: 'Sunrise Tours Co.', date: 'Fri 24 Oct', priceLabel: 'Offered', price: '2,200', status: 'New offer', t: 'new', note: 'Album within 72 h · 150+ edited photos · reply by Thu 9 Oct, 10:12' }
      ],
      neg: [
        { ini: 'NA', trip: 'Edge of the World Hike', co: 'Najd Adventures', date: 'Sat 25 Oct', priceLabel: 'You countered', price: '1,600', status: 'Waiting for them', t: 'info', note: 'They offered 1,300 SAR · sunrise shoot from 04:00' },
        { ini: 'ST', trip: 'Al-Balad Heritage Walk', co: 'Sunrise Tours Co.', date: 'Sat 1 Nov', priceLabel: 'They countered', price: '1,300', status: 'Your turn', t: 'warn', note: 'You asked 1,500 SAR · evening shoot 18:00–23:00' }
      ],
      closed: [
        { ini: 'ST', trip: 'AlUla Heritage Weekend', co: 'Sunrise Tours Co.', date: 'Thu 16 Oct', priceLabel: 'Finalized', price: '4,800', status: 'Confirmed', t: 'ok', note: 'Both sides approved · assigned to Bus 1' },
        { ini: 'ST', trip: 'Taif Rose Farms', co: 'Sunrise Tours Co.', date: 'Sat 4 Oct', priceLabel: 'Finalized', price: '1,400', status: 'Confirmed', t: 'ok', note: 'Trip ended · album due within 72 h' },
        { ini: 'AN', trip: 'Grade 4 Zoo Day', co: 'Al Noor School', date: 'Wed 15 Oct', priceLabel: 'Offered', price: '600', status: 'Declined', t: 'bad', note: 'You declined · clashes with AlUla travel day' }
      ]
    };
    const H = { new: 'Companies that want you on a trip. Accept, counter or decline.', neg: 'Offers going back and forth. A deal is final once both sides approve.', closed: 'Finalized and declined offers from the last 90 days.' };
    const tabs = [['new', 'New', 1], ['neg', 'Negotiating', 2], ['closed', 'Closed', 3]].map(([id, label, count]) => {
      const on = this.state.tab === id;
      return { label, count: String(count), sel: on ? 'true' : 'false', go: () => this.setState({ tab: id }),
        style: 'flex: 1 1 0; height: 44px; border: 0; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; ' + (on ? 'background: #262a67; color: #f6f3e4;' : 'background: transparent; color: #262a67;'),
        cs: 'min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; font-size: 12px; line-height: 20px; ' + (on ? 'background: #f89e23; color: #262a67;' : 'background: #e6e8f5; color: #262a67;') };
    });
    const L = { ST: '../assets/697a49af6be5a077ae1851c1a8b9dfcd.svg', NA: '../assets/1134174426625e453cca9ca4339809ce.svg', AN: '../assets/f622ae191805b644d9e8f7a2610bfe1b.svg' };
    const deals = D[this.state.tab].map((d) => ({ ...d, logo: L[d.ini], ps: pill(d.t) }));
    return { tabs, deals, hint: H[this.state.tab] };
  }
}
</script>
</body>
</html>
