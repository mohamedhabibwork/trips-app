<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver · Profile &amp; rates</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 120px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Profile</h1>
<a href="DrvProfileEdit.dc.html" style="height: 40px; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid #7b7fa6; color: #262a67; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"></path></svg>Edit</a>
</div>

<section aria-label="Public profile preview" style="padding: 14px 16px; border-radius: 20px; background: #ffffff; display: flex; gap: 14px; align-items: center">
<img src="../assets/c311d0b40fa5c0d792261872e7c7b89d.svg" alt="" style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 20px; object-fit: cover">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 18px; font-weight: 700">Khalid Al-Harbi</span>
<span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="height: 24px; padding: 0 8px; border-radius: 999px; background: #e3f3ea; color: #1f7a4d; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6zM9 12l2 2 4-4"></path></svg>Verified</span><span style="display: flex; align-items: center; gap: 3px; font-size: 14px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="#f89e23" stroke="#8a4b00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>4.9 <span style="font-weight: 500; color: #5b5f86">· 128 trips</span></span></span>
<span style="font-size: 13px; color: #5b5f86">Arabic · English · Urdu</span>
</span>
</section>

<section aria-labelledby="rates-h" style="padding: 12px 16px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 10px">
<h2 id="rates-h" style="margin: 0; font-size: 15px; font-weight: 600">Rates &amp; regions</h2>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<span style="padding: 8px 12px; border-radius: 12px; background: #f6f3e4; display: flex; flex-direction: column"><span style="font-size: 12px; color: #5b5f86">Per day</span><span style="font-size: 18px; font-weight: 700">1,200 SAR</span></span>
<span style="padding: 8px 12px; border-radius: 12px; background: #f6f3e4; display: flex; flex-direction: column"><span style="font-size: 12px; color: #5b5f86">Per km over 250 km</span><span style="font-size: 18px; font-weight: 700">4.5 SAR</span></span>
</div>
<div role="list" aria-label="Service regions" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{regions}}" as="r" hint-placeholder-count="5"><span role="listitem" style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid #7b7fa6; display: flex; align-items: center; font-size: 13px; font-weight: 600">{{r}}</span></sc-for>
</div>
</section>

<section aria-labelledby="docs-h" style="border-radius: 20px; background: #ffffff; display: flex; flex-direction: column">
<h2 id="docs-h" style="margin: 0; padding: 12px 16px 2px; font-size: 15px; font-weight: 600">Documents</h2>
<sc-for list="{{docs}}" as="d" hint-placeholder-count="3">
<div style="{{d.rowStyle}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5"></path></svg>
<span style="flex-grow: 1; font-size: 14px; font-weight: 600">{{d.t}}</span>
<span style="height: 24px; padding: 0 8px; border-radius: 999px; background: #e3f3ea; color: #1f7a4d; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>{{d.s}}</span>
</div>
</sc-for>
</section>

<nav aria-label="Manage" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<sc-for list="{{links}}" as="l" hint-placeholder-count="6">
<a href="{{l.href}}" style="height: 44px; padding: 0 12px; border-radius: 12px; background: #ffffff; color: #262a67; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c93a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{l.d}}"></path></svg><span style="flex-grow: 1">{{l.t}}</span></a>
</sc-for>
</nav>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px">
<dc-import name="TabBar" role="driver" active="profile" hint-size="390px,120px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

}
</script>
</body>
</html>
