<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traveler · Apply as provider</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="TrvProfile.dc.html" aria-label="Back to profile" style="width: 44px; height: 44px; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Work with Trips Enjoy</h1>
</div>

<div role="tablist" aria-label="Apply as" style="display: flex; padding: 4px; border-radius: 999px; background: #ffffff; border: 1px solid #e3dfc9">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.on}}" style="{{t.style}}">{{t.t}}</button></sc-for>
</div>

<div style="padding: 14px 16px; border-radius: 20px; background: #262a67; color: #f6f3e4; display: flex; gap: 12px; align-items: center">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #31367a; color: #ff8655; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 600">{{headline}}</span><span style="font-size: 13px; line-height: 18px; color: #b8bad6">{{where}}</span></span>
</div>

<section aria-labelledby="req-h" style="padding: 12px 16px; border-radius: 20px; background: #ffffff">
<h2 id="req-h" style="margin: 0 0 4px; font-size: 15px; font-weight: 600">What you’ll need</h2>
<ul style="margin: 0; padding: 0; list-style: none">
<sc-for list="{{reqs}}" as="r" hint-placeholder-count="5">
<li style="{{r.row}}">
<span style="{{r.mark}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; line-height: 19px; font-weight: 600">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: #5b5f86">{{r.sub}}</span></span>
<span style="{{r.tagStyle}}">{{r.tag}}</span>
</li>
</sc-for>
</ul>
</section>

<p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: #e6e8f5; font-size: 13px; line-height: 18px; display: flex; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8h.01"></path></svg><span>{{note}}</span></p>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
<a href="{{ctaHref}}" style="height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">{{cta}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<span style="font-size: 13px; line-height: 18px; color: #5b5f86; text-align: center">After you apply, your status shows in Profile › Roles &amp; security.</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["driver","photographer","organization"],"default":"driver"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { role: null }; }
  renderVals() {
    const role = this.state.role || this.props.role || 'driver';
    const CHECK = 'M5 12.5l4.5 4.5L19 7', DOT = 'M12 12h.01', ALERT = 'M12 3l9.5 17h-19zM12 10v4M12 17h.01';
    const BUS = 'M6 4h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM4 11h16M8 18v2M16 18v2M8 14.5h.01M16 14.5h.01';
    const CAM = 'M4 8a2 2 0 0 1 2-2h2l2-2h4l2 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM12 9.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z';
    const USERS = 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM3 20a6 6 0 0 1 12 0M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14.5a6 6 0 0 1 3 5.5';
    const verified = ['Phone and email both verified', 'Phone +20 10 ••• 2210 done · email still needs a code', 'warn', 'Verify'];
    const R = {
      driver: {
        icon: BUS, headline: 'Drive group trips', where: 'You apply and work in the Trips Enjoy driver app, with the same account.',
        reqs: [verified,
          ['Your own vehicle', 'Registration, plus insurance valid 3 or more months', 'todo', 'In app'],
          ['Driving licence and national ID', 'PDF, JPG or PNG, up to 10 MB each', 'todo', 'In app'],
          ['Lab test result', 'Dated in the last 30 days · free at partner labs', 'todo', 'In app'],
          ['Driver terms and consents', 'Read and accept before you send', 'todo', 'In app']],
        note: 'Pick a plan when you apply. Nothing is charged before approval, and you start on Basic. We decide within 2 working days.',
        cta: 'Open the driver app', href: 'DrvHome.dc.html'
      },
      photographer: {
        icon: CAM, headline: 'Photograph group trips', where: 'You apply in the Trips Enjoy studio, which opens in the in-app browser.',
        reqs: [verified,
          ['At least 8 portfolio photos', 'JPEG, PNG or HEIC, up to 25 MB each', 'todo', 'In studio'],
          ['Your specialties', 'For example groups, families, school trips', 'todo', 'In studio'],
          ['Service area', 'The cities and regions you cover', 'todo', 'In studio'],
          ['Photographer terms', 'Read and accept before you send', 'todo', 'In studio']],
        note: 'Pick a plan when you apply. Nothing is charged before approval, and you start on Basic. We decide within 2 working days.',
        cta: 'Open the studio', href: 'PhoWebStudio.dc.html'
      },
      organization: {
        icon: USERS, headline: 'Run trips as an organization', where: 'Organizations register on the web. Use a computer for the documents.',
        reqs: [verified,
          ['Legal name in Arabic and English', 'Exactly as on your commercial registration', 'todo', 'On web'],
          ['Commercial registration and tax number', 'PDF, JPG or PNG, up to 10 MB each', 'todo', 'On web'],
          ['Billing contact', 'Name, email and phone for invoices', 'todo', 'On web'],
          ['Organization terms', 'Accepted by the owner', 'todo', 'On web']],
        note: 'Approved organizations start on the Starter plan and can change plans later. We decide within 2 working days.',
        cta: 'Open web registration', href: 'WebBusiness.dc.html'
      }
    }[role];
    const tabs = [['driver', 'Driver'], ['photographer', 'Photographer'], ['organization', 'Organization']].map(([id, t]) => ({ t, sel: role === id ? 'true' : 'false', on: () => this.setState({ role: id }),
      style: 'flex: 1 1 0; height: 40px; border: 0; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (role === id ? 'background: #262a67; color: #f6f3e4;' : 'background: transparent; color: #262a67;') }));
    const reqs = R.reqs.map(([t, sub, st, tag], i) => ({ t, sub, tag,
      d: st === 'warn' ? ALERT : st === 'ok' ? CHECK : DOT,
      row: 'min-height: 48px; padding: 6px 0; display: flex; align-items: center; gap: 10px;' + (i < R.reqs.length - 1 ? ' border-bottom: 1px solid #e3dfc9;' : ''),
      mark: 'width: 24px; height: 24px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; ' + (st === 'warn' ? 'background: #fdf0d5; color: #8a4b00;' : 'background: #e6e8f5; color: #262a67;'),
      tagStyle: 'flex-shrink: 0; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; ' + (st === 'warn' ? 'background: #fdf0d5; color: #8a4b00;' : 'background: #f6f3e4; color: #5b5f86;') }));
    return { tabs, reqs, icon: R.icon, headline: R.headline, where: R.where, note: R.note, cta: R.cta, ctaHref: R.href };
  }
}
</script>
</body>
</html>
