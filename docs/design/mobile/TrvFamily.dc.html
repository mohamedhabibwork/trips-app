<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traveler · Family members</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="TrvProfile.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Family members</h1><span style="font-size: 13px; color: #5b5f86">Book for them in one go</span></div>
</div>

<div style="padding: 10px 12px; border-radius: 12px; background: #e6e8f5; display: flex; gap: 10px; font-size: 14px; line-height: 19px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4"></path></svg><span>Only you see your family’s details and live location. Organizers see names and seats on trips you book.</span></div>

<sc-for list="{{members}}" as="m" hint-placeholder-count="3">
<div style="border-radius: 20px; background: #ffffff; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #e6e8f5; overflow: hidden; display: block"><img src="{{m.av}}" alt="" style="width: 100%; height: 100%; border-radius: 999px; object-fit: cover; display: block"></span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">{{m.name}}</span><span style="font-size: 13px; color: #5b5f86">{{m.meta}}</span></span>
<a href="#" aria-label="{{m.editAria}}" style="width: 44px; height: 44px; border-radius: 999px; background: #f6f3e4; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"></path></svg></a>
</div>
<sc-if value="{{m.hasLink}}" hint-placeholder-val="{{false}}"><a href="ParLink.dc.html" style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #262a67; text-decoration: none; padding: 8px 10px; border-radius: 12px; background: #f6f3e4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg><span style="flex-grow: 1">{{m.link}}</span><span style="font-weight: 600; color: #c93a00">Manage</span></a></sc-if>
<div style="display: flex; align-items: center; gap: 12px; padding-top: 10px; border-top: 1px solid #e3dfc9">
<span style="flex-grow: 1; display: flex; flex-direction: column"><span id="{{m.id}}" style="font-size: 14px; font-weight: 600">Live trip tracking</span><span style="{{m.statusStyle}}">{{m.status}}</span></span>
<sc-if value="{{m.canTrack}}" hint-placeholder-val="{{true}}"><button type="button" role="switch" aria-checked="{{m.checked}}" aria-labelledby="{{m.id}}" onClick="{{m.toggle}}" style="{{m.sw}}"><span style="width: 26px; height: 26px; border-radius: 999px; background: #ffffff; display: block"></span></button></sc-if>
</div>
</div>
</sc-for>

<a href="TrvFamilyAdd.dc.html" style="margin-top: auto; height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add family member</a>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { track: { omar: true, lina: false } }; }
  renderVals() {
    const tr = this.state.track;
    const M = [
      { id: 'faisal', init: 'FA', av: '../assets/9027ab49e36dcb334b88be60fa1fb65c.svg', name: 'Faisal Al-Qahtani', meta: 'Adult · husband · has his own account', adult: true },
      { id: 'omar', init: 'OM', av: '../assets/e627328c50e6893b77803c4a27b29c6e.svg', name: 'Omar', meta: 'Child · 9', link: 'Linked to Al Noor School · code ANS-G4-2291' },
      { id: 'lina', init: 'LI', av: '../assets/1cd63ceb2af4109eddb6e3740d99b590.svg', name: 'Lina', meta: 'Child · 6' }
    ];
    const members = M.map((m) => {
      const on = !!tr[m.id];
      return {
        init: m.init, av: m.av, name: m.name, meta: m.meta, editAria: 'Edit ' + m.name, id: 'trk-' + m.id,
        hasLink: !!m.link, link: m.link || '', canTrack: !m.adult, checked: on ? 'true' : 'false',
        status: m.adult ? 'Adults share their own location' : on ? 'On · you get boarding and drop-off alerts' : 'Off · no alerts for this child',
        statusStyle: 'font-size: 13px; ' + (m.adult ? 'color: #5b5f86;' : on ? 'color: #1f7a4d; font-weight: 600;' : 'color: #5b5f86;'),
        toggle: () => this.setState({ track: { ...this.state.track, [m.id]: !this.state.track[m.id] } }),
        sw: 'width: 52px; height: 32px; flex-shrink: 0; padding: 3px; border-radius: 999px; border: 0; cursor: pointer; display: flex; ' + (on ? 'background: #262a67; justify-content: flex-end;' : 'background: #7b7fa6; justify-content: flex-start;')
      };
    });
    return { members };
  }
}
</script>
</body>
</html>
