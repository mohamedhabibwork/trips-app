<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0} .te-an:focus-visible{outline:2px solid #f89e23;outline-offset:2px} .te-an:hover{background:#31367a}</style>
</helmet>
<nav aria-label="Admin" style="width: 248px; height: 900px; box-sizing: border-box; background: #262a67; color: #f6f3e4; font-family: Outfit, Nunito, system-ui, sans-serif; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<img src="../assets/6ea846350ba3adc0e289d47fa0612c3b.svg" alt="Trips Enjoy" style="height: 40px; width: auto; align-self: flex-start">
<span style="align-self: flex-start; padding: 2px 10px; border-radius: 999px; background: #31367a; color: #b8bad6; font-size: 12px; font-weight: 600">Admin</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="7">
<a href="{{i.href}}" class="te-an" aria-current="{{i.cur}}" style="{{i.style}}"><span style="flex-grow: 1">{{i.t}}</span><sc-if value="{{i.hasN}}" hint-placeholder-val="{{false}}"><span style="padding: 0 8px; border-radius: 999px; background: #f89e23; color: #262a67; font-size: 12px; font-weight: 700; line-height: 20px">{{i.n}}</span></sc-if></a>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; font-size: 14px"><img src="../assets/a2107042fb2903c5e36101018e509bf2.svg" alt="" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; object-fit: cover"><span style="display: flex; flex-direction: column"><span style="font-weight: 600">Reem Ops</span><span style="font-size: 12px; color: #b8bad6">Driver compliance</span></span></div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Applications","Drivers","Lab tests"],"default":"Drivers"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'Drivers';
const H = { Overview: 'AdmHome.dc.html', Applications: 'AdminApplications.dc.html', Drivers: 'AdmProviders.dc.html', Photographers: 'AdmProviders.dc.html', Organizations: 'AdmOrgs.dc.html', 'Lab tests': 'AdmLabTests.dc.html', Settings: 'AdmSettings.dc.html' };
const xs = [['Overview', 0], ['Applications', 14], ['Drivers', 0], ['Photographers', 0], ['Organizations', 3], ['Lab tests', 5], ['Settings', 0]];
return { items: xs.map(([t, n]) => ({ t, n, href: H[t], hasN: n > 0, cur: t === a ? 'page' : 'false',
style: 'display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; color: #f6f3e4; text-decoration: none; font-size: 15px; font-weight: ' + (t === a ? '600; background: #31367a; box-shadow: inset 3px 0 0 #ff6c2e;' : '500;') })) };
}
}
</script>
</body>
</html>
