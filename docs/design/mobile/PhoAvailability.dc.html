<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photographer · Rates &amp; availability</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="PhoHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-size: 22px; line-height: 28px; font-weight: 700">Rates &amp; availability</h1>
<a href="PhoOffers.dc.html" style="font-size: 14px; font-weight: 600">Offers</a>
</div>

<section aria-labelledby="mo-h" style="padding: 10px 12px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #f6f3e4; color: #262a67; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<h2 id="mo-h" style="margin: 0; font-size: 17px; font-weight: 600">October 2025</h2>
<button type="button" aria-label="Next month" style="width: 44px; height: 44px; border-radius: 999px; border: none; background: #f6f3e4; color: #262a67; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; font-weight: 600; color: #5b5f86">
<sc-for list="{{wd}}" as="w" hint-placeholder-count="7"><span>{{w}}</span></sc-for>
</div>
<div role="group" aria-label="Days in October 2025" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<sc-if value="{{c.blank}}" hint-placeholder-val="{{false}}"><span></span></sc-if>
<sc-if value="{{c.day}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{c.go}}" aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" aria-disabled="{{c.dis}}" style="{{c.style}}">{{c.n}}</button></sc-if>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 2px; font-size: 12px; color: #5b5f86">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #ffffff; border: 1px solid #7b7fa6"></span>Available</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #ff6c2e"></span>Assigned</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #5b5f86"></span>Unavailable</span>
</div>
</section>

<div role="radiogroup" aria-label="How to mark dates" style="height: 44px; flex-shrink: 0; box-sizing: border-box; padding: 4px; border-radius: 999px; background: #ffffff; border: 1px solid #e3dfc9; display: flex">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{m.sel}}" onClick="{{m.go}}" style="{{m.style}}">{{m.t}}</button>
</sc-for>
</div>
<span role="status" style="{{infoStyle}}">{{info}}</span>

<section aria-labelledby="rt-h" style="padding: 10px 14px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 id="rt-h" style="margin: 0; font-size: 15px; font-weight: 600">Rates</h2><span style="font-size: 12px; color: #5b5f86">Shown to organizers</span></div>
<sc-for list="{{rates}}" as="r" hint-placeholder-count="3">
<div style="{{r.row}}">
<label for="{{r.id}}" style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">{{r.t}}</span><span style="font-size: 12px; color: #5b5f86">{{r.d}}</span></label>
<span style="width: 132px; flex-shrink: 0; position: relative; display: flex">
<input id="{{r.id}}" inputmode="numeric" value="{{r.v}}" style="width: 100%; height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 46px 0 12px; font: inherit; font-size: 16px; font-weight: 600; color: #262a67; text-align: end">
<span style="position: absolute; top: 0; bottom: 0; right: 10px; display: flex; align-items: center; font-size: 13px; color: #5b5f86">SAR</span>
</span>
</div>
</sc-for>
</section>

<button type="button" onClick="{{save}}" aria-disabled="{{saveDis}}" style="{{saveStyle}}">{{saveLabel}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"offline":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { blocked: [21, 22, 23, 30], mode: 0, start: 0, msg: '', saved: false }; }
  renderVals() {
    const today = 12;
    const assigned = [16, 17, 18, 24];
    const bl = this.state.blocked;
    const wdn = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const offline = !!this.props.offline;
    const cells = [];
    for (let i = 0; i < 3; i++) cells.push({ blank: true, day: false });
    for (let d = 1; d <= 31; d++) {
      const isA = assigned.includes(d), isX = bl.includes(d), past = d < today;
      let look = 'background: #ffffff; color: #262a67; border: 1px solid #e3dfc9;';
      let st = 'available';
      if (isA) { look = 'background: #ff6c2e; color: #262a67; border: none; font-weight: 700;'; st = 'assigned to a trip'; }
      else if (isX) { look = 'background: #5b5f86; color: #ffffff; border: none; text-decoration: line-through;'; st = 'unavailable'; }
      if (past && !isA) look += ' opacity: 0.55;';
      if (d === today) look += ' box-shadow: 0 0 0 2px #262a67 inset;';
      if (d === this.state.start) look += ' box-shadow: 0 0 0 2px #fb8030 inset;';
      const name = wdn[(d + 2) % 7] + ' ' + d + ' Oct';
      cells.push({ blank: false, day: true, n: String(d), dis: (past || isA) ? 'true' : 'false', pressed: isX ? 'true' : 'false',
        aria: wdn[(d + 2) % 7] + ' ' + d + ' October, ' + st + (d === today ? ', today' : ''),
        go: () => {
          if (past) return;
          if (isA) { this.setState({ msg: name + ' is assigned to ' + (d === 24 ? 'Red Sea Snorkel Day' : 'AlUla Heritage Weekend') + ', so it cannot be marked unavailable.', start: 0 }); return; }
          if (this.state.mode === 0) { this.setState({ msg: '', saved: false, blocked: isX ? bl.filter((x) => x !== d) : bl.concat([d]) }); return; }
          const s = this.state.start;
          if (!s) { this.setState({ start: d, msg: '' }); return; }
          const a = Math.min(s, d), b = Math.max(s, d);
          const hit = assigned.find((x) => x >= a && x <= b);
          if (hit) { this.setState({ start: 0, msg: 'That range includes ' + hit + ' Oct, which is assigned. Pick dates around it.' }); return; }
          const add = []; for (let x = a; x <= b; x++) if (!bl.includes(x)) add.push(x);
          this.setState({ start: 0, msg: '', saved: false, blocked: bl.concat(add) });
        },
        style: 'height: 34px; border-radius: 10px; font: inherit; font-size: 14px; padding: 0; cursor: ' + ((past || isA) ? 'default' : 'pointer') + '; ' + look });
    }
    const modes = ['Single date', 'Date range'].map((t, i) => {
      const on = this.state.mode === i;
      return { t, sel: on ? 'true' : 'false', go: () => this.setState({ mode: i, start: 0 }),
        style: 'flex: 1 1 0; border: none; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #262a67; color: #f6f3e4;' : 'background: transparent; color: #262a67;') };
    });
    const sorted = bl.slice().sort((a, b) => a - b), groups = [];
    sorted.forEach((d) => { const g = groups[groups.length - 1]; if (g && d === g[1] + 1) g[1] = d; else groups.push([d, d]); });
    const list = groups.map(([a, b]) => a === b ? a + ' Oct' : a + '–' + b + ' Oct').join(', ');
    let info, tone;
    if (offline) { info = 'You are offline. Dates and rates need a connection to save.'; tone = 'warn'; }
    else if (this.state.msg) { info = this.state.msg; tone = 'warn'; }
    else if (this.state.saved) { info = 'Saved 10:42. Offers on ' + (list || 'no dates') + ' will be refused.'; tone = 'ok'; }
    else if (this.state.mode === 1 && this.state.start) { info = 'From ' + this.state.start + ' Oct. Now tap the last day.'; tone = 'plain'; }
    else { info = groups.length ? 'Unavailable: ' + list + '. Offers on these dates are refused.' : 'No dates marked. Organizers can offer any free day.'; tone = 'plain'; }
    const infoStyle = 'margin-top: -4px; font-size: 13px; line-height: 18px; ' + ({ warn: 'padding: 8px 10px; border-radius: 10px; background: #fdf0d5; color: #8a4b00;', ok: 'padding: 8px 10px; border-radius: 10px; background: #e3f3ea; color: #1f7a4d;', plain: 'color: #5b5f86;' })[tone];
    const rates = [
      ['r1', 'Full trip day', 'Up to 10 hours with the group', '1,800'],
      ['r2', 'Half day', 'Up to 4 hours', '1,000'],
      ['r3', 'Group photo session', 'One program or stop', '450']
    ].map(([id, t, d, v], i) => ({ id, t, d, v, row: 'min-height: 52px; display: flex; align-items: center; gap: 10px; ' + (i ? 'border-top: 1px solid #e3dfc9;' : '') }));
    return { wd: wdn, cells, modes, info, infoStyle, rates, offline,
      saveDis: offline ? 'true' : 'false',
      saveLabel: offline ? 'Connect to save' : 'Save',
      saveStyle: 'margin-top: auto; height: 52px; flex-shrink: 0; border: 0; border-radius: 12px; font: inherit; font-size: 17px; font-weight: 700; ' + (offline ? 'background: #e3dfc9; color: #5b5f86; cursor: not-allowed;' : 'background: #ff6c2e; color: #262a67; cursor: pointer;'),
      save: () => { if (!offline) this.setState({ saved: true, msg: '' }); } };
  }
}
</script>
</body>
</html>
