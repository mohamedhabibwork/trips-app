<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver · Earnings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 120px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700">Earnings</h1>
<button type="button" onClick="{{togExport}}" aria-expanded="{{expAria}}" style="height: 40px; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid #7b7fa6; color: #262a67; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>Export</button>
</div>
<sc-if value="{{showExport}}" hint-placeholder-val="{{false}}">
<div role="status" style="padding: 10px 12px; border-radius: 12px; background: #fdf0d5; color: #8a4b00; font-size: 14px; line-height: 19px; display: flex; gap: 8px; align-items: center"><span style="flex-grow: 1">CSV and PDF export needs Premium. Your Professional plan includes full reports in the app.</span><a href="DrvPlanManage.dc.html" style="font-weight: 700; color: #8a4b00">Upgrade</a></div>
</sc-if>

<section aria-label="October summary" style="padding: 16px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<span style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #5b5f86">October · after platform commission</span><span style="font-size: 32px; line-height: 38px; font-weight: 700">6,100 <span style="font-size: 16px; font-weight: 500; color: #5b5f86">SAR</span></span></span>
<span style="font-size: 13px; font-weight: 600; color: #1f7a4d">+18% vs Sep</span>
</div>
<div role="img" aria-label="{{chartLabel}}" style="height: 96px; display: flex; align-items: flex-end; gap: 14px; padding-bottom: 4px; border-bottom: 1px solid #e3dfc9">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
<span style="flex: 1 1 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px"><span style="font-size: 12px; font-weight: 600">{{b.v}}</span><span style="{{b.style}}"></span></span>
</sc-for>
</div>
<div style="display: flex; gap: 14px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="4"><span style="flex: 1 1 0; text-align: center; font-size: 12px; color: #5b5f86">{{b.l}}</span></sc-for>
</div>
</section>

<a href="DrvStatements.dc.html" style="padding: 12px 14px; border-radius: 20px; background: #262a67; color: #f6f3e4; text-decoration: none; display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #31367a; color: #ff8655; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12v4M4 7v11a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2zM16 14.5h.01"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Next payout · Mon 20 Oct, 06:00</span><span style="font-size: 13px; color: #b8bad6">4,350 SAR to Al Rajhi Bank ending 2207</span></span>
<span style="font-size: 14px; font-weight: 600; color: #ff8655">Bank</span>
</a>

<section aria-labelledby="tl-h" style="border-radius: 20px; background: #ffffff; display: flex; flex-direction: column">
<h2 id="tl-h" style="margin: 0; padding: 12px 16px 4px; font-size: 15px; font-weight: 600">Trips</h2>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="{{r.rowStyle}}">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{r.t}}</span><span style="font-size: 12px; color: #5b5f86">{{r.d}}</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{r.a}} SAR</span><span style="{{r.pill}}">{{r.s}}</span></span>
</div>
</sc-for>
</section>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px">
<dc-import name="TabBar" role="driver" active="earnings" hint-size="390px,120px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { exp: false }; }
  renderVals() {
    const B = [['1–7 Oct', 1100, false], ['8–14 Oct', 650, false], ['15–21 Oct', 4350, false], ['22–28 Oct', 1450, true]];
    const max = 4350;
    const bars = B.map(([l, v, sched]) => ({ l, v: v.toLocaleString('en-US'),
      style: 'width: 100%; max-width: 48px; border-radius: 8px 8px 2px 2px; height: ' + Math.max(6, Math.round((v / max) * 70)) + 'px; ' + (sched ? 'background: #ffffff; border: 2px dashed #fb8030; box-sizing: border-box;' : 'background: #ff6c2e;') }));
    const P = { paid: 'background: #e3f3ea; color: #1f7a4d;', pend: 'background: #fdf0d5; color: #8a4b00;', sch: 'background: #e6e8f5; color: #262a67;' };
    const R = [
      ['Red Sea Snorkel Day', 'Fri 24 Oct · Sunrise Tours Co.', '1,450', 'Scheduled', 'sch'],
      ['AlUla Heritage Weekend', 'Thu 16 – Sat 18 Oct · 3 days', '4,350', 'Pending', 'pend'],
      ['Jeddah Corniche Night', 'Sat 11 Oct · Sunrise Tours Co.', '650', 'Paid', 'paid'],
      ['Taif Rose Farms', 'Sat 4 Oct · Desert Rose Travel', '1,100', 'Paid', 'paid']
    ];
    const rows = R.map(([t, d, a, s, k], i) => ({ t, d, a, s,
      pill: 'padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; ' + P[k],
      rowStyle: 'padding: 7px 16px; display: flex; align-items: center; gap: 12px; ' + (i ? 'border-top: 1px solid #e3dfc9;' : '') }));
    const e = this.state.exp;
    return { bars, rows, chartLabel: 'Weekly earnings: 1,100, 650, 4,350 SAR paid or pending, 1,450 SAR scheduled for 22–28 Oct',
      showExport: e, expAria: e ? 'true' : 'false', togExport: () => this.setState({ exp: !e }) };
  }
}
</script>
</body>
</html>
