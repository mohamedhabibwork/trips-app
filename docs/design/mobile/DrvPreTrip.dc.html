<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver · Pre-trip check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="DrvTrip.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Pre-trip check</h1><span style="font-size: 13px; color: #5b5f86">Bus 2 · ABC 4821 · before 07:40 pickup</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">{{doneText}}</span><span style="color: #5b5f86">Tap each item once checked</span></div>
<span role="progressbar" aria-valuemin="0" aria-valuemax="9" aria-valuenow="{{doneCount}}" aria-label="Checklist progress" style="height: 8px; border-radius: 999px; background: #e3dfc9; display: flex; overflow: hidden"><span style="{{barStyle}}"></span></span>
</div>

<div role="group" aria-label="Vehicle checklist" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="9">
<button type="button" role="checkbox" aria-checked="{{it.on}}" onClick="{{it.tog}}" style="{{it.style}}"><span style="{{it.box}}"><sc-if value="{{it.checked}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if></span>{{it.t}}</button>
</sc-for>
</div>

<div style="display: flex; gap: 10px; align-items: flex-end">
<div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px">
<label for="odo" style="font-size: 14px; font-weight: 600">Odometer (km)</label>
<input id="odo" type="text" inputmode="numeric" value="128,446" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67; width: 100%">
</div>
<button type="button" onClick="{{togPhoto}}" style="{{photoStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{photoIcon}}"></path></svg>{{photoLabel}}</button>
</div>

<a href="DrvReport.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19zM12 10v4M12 17h.01"></path></svg>Report a problem to Sunrise ops</a>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
<a href="DrvOnRoute.dc.html" style="height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Ready at pickup</a>
</sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{true}}">
<button type="button" disabled="" aria-describedby="rd-h" style="height: 52px; border-radius: 12px; border: none; background: #e3dfc9; color: #5b5f86; font: inherit; font-size: 17px; font-weight: 700">Ready at pickup</button>
<span id="rd-h" style="text-align: center; font-size: 13px; color: #5b5f86">{{remainText}}</span>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { done: [true, true, true, true, true, true, false, false, false], photo: false }; }
  renderVals() {
    const L = ['Tyres', 'Brakes', 'Lights', 'Air conditioning', 'First-aid kit', 'Fire extinguisher', 'Fuel at least 3/4', 'Cabin clean', 'Seat belts'];
    const done = this.state.done;
    const n = done.filter(Boolean).length;
    const items = L.map((t, i) => {
      const on = done[i];
      return { t, on: on ? 'true' : 'false', checked: on,
        tog: () => { const d = done.slice(); d[i] = !d[i]; this.setState({ done: d }); },
        style: 'min-height: 52px; padding: 0 12px; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 600; text-align: start; color: #262a67; cursor: pointer; display: flex; align-items: center; gap: 10px; ' + (on ? 'background: #e3f3ea; border: 1px solid #1f7a4d;' : 'background: #ffffff; border: 1px solid #7b7fa6;'),
        box: 'width: 24px; height: 24px; box-sizing: border-box; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #1f7a4d;' : 'border: 2px solid #7b7fa6; background: #ffffff;') };
    });
    const ph = this.state.photo;
    const ready = n === L.length;
    const left = L.filter((_, i) => !done[i]);
    return {
      items, doneCount: String(n), doneText: n + ' of ' + L.length + ' checked',
      barStyle: 'width: ' + Math.round((n / L.length) * 100) + '%; background: ' + (ready ? '#1f7a4d' : '#ff6c2e') + '; border-radius: 999px',
      ready, notReady: !ready,
      remainText: 'Still to check: ' + left.join(', '),
      togPhoto: () => this.setState({ photo: !ph }),
      photoLabel: ph ? 'Dashboard photo added' : 'Dashboard photo',
      photoIcon: ph ? 'M5 12.5l4.5 4.5L19 7' : 'M4 8a2 2 0 0 1 2-2h2l2-2h4l2 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM12 9.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z',
      photoStyle: 'flex: 1 1 0; height: 52px; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; ' + (ph ? 'background: #e3f3ea; color: #1f7a4d; border: 1px solid #1f7a4d;' : 'background: #ffffff; color: #262a67; border: 1px dashed #7b7fa6;')
    };
  }
}
</script>
</body>
</html>
