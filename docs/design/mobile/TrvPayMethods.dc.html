<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traveler · Payment methods</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="TrvPlan.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Payment methods</h1><span style="font-size: 13px; color: #5b5f86">Used for bookings and your Explorer plan</span></div>
</div>

<div role="radiogroup" aria-label="Default payment method" style="border-radius: 20px; background: #ffffff; padding: 0 14px">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{m.sel}}" onClick="{{m.on}}" style="{{m.row}}">
<span style="{{m.badge}}">{{m.brand}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; text-align: start"><span style="font-size: 15px; font-weight: 600">{{m.name}}</span><span style="font-size: 12px; color: #5b5f86">{{m.meta}}</span></span>
<sc-if value="{{m.isDef}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 8px; border-radius: 999px; background: #e3f3ea; color: #1f7a4d; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 3px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>Default</span></sc-if>
<span style="{{m.dot}}"><span style="{{m.dotIn}}"></span></span>
</button>
</sc-for>
</div>

<sc-if value="{{closed}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{toggleForm}}" style="height: 52px; border: 1px solid #7b7fa6; border-radius: 12px; background: #ffffff; color: #262a67; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a card</button>
</sc-if>

<sc-if value="{{open}}" hint-placeholder-val="{{true}}">
<form aria-labelledby="add-h" style="margin: 0; padding: 14px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="add-h" style="margin: 0; font-size: 17px; font-weight: 600">Add a card</h2>
<button type="button" aria-label="Close add card" onClick="{{toggleForm}}" style="width: 36px; height: 36px; border: 0; border-radius: 999px; background: #f6f3e4; color: #262a67; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cc-num" style="font-size: 14px; font-weight: 600">Card number</label>
<input id="cc-num" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67">
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="cc-exp" style="font-size: 14px; font-weight: 600">Expiry</label>
<input id="cc-exp" type="text" inputmode="numeric" autocomplete="cc-exp" placeholder="MM / YY" style="height: 52px; width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67">
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<label for="cc-cvv" style="font-size: 14px; font-weight: 600">CVV</label>
<input id="cc-cvv" type="text" inputmode="numeric" autocomplete="cc-csc" placeholder="3 digits" style="height: 52px; width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cc-name" style="font-size: 14px; font-weight: 600">Name on card</label>
<input id="cc-name" type="text" autocomplete="cc-name" value="Sara Al-Qahtani" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67">
</div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px; font-weight: 500; cursor: pointer"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #262a67">Set as default for bookings and plan</label>
</form>
</sc-if>

<p style="margin: 0; font-size: 12px; line-height: 16px; color: #5b5f86; display: flex; gap: 6px; align-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#262a67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>Card details are kept by our payment provider, never on this phone.</p>

<a href="TrvPlan.dc.html" style="margin-top: auto; height: 52px; flex-shrink: 0; border-radius: 12px; background: #ff6c2e; color: #262a67; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">{{cta}}</a>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { def: 'visa', form: true }; }
  renderVals() {
    const def = this.state.def;
    const M = [
      { id: 'visa', brand: 'VISA', name: 'Visa •• 4421', meta: 'Expires 09/28', bg: '#262a67', fg: '#f6f3e4' },
      { id: 'mada', brand: 'mada', name: 'mada •• 7719', meta: 'Expires 03/27', bg: '#e6e8f5', fg: '#262a67' },
      { id: 'apple', brand: 'Pay', name: 'Apple Pay', meta: 'Ready on this iPhone', bg: '#262a67', fg: '#f6f3e4' },
      { id: 'stc', brand: 'stc', name: 'STC Pay', meta: '+966 55 ••• 4821', bg: '#ffe7dc', fg: '#c93a00' }
    ];
    const methods = M.map((m, i) => {
      const on = def === m.id;
      return { ...m, sel: on ? 'true' : 'false', isDef: on, on: () => this.setState({ def: m.id }),
        row: 'width: 100%; min-height: 56px; padding: 0; border: 0; background: transparent; font: inherit; color: #262a67; cursor: pointer; display: flex; align-items: center; gap: 12px;' + (i < M.length - 1 ? ' border-bottom: 1px solid #e3dfc9;' : ''),
        badge: 'width: 46px; height: 30px; flex-shrink: 0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: ' + m.bg + '; color: ' + m.fg + ';',
        dot: 'width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 999px; display: flex; align-items: center; justify-content: center; border: 2px solid ' + (on ? '#262a67;' : '#7b7fa6;'),
        dotIn: 'width: 10px; height: 10px; border-radius: 999px; background: ' + (on ? '#262a67;' : 'transparent;') };
    });
    const f = this.state.form;
    return { methods, open: f, closed: !f, toggleForm: () => this.setState({ form: !this.state.form }), cta: f ? 'Save card' : 'Done' };
  }
}
</script>
</body>
</html>
