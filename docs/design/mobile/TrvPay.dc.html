<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book · 5 Payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="height: 100%; box-sizing: border-box; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="TrvBookSummary.dc.html" aria-label="Back to summary" style="width: 44px; height: 44px; border-radius: 999px; background: #ffffff; color: #262a67; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Payment</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div role="progressbar" aria-label="Booking progress" aria-valuemin="1" aria-valuemax="5" aria-valuenow="5" aria-valuetext="Step 5 of 5, Payment" style="display: flex; gap: 4px">
<span style="flex: 1 1 0; height: 6px; border-radius: 999px; background: #262a67"></span>
<span style="flex: 1 1 0; height: 6px; border-radius: 999px; background: #262a67"></span>
<span style="flex: 1 1 0; height: 6px; border-radius: 999px; background: #262a67"></span>
<span style="flex: 1 1 0; height: 6px; border-radius: 999px; background: #262a67"></span>
<span style="flex: 1 1 0; height: 6px; border-radius: 999px; background: #ff6c2e"></span>
</div>
<span style="font-size: 13px; font-weight: 600; color: #5b5f86">Step 5 of 5 · Last step</span>
</div>

<div style="padding: 16px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #5b5f86">Amount to pay</span>
<span style="font-size: 32px; line-height: 40px; font-weight: 700">{{amount}}</span>
<span style="font-size: 13px; color: #5b5f86">{{tripLine}}</span></div>

<sc-if value="{{hasBanner}}" hint-placeholder-val="{{false}}">
<div role="alert" style="{{bannerStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l9.5 17h-19zM12 10v4M12 17h.01"></path></svg><span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14px">{{bannerTitle}}</strong><span>{{bannerText}}</span></span></div>
</sc-if>

<div role="radiogroup" aria-labelledby="pm-l" style="display: flex; flex-direction: column; gap: 8px">
<span id="pm-l" style="font-size: 14px; font-weight: 600">Pay with</span>
<sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="{{m.style}}">
<span style="{{m.ring}}"><span style="{{m.dot}}"></span></span>
<span style="{{m.logo}}">{{m.mark}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; text-align: left; line-height: 18px"><span style="font-size: 15px; font-weight: 600">{{m.name}}</span><span style="font-size: 13px; color: #5b5f86">{{m.sub}}</span></span>
</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="bill" style="font-size: 14px; font-weight: 600">Name on receipt</label>
<input id="bill" type="text" value="{{payer}}" autocomplete="name" style="height: 52px; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #fff; padding: 0 14px; font: inherit; font-size: 16px; color: #262a67">
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; line-height: 18px; color: #5b5f86; display: flex; gap: 8px; align-items: flex-start"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1f7a4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>{{secureNote}}</span>
<sc-if value="{{canPay}}" hint-placeholder-val="{{true}}"><a href="{{payHref}}" style="height: 52px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">{{payLabel}}</a></sc-if>
<sc-if value="{{blocked}}" hint-placeholder-val="{{false}}"><button type="button" disabled="" aria-disabled="true" style="height: 52px; border: 0; border-radius: 12px; background: #e3dfc9; color: #5b5f86; font: inherit; font-weight: 700; font-size: 16px">{{payLabel}}</button></sc-if>
<div style="display: flex; justify-content: center; gap: 20px">
<a href="TrvPayPending.dc.html" style="min-height: 32px; display: flex; align-items: center; font-size: 13px; font-weight: 600">Slow gateway example</a>
<a href="TrvPayFailed.dc.html" style="min-height: 32px; display: flex; align-items: center; font-size: 13px; font-weight: 600">Card declined example</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"country":{"editor":"enum","options":["EG","SA"],"default":"EG"},"payState":{"editor":"enum","options":["normal","holdExpired","thirdAttempt","handoffFailed"],"default":"normal"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { method: null }; }
  renderVals() {
    const eg = (this.props.country ?? 'EG') !== 'SA';
    const ps = this.props.payState ?? 'normal';
    const C = eg ? {
      amount: '10,425 EGP', tripLine: 'Siwa Oasis Escape · Nile Horizon Tours · 2 travellers', payer: 'Mariam Adel', gw: 'Paymob', hold: '12:48', def: 'card',
      M: [
        { id: 'card', name: 'Card or mobile wallet', sub: 'Visa, Mastercard, Meeza or wallet · on Paymob’s secure page', mark: 'Card', bg: '#e6e8f5', fg: '#262a67' },
        { id: 'fawry', name: 'Cash at Fawry', sub: 'Get a reference, pay at any Fawry outlet within 48 h', mark: 'Fawry', bg: '#fdf0d5', fg: '#8a4b00' }
      ]
    } : {
      amount: '5,402 SAR', tripLine: 'AlUla Heritage Weekend · 4 travellers', payer: 'Sara Al-Qahtani', gw: 'the gateway', hold: '09:41', def: 'card',
      M: [
        { id: 'card', name: 'mada or credit card', sub: 'mada, Visa or Mastercard · on the gateway’s secure page', mark: 'mada', bg: '#e6e8f5', fg: '#262a67' },
        { id: 'apple', name: 'Apple Pay', sub: 'Shown on the gateway’s secure page', mark: 'Pay', bg: '#262a67', fg: '#f6f3e4' }
      ]
    };
    const cur = this.state.method && C.M.some((m) => m.id === this.state.method) ? this.state.method : C.def;
    const M = C.M;
    const B = {
      holdExpired: ['Your seat hold ended at 14:47', 'Payment is paused. Check your seats again: a new 15-minute hold starts only if they are still free.', 'warn'],
      thirdAttempt: ['3 of 3 payment attempts used', 'This booking stays Payment failed until the hold ends at 14:47. Then the seats are released and you can book again.', 'bad'],
      handoffFailed: ['We couldn’t open ' + C.gw + '’s secure page', 'Nothing was charged and your seats are still held. Try again' + (eg ? ', or choose cash at Fawry.' : '.'), 'bad']
    }[ps];
    const isFawry = cur === 'fawry';
    let payLabel = isFawry ? 'Get Fawry reference · ' + C.amount : 'Continue to secure page · ' + C.amount;
    let payHref = isFawry ? 'TrvFawryVoucher.dc.html' : 'TrvBooked.dc.html';
    if (ps === 'holdExpired') { payLabel = 'Check seats again'; payHref = 'TrvBookSeats.dc.html'; }
    if (ps === 'handoffFailed') { payLabel = 'Try again'; }
    const blocked = ps === 'thirdAttempt';
    if (blocked) payLabel = 'Payment unavailable for this hold';
    const secureNote = isFawry
      ? 'Your seats are held for the 48 hours the Fawry reference is valid. The booking shows “Cash payment pending” until you pay.'
      : 'You finish on ' + C.gw + '’s secure page. Trips Enjoy never sees your card number. Seats stay held for ' + C.hold + '.';
    const methods = M.map((m) => {
      const on = cur === m.id;
      return { ...m, checked: on ? 'true' : 'false', pick: () => this.setState({ method: m.id }),
        style: 'width: 100%; min-height: 60px; box-sizing: border-box; padding: 8px 14px; border-radius: 12px; background: #ffffff; display: flex; align-items: center; gap: 12px; font: inherit; color: #262a67; cursor: pointer; ' + (on ? 'border: 2px solid #fb8030;' : 'border: 1px solid #e3dfc9;'),
        ring: 'width: 22px; height: 22px; flex-shrink: 0; box-sizing: border-box; border-radius: 999px; border: 2px solid ' + (on ? '#262a67' : '#7b7fa6') + '; display: flex; align-items: center; justify-content: center',
        dot: 'width: 10px; height: 10px; border-radius: 999px; background: ' + (on ? '#262a67' : 'transparent'),
        logo: 'width: 48px; height: 30px; flex-shrink: 0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: ' + m.bg + '; color: ' + m.fg + ';' };
    });
    const tone = B ? (B[2] === 'warn' ? 'background: #fdf0d5; color: #8a4b00;' : 'background: #fde8e6; color: #b42318;') : '';
    return { methods, amount: C.amount, tripLine: C.tripLine, payer: C.payer, secureNote, payLabel, payHref,
      canPay: !blocked, blocked, hasBanner: !!B, bannerTitle: B ? B[0] : '', bannerText: B ? B[1] : '',
      bannerStyle: 'padding: 10px 12px; border-radius: 12px; display: flex; gap: 8px; font-size: 13px; line-height: 18px; ' + tone };
  }
}
</script>
</body>
</html>
