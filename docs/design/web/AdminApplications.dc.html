<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Applications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #262a67;outline-offset:2px}
.te-row:hover{background:#f6f3e4}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<dc-import name="AdminNav" active="Applications" hint-size="248px,900px"></dc-import>
<div style="flex-grow: 1; padding: 32px 40px; display: flex; flex-direction: column; gap: 20px; min-width: 0">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Applications</h1><span style="font-size: 14px; color: #5b5f86">14 waiting · oldest 2 days · target: decide within 2 working days</span></div>
<input aria-label="Search applications" placeholder="Search name, phone or CR number" style="width: 320px; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; font-family: inherit; font-size: 15px; color: #262a67">
</div>
<div role="tablist" style="display: flex; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
</div>
<div style="background: #ffffff; border-radius: 20px; overflow: hidden">
<div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 120px; padding: 12px 20px; font-size: 13px; font-weight: 600; color: #5b5f86; border-bottom: 1px solid #e3dfc9"><span>Applicant</span><span>Type</span><span>Country</span><span>Submitted</span><span>Checks</span><span></span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<a href="AdminAppReview.dc.html" class="te-row" style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 120px; align-items: center; padding: 14px 20px; border-bottom: 1px solid #e3dfc9; color: #262a67; text-decoration: none; font-size: 15px">
<span style="display: flex; align-items: center; gap: 12px; min-width: 0"><img src="{{r.img}}" alt="" style="{{r.imgSt}}"><span style="display: flex; flex-direction: column"><span style="font-weight: 600">{{r.n}}</span><span style="font-size: 13px; color: #5b5f86">{{r.sub}}</span></span></span>
<span>{{r.type}}</span><span>{{r.c}}</span><span>{{r.when}}</span>
<span style="{{r.chkStyle}}">{{r.chk}}</span>
<span style="font-size: 14px; font-weight: 600; color: #c93a00; text-align: end">Review</span>
</a>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { tab: 'All' }; }
renderVals() {
const R = [
{ n: 'Khalid Al-Harbi', sub: '+966 55 ••• 4821', type: 'Driver', c: 'Saudi Arabia', when: '2 days ago', chk: '1 issue', bad: true, img: '../assets/c311d0b40fa5c0d792261872e7c7b89d.svg' },
{ n: 'Sunrise Tours Co.', sub: 'CR 1010734512', type: 'Organization', c: 'Saudi Arabia', when: '1 day ago', chk: 'All passed', bad: false, img: '../assets/697a49af6be5a077ae1851c1a8b9dfcd.svg', org: true },
{ n: 'Noura Al-Shehri', sub: '8 portfolio photos', type: 'Photographer', c: 'Saudi Arabia', when: '1 day ago', chk: 'All passed', bad: false, img: '../assets/380d7985babc06d16544f4085cdec2d7.svg' },
{ n: 'Desert Events LLC', sub: 'CR 1122093310', type: 'Organization', c: 'UAE', when: '20 h ago', chk: 'VAT mismatch', bad: true, img: '../assets/472625e3fa0e959013f492568148458e.svg', org: true },
{ n: 'Omar Farouk', sub: '+20 10 ••• 2210', type: 'Driver', c: 'Egypt', when: '6 h ago', chk: 'All passed', bad: false, img: '../assets/c961e95bb720fceb6475e0c84bef99d2.svg' },
{ n: 'Lina Haddad', sub: '11 portfolio photos', type: 'Photographer', c: 'Jordan', when: '2 h ago', chk: 'All passed', bad: false, img: '../assets/0c8dd5946e0747703d008a98c24ab01b.svg' }
];
const tabs = [['All', 14], ['Driver', 6], ['Photographer', 4], ['Organization', 3], ['Changes requested', 1]];
const t = this.state.tab;
return {
tabs: tabs.map(([k, n]) => ({ label: k + ' · ' + n, sel: t === k ? 'true' : 'false', pick: () => this.setState({ tab: k }),
style: 'height: 40px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (t === k ? 'border: none; background: #262a67; color: #f6f3e4;' : 'border: 1px solid #7b7fa6; background: #ffffff; color: #262a67;') })),
rows: R.filter(r => t === 'All' || r.type === t || (t === 'Changes requested' && false)).map(r => ({ ...r, imgSt: 'width: 40px; height: 40px; flex-shrink: 0; object-fit: cover; ' + (r.org ? 'border-radius: 10px; border: 1px solid #e3dfc9;' : 'border-radius: 999px;'), chkStyle: 'justify-self: start; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; ' + (r.bad ? 'background: #fde8e6; color: #b42318;' : 'background: #e3f3ea; color: #1f7a4d;') }))
};
}
}
</script>
</body>
</html>
