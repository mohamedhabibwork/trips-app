<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver application</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="height: 72px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; background: #ffffff; border-bottom: 1px solid #e3dfc9">
<img src="../assets/1fbce194fcb16bf54904c32c189fca31.svg" alt="Trips Enjoy" style="height: 40px; width: auto">
<span style="font-size: 14px; color: #5b5f86">Saved as draft · <a href="#" style="font-weight: 600">Save and exit</a></span>
</div>
<div style="flex-grow: 1; display: flex; justify-content: center; padding: 40px 48px; gap: 48px">
<dc-import name="WebStepper" role="driver" active="{{two}}" hint-size="240px,300px"></dc-import>
<div style="width: 640px; background: #ffffff; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 1px 2px rgba(38,42,103,.06), 0 6px 20px rgba(38,42,103,.08)">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Personal details</h1>
<p style="margin: 0; font-size: 15px; color: #5b5f86">Our team checks these against your documents. Your name must match your ID exactly.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fn" style="font-size: 14px; font-weight: 600">Full name (as on ID)</label><input id="fn" dir="auto" value="Khalid Al-Harbi" style="height: 48px; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; font-family: inherit; font-size: 16px; color: #262a67"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="nid" style="font-size: 14px; font-weight: 600">National ID / Iqama number</label><input id="nid" value="" placeholder="10 digits" style="height: 48px; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; font-family: inherit; font-size: 16px; color: #262a67"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="dob" style="font-size: 14px; font-weight: 600">Date of birth</label><input id="dob" value="14 / 03 / 1990" style="height: 48px; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; font-family: inherit; font-size: 16px; color: #262a67"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="city" style="font-size: 14px; font-weight: 600">City you drive in</label><input id="city" value="Riyadh" style="height: 48px; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; font-family: inherit; font-size: 16px; color: #262a67"></div>
</div>
<dc-import name="PhoneField" label="Emergency contact number" value="" country="SA" helper="Used only if something happens on a trip." field-id="wa-emer" hint-size="100%,106px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600">ID photo (front and back)</span>
<button style="height: 80px; border-radius: 12px; border: 1px dashed #7b7fa6; background: #f6f3e4; color: #262a67; font-family: inherit; font-size: 15px; font-weight: 500">Drop files or <span style="color: #c93a00; font-weight: 600">browse</span> · JPG, PNG or PDF up to 10 MB</button>
</div>
<div style="display: flex; justify-content: space-between; margin-top: auto">
<a href="WebVerify.dc.html" style="height: 48px; padding: 0 24px; box-sizing: border-box; border-radius: 12px; border: 1px solid #7b7fa6; color: #262a67; font-size: 16px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Back</a>
<a href="WebDrvVehicle.dc.html" style="height: 48px; padding: 0 28px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Continue</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return { two: 2 }; }
}
</script>
</body>
</html>
