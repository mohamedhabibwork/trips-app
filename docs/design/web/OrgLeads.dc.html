<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Organization · Leads pipeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f6f3e4}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
.te-card:hover{border-color:#fb8030}
</style>
</helmet>
<div style="min-height: 1000px; display: flex; flex-wrap: wrap; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="flex: 1 1 248px; display: flex"><dc-import name="OrgNav" active="Leads" hint-size="248px,1000px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; color: #5b5f86">Group, school and corporate inquiries</span><h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Leads</h1></div>
<button type="button" style="height: 48px; padding: 0 20px; border-radius: 12px; border: 0; background: #ff6c2e; color: #262a67; font: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add lead</button>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="padding: 16px 20px; border-radius: 20px; background: #ffffff; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; color: #5b5f86">{{k.l}}</span>
<span style="font-size: 26px; line-height: 32px; font-weight: 700">{{k.v}} <span style="font-size: 15px; font-weight: 500; color: #5b5f86">{{k.u}}</span></span>
<span style="font-size: 13px; color: #5b5f86">{{k.d}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: end">
<label style="position: relative; display: flex; align-items: center; flex: 1 1 260px; max-width: 360px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search leads</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg><input type="search" placeholder="Organization or contact" style="height: 44px; width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #7b7fa6; background: #fff; padding: 0 14px 0 38px; font: inherit; font-size: 15px; color: #262a67"></label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">Owner<select style="height: 44px; border-radius: 8px; border: 1px solid #7b7fa6; background: #fff; padding: 0 10px; font: inherit; font-size: 15px; color: #262a67"><option>Everyone</option><option>Mona Saleh</option><option>Yousef Amin</option><option>Rana Fadel</option></select></label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">Type<select style="height: 44px; border-radius: 8px; border: 1px solid #7b7fa6; background: #fff; padding: 0 10px; font: inherit; font-size: 15px; color: #262a67"><option>All</option><option>School</option><option>Company</option><option>Event</option></select></label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">Source<select style="height: 44px; border-radius: 8px; border: 1px solid #7b7fa6; background: #fff; padding: 0 10px; font: inherit; font-size: 15px; color: #262a67"><option>All sources</option><option>Website form</option><option>Referral</option><option>Phone</option><option>Inbox</option></select></label>
</div>

<div style="overflow-x: auto; padding-bottom: 8px">
<div style="display: flex; gap: 12px; min-width: 1260px; align-items: flex-start">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="6">
<section aria-label="{{c.aria}}" style="flex: 1 0 200px; min-width: 0; background: #ece8d3; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 2px 4px 4px">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 6px"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700"><span style="{{c.dot}}"></span>{{c.n}}</span><span style="padding: 0 8px; border-radius: 999px; background: #ffffff; font-size: 12px; font-weight: 700; line-height: 20px">{{c.count}}</span></span>
<span style="font-size: 13px; color: #5b5f86; font-weight: 600">{{c.total}}</span>
</div>
<sc-for list="{{c.cards}}" as="l" hint-placeholder-count="2">
<a href="OrgLead.dc.html" class="te-card" style="{{l.cs}}">
<span style="display: flex; justify-content: space-between; gap: 6px; align-items: flex-start"><span style="font-size: 12px; font-weight: 700; letter-spacing: .4px; color: #5b5f86">{{l.type}}</span><span style="{{l.ts}}">{{l.tag}}</span></span>
<span style="font-size: 15px; font-weight: 600; line-height: 20px">{{l.org}}</span>
<span style="font-size: 13px; line-height: 18px; color: #5b5f86">{{l.what}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5b5f86"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM3 20a6 6 0 0 1 12 0M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14.5a6 6 0 0 1 3 5.5"></path></svg>{{l.pax}}</span>
<span style="display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid #e3dfc9"><span style="font-size: 15px; font-weight: 700">{{l.val}}</span><img src="{{l.av}}" alt="{{l.owner}}" title="{{l.owner}}" style="width: 26px; height: 26px; border-radius: 999px; object-fit: cover"></span>
<span style="font-size: 12px; color: #5b5f86">{{l.next}}</span>
</a>
</sc-for>
</section>
</sc-for>
</div>
</div>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = { ok: 'background: #e3f3ea; color: #1f7a4d;', warn: 'background: #fdf0d5; color: #8a4b00;', bad: 'background: #fde8e6; color: #b42318;', info: 'background: #e6e8f5; color: #262a67;', live: 'background: #ffe7dc; color: #c93a00;', amber: 'background: #f89e23; color: #262a67;' };
    const pill = (t) => 'padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; ' + tones[t];
    const card = (hot) => 'display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; background: #ffffff; color: #262a67; text-decoration: none; border: ' + (hot ? '2px solid #fb8030;' : '1px solid #e3dfc9;');
    const O = { MS: 'Mona Saleh', YA: 'Yousef Amin', RF: 'Rana Fadel' };
    const AV = { MS: '../assets/1da5f4a1d52001ce8dfc722d595c772b.svg', YA: '../assets/752b7ab031f2f70a93ff8107886b5b7e.svg', RF: '../assets/1e346ba84a1175ce8c93e484460e54ec.svg' };
    const mk = (type, org, what, pax, val, oi, next, tag, tt, hot) => ({ type, org, what, pax, val, oi, av: AV[oi], owner: 'Owner: ' + O[oi], next, tag, ts: tag ? pill(tt) : 'display: none', cs: card(hot) });
    const data = [
      ['New', '#7b7fa6', '67,800 SAR', [
        mk('COMPANY', 'Gulf Pharma Co.', 'Sales incentive weekend · AlUla · Jan', '40 staff', 'est. 48,000 SAR', 'MS', 'Website form · 2 h ago', 'New', 'live', false),
        mk('SCHOOL', 'Dar Al Bara School', 'Grade 9 day trip · Taif', '60 students + 6 teachers', 'est. 19,800 SAR', 'YA', 'Referral · yesterday', '', 'info', false)
      ]],
      ['Contacted', '#262a67', '182,500 SAR', [
        mk('EVENT', 'Riyadh Season corporate group', 'Boulevard + Diriyah evening tours · 3 nights', '220 guests', 'est. 154,000 SAR', 'MS', 'Call back Thu 16 Oct', 'Hot', 'amber', false),
        mk('CLUB', 'Riyadh Runners Club', 'Edge of the World sunrise hike', '95 members', 'est. 28,500 SAR', 'YA', 'Sent itinerary options', '', 'info', false)
      ]],
      ['Quote sent', '#f89e23', '127,300 SAR', [
        mk('SCHOOL', 'Al Noor International School', 'Grade 6 trip to Jeddah · Wed 12–Thu 13 Nov', '120 students + 12 teachers', 'est. 96,000 SAR', 'MS', 'Quote v2 opened today 08:14', 'Child tracking', 'ok', true),
        mk('COMPANY', 'Nakheel Engineering', 'Team offsite · Red Sea Snorkel Day', '45 staff', 'est. 31,300 SAR', 'RF', 'Quote expires Mon 20 Oct', '', 'info', false)
      ]],
      ['Negotiating', '#fb8030', '240,000 SAR', [
        mk('EVENT', 'Aramco Family Day', 'Family day out · Al Ahsa Oasis · 12 buses', '600 guests', 'est. 240,000 SAR', 'MS', 'Asked for 8% volume discount', 'Large', 'amber', false)
      ]],
      ['Won', '#1f7a4d', '61,280 SAR', [
        mk('SCHOOL', 'Al Noor International School', 'Grade 4 Zoo Day · today', '30 students + 2 teachers', '4,480 SAR', 'YA', 'Private trip running now', 'Won', 'ok', false),
        mk('COMPANY', 'Nakheel Engineering', 'Edge of the World Hike · June', '120 staff', '56,800 SAR', 'MS', 'B2B invoice paid · Net 30', 'Won', 'ok', false)
      ]],
      ['Lost', '#b42318', '36,000 SAR', [
        mk('COMPANY', 'Masar Tech', 'Family day · Jeddah Corniche', '150 guests', '36,000 SAR', 'RF', 'Chose another organizer · price', 'Lost', 'bad', false)
      ]]
    ];
    const cols = data.map(([n, color, total, cards]) => ({ n, aria: n + ' column, ' + cards.length + ' leads', count: String(cards.length), total: total + ' total', cards,
      dot: 'width: 10px; height: 10px; border-radius: 999px; background: ' + color }));
    const kpis = [
      { l: 'Open pipeline', v: '617,600', u: 'SAR', d: '7 open leads' },
      { l: 'Won this year', v: '61,280', u: 'SAR', d: '2 private trips · B2B invoiced' },
      { l: 'Win rate', v: '42%', u: '', d: 'Last 90 days' },
      { l: 'Avg time to quote', v: '1.6', u: 'days', d: 'Target: under 2 days' }
    ];
    return { cols, kpis };
  }
}
</script>
</body>
</html>
