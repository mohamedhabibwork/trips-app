<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Country field</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Cairo:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.te-cf-btn:focus-visible,.te-cf-opt:focus-visible,.te-cf-q:focus-visible{outline:2px solid #262a67;outline-offset:2px}
.te-cf-opt:hover{background:#f6f3e4}
</style>
</helmet>
<div dir="{{dir}}" style="{{rootStyle}}">
<span id="{{fieldId}}-l" style="font-size: 14px; line-height: 20px; font-weight: 600">{{label}}</span>
<div style="position: relative">
<button class="te-cf-btn" onClick="{{toggle}}" aria-haspopup="listbox" aria-expanded="{{openStr}}" aria-labelledby="{{fieldId}}-l" style="width: 100%; height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font-family: inherit; font-size: 16px; cursor: pointer">
<span style="position: relative; width: 26px; height: 18px; border-radius: 3px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(38,42,103,.15)">
<sc-for list="{{c.flag}}" as="f" hint-placeholder-count="3"><span style="{{f}}"></span></sc-for>
</span>
<span style="flex-grow: 1; text-align: start">{{c.nm}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; top: 58px; inset-inline-start: 0; z-index: 5; width: 100%; box-sizing: border-box; background: #ffffff; border-radius: 12px; border: 1px solid #e3dfc9; box-shadow: 0 8px 30px rgba(38,42,103,.16); padding: 8px; display: flex; flex-direction: column; gap: 6px">
<input class="te-cf-q" aria-label="Search countries" placeholder="{{searchPh}}" value="{{q}}" onChange="{{onQ}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #7b7fa6; font-family: inherit; font-size: 15px; color: #262a67">
<div role="listbox" style="max-height: 240px; overflow: auto; display: flex; flex-direction: column">
<sc-for list="{{list}}" as="o" hint-placeholder-count="6">
<button class="te-cf-opt" role="option" aria-selected="{{o.sel}}" onClick="{{o.pick}}" style="{{o.style}}">
<span style="position: relative; width: 26px; height: 18px; border-radius: 3px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(38,42,103,.15)">
<sc-for list="{{o.flag}}" as="f" hint-placeholder-count="3"><span style="{{f}}"></span></sc-for>
</span>
<span style="flex-grow: 1; text-align: start; font-size: 15px">{{o.nm}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>
</div>
<sc-if value="{{hasHelper}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #5b5f86">{{helper}}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Country"},"country":{"editor":"enum","options":["SA","AE","EG","KW","QA","BH","OM","JO"],"default":"SA"},"helper":{"editor":"text","default":""},"dir":{"editor":"enum","options":["ltr","rtl"],"default":"ltr"},"fieldId":{"editor":"text","default":"country"},"$preview":{"width":358,"height":82}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { open: false, iso: null, q: '' }; }
renderVals() {
const A = 'position: absolute; ';
const r = (l, t, w, h, c, extra) => A + 'left: ' + l + '%; top: ' + t + '%; width: ' + w + '%; height: ' + h + '%; background: ' + c + ';' + (extra || '');
const F = {
SA: [r(0, 0, 100, 100, '#006c35'), r(22, 28, 56, 16, '#ffffff', 'border-radius: 2px;'), r(22, 62, 56, 6, '#ffffff')],
AE: [r(0, 0, 100, 34, '#00732f'), r(0, 33, 100, 34, '#ffffff'), r(0, 66, 100, 34, '#111111'), r(0, 0, 27, 100, '#ff0000')],
EG: [r(0, 0, 100, 34, '#ce1126'), r(0, 33, 100, 34, '#ffffff'), r(0, 66, 100, 34, '#111111'), r(44, 40, 12, 20, '#c09300', 'border-radius: 2px;')],
KW: [r(0, 0, 100, 34, '#007a3d'), r(0, 33, 100, 34, '#ffffff'), r(0, 66, 100, 34, '#ce1126'), r(0, 0, 32, 100, '#111111', 'clip-path: polygon(0 0, 100% 33%, 100% 67%, 0 100%);')],
QA: [r(0, 0, 100, 100, '#8a1538'), r(0, 0, 34, 100, '#ffffff', 'clip-path: polygon(0 0, 70% 0, 100% 11%, 70% 22%, 100% 33%, 70% 44%, 100% 55%, 70% 66%, 100% 77%, 70% 88%, 100% 100%, 0 100%);')],
BH: [r(0, 0, 100, 100, '#ce1126'), r(0, 0, 34, 100, '#ffffff', 'clip-path: polygon(0 0, 70% 0, 100% 20%, 70% 40%, 100% 60%, 70% 80%, 100% 100%, 0 100%);')],
OM: [r(0, 0, 100, 100, '#db161b'), r(30, 0, 70, 34, '#ffffff'), r(30, 66, 70, 34, '#008000')],
JO: [r(0, 0, 100, 34, '#111111'), r(0, 33, 100, 34, '#ffffff'), r(0, 66, 100, 34, '#007a3d'), r(0, 0, 50, 100, '#ce1126', 'clip-path: polygon(0 0, 100% 50%, 0 100%);')]
};
const C = [['SA', 'Saudi Arabia', 'السعودية'], ['AE', 'United Arab Emirates', 'الإمارات'], ['EG', 'Egypt', 'مصر'], ['KW', 'Kuwait', 'الكويت'], ['QA', 'Qatar', 'قطر'], ['BH', 'Bahrain', 'البحرين'], ['OM', 'Oman', 'عُمان'], ['JO', 'Jordan', 'الأردن']];
const rtl = (this.props.dir ?? 'ltr') === 'rtl';
const iso = this.state.iso ?? this.props.country ?? 'SA';
const cur = C.find(x => x[0] === iso) || C[0];
const q = this.state.q.trim().toLowerCase();
const helper = this.props.helper ?? '';
return {
dir: rtl ? 'rtl' : 'ltr', label: this.props.label ?? 'Country', fieldId: this.props.fieldId ?? 'country',
rootStyle: 'display: flex; flex-direction: column; gap: 6px; color: #262a67; font-family: ' + (rtl ? "Cairo, 'Readex Pro', Tahoma, sans-serif" : 'Outfit, Nunito, system-ui, sans-serif') + ';',
c: { nm: rtl ? cur[2] : cur[1], flag: F[cur[0]] },
open: this.state.open, openStr: this.state.open ? 'true' : 'false', q: this.state.q, searchPh: rtl ? 'ابحث عن دولة' : 'Search country',
helper, hasHelper: !!helper,
toggle: () => this.setState({ open: !this.state.open, q: '' }),
onQ: (e) => this.setState({ q: e.target.value }),
list: C.filter(x => !q || x[1].toLowerCase().includes(q) || x[2].includes(q)).map(x => ({ nm: rtl ? x[2] : x[1], flag: F[x[0]], sel: x[0] === iso ? 'true' : 'false',
style: 'display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border: none; border-radius: 8px; color: #262a67; font-family: inherit; cursor: pointer; background: ' + (x[0] === iso ? '#f6f3e4' : '#ffffff') + ';',
pick: () => this.setState({ iso: x[0], open: false }) }))
};
}
}
</script>
</body>
</html>
