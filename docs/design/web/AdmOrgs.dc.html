<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Organizations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f6f3e4}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
.te-tr:hover{background:#fbf9f0}
</style>
</helmet>
<div style="min-height: 1000px; display: flex; flex-wrap: wrap; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="flex: 1 1 248px; display: flex"><dc-import name="AdmNav" active="Organizations" hint-size="248px,1000px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; color: #5b5f86">Tenants on business.trips-enjoy.com</span><h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Organizations</h1></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" style="height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>Export</button>
<a href="AdminApplications.dc.html" style="height: 48px; padding: 0 20px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; text-decoration: none">Review 3 company applications</a>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="5">
<div style="padding: 14px 18px; border-radius: 16px; background: #ffffff; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #5b5f86">{{k.l}}</span><span style="font-size: 24px; font-weight: 700">{{k.v}}</span><span style="font-size: 13px; color: #5b5f86">{{k.d}}</span></div>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
<div style="flex: 2 1 260px; position: relative"><label for="o-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search organizations</label><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 14px; top: 15px"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg><input id="o-q" type="search" placeholder="Search by name, CR number or owner" style="width: 100%; box-sizing: border-box; height: 48px; border-radius: 8px; border: 1px solid #7b7fa6; background: #fff; padding: 0 14px 0 40px; font: inherit; font-size: 16px; color: #262a67"></div>
<div role="group" aria-label="Status" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button type="button" onClick="{{c.on}}" aria-pressed="{{c.pr}}" style="{{c.st}}">{{c.t}}</button></sc-for>
</div>
<label for="o-plan" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Plan</label><select id="o-plan" style="height: 48px; border-radius: 8px; border: 1px solid #7b7fa6; background: #fff; padding: 0 12px; font: inherit; font-size: 15px; color: #262a67"><option>All plans</option><option>Starter</option><option>Growth</option><option>Enterprise</option></select>
</div>

<section aria-label="Organizations" style="background: #ffffff; border-radius: 20px; padding: 8px 0">
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 1080px; border-collapse: collapse; font-size: 15px">
<thead><tr style="color: #5b5f86; font-size: 13px"><th scope="col" style="text-align: start; padding: 10px 20px; font-weight: 600">Organization</th><th scope="col" style="text-align: start; padding: 10px 12px; font-weight: 600">CR</th><th scope="col" style="text-align: start; padding: 10px 12px; font-weight: 600">Country</th><th scope="col" style="text-align: start; padding: 10px 12px; font-weight: 600">Plan</th><th scope="col" style="text-align: start; padding: 10px 12px; font-weight: 600">Active trips</th><th scope="col" style="text-align: end; padding: 10px 12px; font-weight: 600">Employees</th><th scope="col" style="text-align: end; padding: 10px 12px; font-weight: 600">GMV (Oct)</th><th scope="col" style="text-align: start; padding: 10px 12px; font-weight: 600">Status</th><th scope="col" style="text-align: start; padding: 10px 20px; font-weight: 600">Approved</th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<tr class="te-tr" style="border-top: 1px solid #e3dfc9">
<td style="padding: 11px 20px"><a href="AdmOrg.dc.html" style="display: flex; align-items: center; gap: 12px; color: #262a67; text-decoration: none"><sc-if value="{{r.hasLogo}}" hint-placeholder-val="{{true}}"><img src="{{r.logo}}" alt="" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; object-fit: cover; border: 1px solid #e3dfc9"></sc-if><sc-if value="{{r.noLogo}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; background: #262a67; color: #f6f3e4; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.ini}}</span></sc-if><span style="display: flex; flex-direction: column"><span style="font-weight: 600">{{r.n}}</span><span style="font-size: 13px; color: #5b5f86">{{r.o}}</span></span></a></td>
<td style="padding: 11px 12px; font-variant-numeric: tabular-nums; color: #5b5f86">{{r.cr}}</td>
<td style="padding: 11px 12px">{{r.c}}</td>
<td style="padding: 11px 12px">{{r.p}}</td>
<td style="padding: 11px 12px; min-width: 120px"><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px">{{r.tr}}</span><span style="height: 6px; border-radius: 999px; background: #f6f3e4; overflow: hidden"><span style="{{r.bar}}"></span></span></span></td>
<td style="padding: 11px 12px; text-align: end">{{r.e}}</td>
<td style="padding: 11px 12px; text-align: end; font-variant-numeric: tabular-nums">{{r.g}}</td>
<td style="padding: 11px 12px"><span style="{{r.ss}}">{{r.s}}</span></td>
<td style="padding: 11px 20px; color: #5b5f86; white-space: nowrap">{{r.a}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 8px; border-top: 1px solid #e3dfc9; font-size: 14px; color: #5b5f86"><span>Showing 1–10 of 312</span><a href="#" style="font-weight: 600">Next page</a></div>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { chip: 'All 312' }; }
  renderVals() {
    const pill = (tone) => 'display: inline-flex; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; ' + ({ ok: 'background: #e3f3ea; color: #1f7a4d;', warn: 'background: #fdf0d5; color: #8a4b00;', bad: 'background: #fde8e6; color: #b42318;', info: 'background: #e6e8f5; color: #262a67;', live: 'background: #ffe7dc; color: #c93a00;' })[tone];
    const kpis = [
      { l: 'Organizations', v: '312', d: '+11 this month' },
      { l: 'On Enterprise', v: '38', d: '4 gifted by admin' },
      { l: 'On Growth', v: '164', d: '12 at trip limit' },
      { l: 'In trial', v: '15', d: '6 end this week' },
      { l: 'Org GMV (Oct)', v: '15.9M SAR', d: '85% of platform GMV' }
    ];
    const tone = { Active: 'ok', Trial: 'info', 'Grace period': 'warn', Suspended: 'bad' };
    const data = [
      ['Sunrise Tours Co.', 'Mona Saleh', '1010734512', 'Saudi Arabia', 'Growth', 18, 20, '14', '412,600 SAR', 'Active', '10 Nov 2024'],
      ['Rawabi Travel', 'Abdullah Rawabi', '1010552190', 'Saudi Arabia', 'Growth', 20, 20, '17', '388,200 SAR', 'Active', '02 Feb 2025'],
      ['Al Noor International School', 'Huda Kamal', '1010998431', 'Saudi Arabia', 'Growth', 6, 20, '9', '64,800 SAR', 'Active', '19 Aug 2025'],
      ['Najd Adventures', 'Fahad Al-Dosari', '1010661208', 'Saudi Arabia', 'Starter', 5, 5, '4', '41,250 SAR', 'Grace period', '07 Apr 2025'],
      ['Gulf Horizon Trips', 'Mariam Al-Nuaimi', 'CN-4120983', 'United Arab Emirates', 'Enterprise', 46, 0, '58', '1,204,000 SAR', 'Active', '15 Dec 2024'],
      ['Nile Wanderers', 'Karim Mansour', '98213 Cairo', 'Egypt', 'Growth', 11, 20, '12', '96,300 SAR', 'Active', '28 May 2025'],
      ['Hejaz Heritage Tours', 'Saud Al-Ghamdi', '4030218877', 'Saudi Arabia', 'Growth', 3, 20, '6', '18,900 SAR', 'Trial', '06 Oct 2026'],
      ['Desert Pearl Events', 'Nouf Al-Mutairi', '1010420066', 'Saudi Arabia', 'Starter', 0, 5, '3', '0 SAR', 'Suspended', '11 Jan 2025'],
      ['Jeddah Sea Club', 'Yasser Bamatraf', '4030771543', 'Saudi Arabia', 'Growth', 9, 20, '14', '152,700 SAR', 'Active', '23 Mar 2025'],
      ['Emirates Family Outings', 'Aisha Al-Shamsi', 'CN-3998120', 'United Arab Emirates', 'Starter', 2, 5, '2', '12,400 SAR', 'Trial', '01 Oct 2026']
    ];
    const LOGOS = { 'Nile Wanderers': '../assets/0f93d48237cb75064eb826b9351e4d0f.svg', 'Jeddah Sea Club': '../assets/208fe698e35b926d65dfaf092b0de68a.svg', 'Emirates Family Outings': '../assets/b72539cbc54a907a08b52c7e75c9d8f6.svg', 'Sunrise Tours Co.': '../assets/697a49af6be5a077ae1851c1a8b9dfcd.svg', 'Rawabi Travel': '../assets/85f14457e398d1218ed034afdc47c8ce.svg', 'Al Noor International School': '../assets/f622ae191805b644d9e8f7a2610bfe1b.svg', 'Najd Adventures': '../assets/1134174426625e453cca9ca4339809ce.svg', 'Gulf Horizon Trips': '../assets/18eebe3df66e30d05047134639c55cc1.svg', 'Hejaz Heritage Tours': '../assets/604626c00c7762fd3f4718f28e2a3ed2.svg', 'Desert Pearl Events': '../assets/472625e3fa0e959013f492568148458e.svg' };
    const rows = data.map((d) => { const lim = d[6]; const pct = lim ? Math.min(100, Math.round(d[5] / lim * 100)) : 30;
      const logo = LOGOS[d[0]] || '';
      return { n: d[0], hasLogo: !!logo, noLogo: !logo, logo, ini: d[0].split(' ').slice(0, 2).map((w) => w[0]).join(''), o: 'Owner ' + d[1], cr: d[2], c: d[3], p: d[4], tr: lim ? d[5] + ' / ' + lim : d[5] + ' · unlimited', bar: 'display: block; height: 100%; width: ' + pct + '%; border-radius: 999px; background: ' + (pct >= 100 ? '#f89e23' : '#262a67') + ';', e: d[7], g: d[8], s: d[9], ss: pill(tone[d[9]]), a: d[10] }; });
    const names = ['All 312', 'Active 281', 'Trial 15', 'Grace period 9', 'Suspended 7'];
    const chips = names.map((t) => { const on = this.state.chip === t; return { t, pr: on ? 'true' : 'false', on: () => this.setState({ chip: t }),
      st: 'height: 40px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #262a67; color: #f6f3e4; border: 1px solid #262a67;' : 'background: #ffffff; color: #262a67; border: 1px solid #7b7fa6;') }; });
    return { kpis, rows, chips };
  }
}
</script>
</body>
</html>
