<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>SCR-SHR-10 Language switch and RTL</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:var(--primary-text)}</style>
</helmet>
<div dir="rtl" style="--surface:#f6f3e4;--surface-raised:#ffffff;--surface-inverse:#262a67;--ink:#262a67;--ink-muted:#5b5f86;--ink-inverse:#f6f3e4;--hairline:#e3dfc9;--primary:#ff6c2e;--on-primary:#262a67;--primary-text:#c93a00;--accent:#fb8030;--highlight:#f89e23;--focus-ring:#262a67;--control-border:#7b7fa6;--danger:#b42318;--danger-soft:#fde8e6;--success:#1f7a4d;--success-soft:#e3f3ea;--warning:#8a4b00;--warning-soft:#fff1d6;--info-soft:#e6e8f5;--glass-dim:rgba(16,18,48,.35);--card-shadow:0 1px 2px rgba(38,42,103,.06),0 6px 20px rgba(38,42,103,.08);--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--surface);color:var(--ink);font-family:Cairo,'Readex Pro',Tahoma,sans-serif;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--surface-raised);border-bottom:1px solid var(--hairline)">
    <div style="font-size:20px;font-weight:700;font-family:Outfit,system-ui,sans-serif">Trips <span style="color:var(--primary-text)">Enjoy</span></div>
    <span style="font-size:13px;font-weight:600;color:var(--ink-muted)">تريبس إنجوي</span>
  </header>
  <main style="flex:1;display:flex;flex-direction:column;gap:16px;padding:20px 16px;box-sizing:border-box">
    <h1 style="margin:0;font-size:24px;line-height:36px;font-weight:700">اللغة والاتجاه</h1>
    <div role="radiogroup" aria-label="اللغة" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:var(--radius-md);background:var(--hairline)">
      <span role="radio" aria-checked="false" style="text-align:center;padding:10px 0;border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:var(--ink-muted);font-family:Outfit,system-ui,sans-serif;direction:ltr">English</span>
      <span role="radio" aria-checked="true" style="text-align:center;padding:10px 0;border-radius:var(--radius-sm);background:var(--surface-raised);font-size:14px;font-weight:600">العربية</span>
    </div>
    <p style="margin:0;font-size:15px;line-height:28px;color:var(--ink-muted)">تبقى بياناتك المكتوبة وخطوتك الحالية عند تبديل اللغة.</p>
    <label style="display:flex;flex-direction:column;font-size:14px;font-weight:600">الاسم الكامل<input type="text" dir="auto" style="box-sizing:border-box;height:48px;margin-top:6px;padding:0 14px;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:16px;font-weight:500"></label>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:var(--radius-md);background:var(--surface-raised);box-shadow:var(--card-shadow)">
      <span style="font-size:15px;font-weight:500">السعر</span>
      <span style="font-size:16px;font-weight:700;direction:ltr">[PRICE] [CURRENCY]</span>
    </div>
    <p style="margin:0;font-size:13px;line-height:20px;color:var(--ink-muted)">التواريخ والأرقام تتبع تنسيق اللغة المختارة.</p>
    <button type="button" style="margin-top:auto;min-height:48px;padding:12px 24px;border:0;border-radius:var(--radius-md);background:var(--primary);color:var(--on-primary);font:inherit;font-size:16px;font-weight:600;cursor:pointer">متابعة</button>
  </main>
</div>
</x-dc>

</body>
</html>
