<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCR-SHR-11 Notification centre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:var(--primary-text)}</style>
</helmet>
<div style="--surface:#f6f3e4;--surface-raised:#ffffff;--surface-inverse:#262a67;--ink:#262a67;--ink-muted:#5b5f86;--ink-inverse:#f6f3e4;--hairline:#e3dfc9;--primary:#ff6c2e;--on-primary:#262a67;--primary-text:#c93a00;--accent:#fb8030;--highlight:#f89e23;--focus-ring:#262a67;--control-border:#7b7fa6;--danger:#b42318;--danger-soft:#fde8e6;--success:#1f7a4d;--success-soft:#e3f3ea;--warning:#8a4b00;--warning-soft:#fff1d6;--info-soft:#e6e8f5;--glass-dim:rgba(16,18,48,.35);--card-shadow:0 1px 2px rgba(38,42,103,.06),0 6px 20px rgba(38,42,103,.08);--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--surface);color:var(--ink);font-family:Outfit,Nunito,system-ui,sans-serif;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--surface-raised);border-bottom:1px solid var(--hairline)">
    <div style="font-size:20px;font-weight:700">Notifications</div>
    <a href="#" style="font-size:14px;font-weight:600;color:var(--ink)">Preferences</a>
  </header>
  <main style="flex:1;display:flex;flex-direction:column;padding:8px 0;box-sizing:border-box">
    <article style="display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-bottom:1px solid var(--hairline)">
      <div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:500;color:var(--ink-muted)"><span>Trip update</span><span>[TIME]</span></div>
      <h2 style="margin:0;font-size:16px;line-height:24px;font-weight:600">[Trip name] boarding has started</h2>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px">
        <span style="display:inline-flex;align-items:center;gap:4px;color:var(--success);font-weight:600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Sent by app</span>
        <a href="#" style="font-weight:600">Open trip</a>
      </div>
    </article>
    <article style="display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-bottom:1px solid var(--hairline);background:var(--info-soft)">
      <div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:500;color:var(--ink-muted)"><span>Payment</span><span>[TIME]</span></div>
      <h2 style="margin:0;font-size:16px;line-height:24px;font-weight:600">Your payment for [Trip name] is confirmed</h2>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px">
        <span style="display:inline-flex;align-items:center;gap:4px;color:var(--success);font-weight:600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Sent by email</span>
        <a href="#" style="font-weight:600">Mark read</a>
      </div>
    </article>
    <article style="display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-bottom:1px solid var(--hairline)">
      <div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:500;color:var(--ink-muted)"><span>Account</span><span>[TIME]</span></div>
      <h2 style="margin:0;font-size:16px;line-height:24px;font-weight:600">Verify your phone number</h2>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px">
        <span style="display:inline-flex;align-items:center;gap:4px;color:var(--warning);font-weight:600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>SMS failed, retry scheduled</span>
        <a href="#" style="font-weight:600">Open</a>
      </div>
    </article>
    <div style="padding:16px">
      <button type="button" style="width:100%;min-height:48px;padding:12px 24px;border:0;border-radius:var(--radius-md);background:var(--primary);color:var(--on-primary);font:inherit;font-size:16px;font-weight:600;cursor:pointer">Mark all as read</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
