<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCR-PUB-05 Photographer sign-up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:var(--primary-text)}</style>
</helmet>
<div style="--surface:#f6f3e4;--surface-raised:#ffffff;--surface-inverse:#262a67;--ink:#262a67;--ink-muted:#5b5f86;--ink-inverse:#f6f3e4;--hairline:#e3dfc9;--primary:#ff6c2e;--on-primary:#262a67;--primary-text:#c93a00;--accent:#fb8030;--highlight:#f89e23;--focus-ring:#262a67;--control-border:#7b7fa6;--danger:#b42318;--danger-soft:#fde8e6;--success:#1f7a4d;--success-soft:#e3f3ea;--warning:#8a4b00;--warning-soft:#fff1d6;--info-soft:#e6e8f5;--glass-dim:rgba(16,18,48,.35);--card-shadow:0 1px 2px rgba(38,42,103,.06),0 6px 20px rgba(38,42,103,.08);--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;width:1280px;height:900px;box-sizing:border-box;overflow:hidden;background:var(--surface);color:var(--ink);font-family:Outfit,Nunito,system-ui,sans-serif;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:20px 48px;background:var(--surface-raised);border-bottom:1px solid var(--hairline)">
    <div style="font-size:24px;font-weight:700">Trips <span style="color:var(--primary-text)">Enjoy</span></div>
    <a href="SCR-PUB-02.dc.html" style="font-size:14px;font-weight:600;color:var(--ink)">Back to role choice</a>
  </header>
  <main style="flex:1;display:flex;flex-direction:column;gap:24px;padding:40px 48px;box-sizing:border-box">
    <section style="display:flex;flex-direction:column;gap:6px">
      <h1 style="margin:0;font-size:40px;line-height:48px;font-weight:700">Apply as a photographer</h1>
      <p style="margin:0;font-size:16px;line-height:24px;color:var(--ink-muted)">Show your work with a portfolio of at least 8 photos. Access starts after approval.</p>
    </section>
    <section style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:start">
      <div style="background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--card-shadow);padding:28px;display:flex;flex-direction:column;gap:18px">
        <h2 style="margin:0;font-size:20px;line-height:28px;font-weight:600">Your details</h2>
        <label style="display:flex;flex-direction:column;font-size:14px;font-weight:600">Name or studio name<input type="text" placeholder="[STUDIO OR FULL NAME]" style="box-sizing:border-box;height:48px;margin-top:6px;padding:0 14px;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:16px;font-weight:400"></label>
        <label style="display:flex;flex-direction:column;font-size:14px;font-weight:600">Email<input type="email" placeholder="name@example.com" style="box-sizing:border-box;height:48px;margin-top:6px;padding:0 14px;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:16px;font-weight:400"></label>
        <label style="display:flex;flex-direction:column;font-size:14px;font-weight:600">Phone<input type="tel" placeholder="+[COUNTRY CODE] [NUMBER]" style="box-sizing:border-box;height:48px;margin-top:6px;padding:0 14px;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:16px;font-weight:400"></label>
        <label style="display:flex;flex-direction:column;font-size:14px;font-weight:600">Country<select style="box-sizing:border-box;height:48px;margin-top:6px;padding:0 14px;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:16px;font-weight:400"><option>Select country</option></select></label>
      </div>
      <div style="background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--card-shadow);padding:28px;display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:16px">
          <h2 style="margin:0;font-size:20px;line-height:28px;font-weight:600">Portfolio</h2>
          <span style="font-size:14px;font-weight:600">[N] of 8 photos</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
          <div style="aspect-ratio:1;border-radius:var(--radius-sm);background:var(--hairline);display:flex;align-items:flex-end;padding:6px;font-size:12px;color:var(--ink-muted)">Photo</div>
          <div style="aspect-ratio:1;border-radius:var(--radius-sm);background:var(--hairline);display:flex;align-items:flex-end;padding:6px;font-size:12px;color:var(--ink-muted)">Photo</div>
          <div style="aspect-ratio:1;border-radius:var(--radius-sm);background:var(--hairline);display:flex;align-items:flex-end;padding:6px;font-size:12px;color:var(--ink-muted)">Photo</div>
          <div style="aspect-ratio:1;border:2px dashed var(--control-border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink)">Add photos</div>
        </div>
        <div style="display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius-md);background:var(--warning-soft);color:var(--warning);font-size:14px;line-height:20px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>
          <span>Add at least 8 photos to submit. You have [N] of 8.</span>
        </div>
        <button type="button" style="min-height:48px;padding:12px 28px;border:0;border-radius:var(--radius-md);background:var(--primary);color:var(--on-primary);font:inherit;font-size:16px;font-weight:600;cursor:pointer">Submit application</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
