<!doctype html>

<div style="--surface:#f6f3e4;--surface-raised:#ffffff;--surface-inverse:#262a67;--ink:#262a67;--ink-muted:#5b5f86;--ink-inverse:#f6f3e4;--hairline:#e3dfc9;--primary:#ff6c2e;--on-primary:#262a67;--primary-text:#c93a00;--accent:#fb8030;--highlight:#f89e23;--focus-ring:#262a67;--control-border:#7b7fa6;--danger:#b42318;--danger-soft:#fde8e6;--success:#1f7a4d;--success-soft:#e3f3ea;--warning:#8a4b00;--warning-soft:#fff1d6;--info-soft:#e6e8f5;--glass-dim:rgba(16,18,48,.35);--card-shadow:0 1px 2px rgba(38,42,103,.06),0 6px 20px rgba(38,42,103,.08);--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;width:1280px;height:900px;box-sizing:border-box;overflow:hidden;background:var(--surface);color:var(--ink);font-family:Outfit,Nunito,system-ui,sans-serif;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;padding:20px 48px;background:var(--surface-raised);border-bottom:1px solid var(--hairline)">
    <div style="font-size:24px;font-weight:700">Trips <span style="color:var(--primary-text)">Enjoy</span></div>
  </header>
  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:48px">
    <section style="width:520px;background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--card-shadow);padding:36px;display:flex;flex-direction:column;gap:20px">
      <span style="align-self:flex-start;font-size:13px;font-weight:600;color:var(--ink-muted)">Step 1 of 2: email</span>
      <h1 style="margin:0;font-size:32px;line-height:40px;font-weight:700">Enter the code</h1>
      <p style="margin:0;font-size:16px;line-height:24px;color:var(--ink-muted)">We sent a 6-digit code to <span style="color:var(--ink);font-weight:600">[MASKED EMAIL]</span>. The code expires in 5 minutes.</p>
      <div role="group" aria-label="Verification code" style="display:flex;gap:10px;justify-content:space-between">
        <input inputmode="numeric" maxlength="1" aria-label="Digit 1" style="width:56px;height:64px;box-sizing:border-box;text-align:center;font:inherit;font-size:24px;font-weight:600;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink)">
        <input inputmode="numeric" maxlength="1" aria-label="Digit 2" style="width:56px;height:64px;box-sizing:border-box;text-align:center;font:inherit;font-size:24px;font-weight:600;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink)">
        <input inputmode="numeric" maxlength="1" aria-label="Digit 3" style="width:56px;height:64px;box-sizing:border-box;text-align:center;font:inherit;font-size:24px;font-weight:600;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink)">
        <input inputmode="numeric" maxlength="1" aria-label="Digit 4" style="width:56px;height:64px;box-sizing:border-box;text-align:center;font:inherit;font-size:24px;font-weight:600;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink)">
        <input inputmode="numeric" maxlength="1" aria-label="Digit 5" style="width:56px;height:64px;box-sizing:border-box;text-align:center;font:inherit;font-size:24px;font-weight:600;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink)">
        <input inputmode="numeric" maxlength="1" aria-label="Digit 6" style="width:56px;height:64px;box-sizing:border-box;text-align:center;font:inherit;font-size:24px;font-weight:600;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink)">
      </div>
      <p style="margin:0;font-size:14px;line-height:20px;color:var(--ink-muted)">You can resend a code in [SECONDS] seconds.</p>
      <button type="button" style="min-height:48px;padding:12px 28px;border:0;border-radius:var(--radius-md);background:var(--primary);color:var(--on-primary);font:inherit;font-size:16px;font-weight:600;cursor:pointer">Verify</button>
      <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:600">
        <a href="#" style="color:var(--ink)">Resend code</a>
        <a href="#" style="color:var(--ink)">Change email</a>
      </div>
    </section>
  </main>
</div>
