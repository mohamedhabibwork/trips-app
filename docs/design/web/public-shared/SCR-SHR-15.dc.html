<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCR-SHR-15 Seat map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:var(--primary-text)}</style>
</helmet>
<div style="--surface:#f6f3e4;--surface-raised:#ffffff;--surface-inverse:#262a67;--ink:#262a67;--ink-muted:#5b5f86;--ink-inverse:#f6f3e4;--hairline:#e3dfc9;--primary:#ff6c2e;--on-primary:#262a67;--primary-text:#c93a00;--accent:#fb8030;--highlight:#f89e23;--focus-ring:#262a67;--control-border:#7b7fa6;--danger:#b42318;--danger-soft:#fde8e6;--success:#1f7a4d;--success-soft:#e3f3ea;--warning:#8a4b00;--warning-soft:#fff1d6;--info-soft:#e6e8f5;--glass-dim:rgba(16,18,48,.35);--card-shadow:0 1px 2px rgba(38,42,103,.06),0 6px 20px rgba(38,42,103,.08);--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--surface);color:var(--ink);font-family:Outfit,Nunito,system-ui,sans-serif;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;padding:16px;background:var(--surface-raised);border-bottom:1px solid var(--hairline)">
    <a href="#" style="font-size:14px;font-weight:600;color:var(--ink)">Back</a>
    <div style="flex:1;text-align:center;font-size:18px;font-weight:700">Choose your seat</div>
    <span style="width:40px"></span>
  </header>
  <main style="flex:1;display:flex;flex-direction:column;gap:14px;padding:16px;box-sizing:border-box">
    <p style="margin:0;font-size:14px;line-height:20px;color:var(--ink-muted)">[Trip name] · Vehicle [VEHICLE NUMBER]. Seats update live.</p>
    <ul aria-label="Seat states" style="margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:12px;line-height:16px">
      <li style="display:flex;gap:6px;align-items:center"><span style="width:14px;height:14px;border-radius:4px;border:1.5px solid var(--control-border)"></span>Available</li>
      <li style="display:flex;gap:6px;align-items:center"><span style="width:14px;height:14px;border-radius:4px;background:var(--primary)"></span>Selected</li>
      <li style="display:flex;gap:6px;align-items:center"><span style="width:14px;height:14px;border-radius:4px;background:var(--warning-soft);border:1px solid var(--warning)"></span>Held, timed</li>
      <li style="display:flex;gap:6px;align-items:center"><span style="width:14px;height:14px;border-radius:4px;background:var(--hairline)"></span>Taken</li>
    </ul>
    <div style="background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--card-shadow);padding:16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:center"><span style="font-size:12px;font-weight:600;color:var(--ink-muted)">Front</span></div>
      <div style="display:flex;gap:8px;justify-content:center;align-items:center">
        <button type="button" aria-label="Seat 1A, available" style="width:56px;height:48px;border-radius:var(--radius-sm);border:1.5px solid var(--control-border);background:var(--surface-raised);font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer">1A</button>
        <button type="button" aria-label="Seat 1B, taken" style="width:56px;height:48px;border-radius:var(--radius-sm);border:0;background:var(--hairline);font:inherit;font-size:14px;font-weight:600;color:var(--ink-muted)">1B</button>
        <span style="width:24px"></span>
        <button type="button" aria-label="Seat 1C, held for 4 minutes" style="width:56px;height:48px;border-radius:var(--radius-sm);border:1px solid var(--warning);background:var(--warning-soft);font:inherit;font-size:14px;font-weight:600;color:var(--warning);cursor:pointer">1C</button>
        <button type="button" aria-label="Seat 1D, available" style="width:56px;height:48px;border-radius:var(--radius-sm);border:1.5px solid var(--control-border);background:var(--surface-raised);font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer">1D</button>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;align-items:center">
        <button type="button" aria-label="Seat 2A, available" style="width:56px;height:48px;border-radius:var(--radius-sm);border:1.5px solid var(--control-border);background:var(--surface-raised);font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer">2A</button>
        <button type="button" aria-label="Seat 2B, selected" aria-pressed="true" style="width:56px;height:48px;border-radius:var(--radius-sm);border:0;background:var(--primary);font:inherit;font-size:14px;font-weight:700;color:var(--on-primary);cursor:pointer">2B</button>
        <span style="width:24px"></span>
        <button type="button" aria-label="Seat 2C, taken" style="width:56px;height:48px;border-radius:var(--radius-sm);border:0;background:var(--hairline);font:inherit;font-size:14px;font-weight:600;color:var(--ink-muted)">2C</button>
        <button type="button" aria-label="Seat 2D, available" style="width:56px;height:48px;border-radius:var(--radius-sm);border:1.5px solid var(--control-border);background:var(--surface-raised);font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer">2D</button>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;align-items:center">
        <button type="button" aria-label="Seat 3A, available" style="width:56px;height:48px;border-radius:var(--radius-sm);border:1.5px solid var(--control-border);background:var(--surface-raised);font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer">3A</button>
        <button type="button" aria-label="Seat 3B, available" style="width:56px;height:48px;border-radius:var(--radius-sm);border:1.5px solid var(--control-border);background:var(--surface-raised);font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer">3B</button>
        <span style="width:24px"></span>
        <button type="button" aria-label="Seat 3C, taken" style="width:56px;height:48px;border-radius:var(--radius-sm);border:0;background:var(--hairline);font:inherit;font-size:14px;font-weight:600;color:var(--ink-muted)">3C</button>
        <button type="button" aria-label="Seat 3D, available" style="width:56px;height:48px;border-radius:var(--radius-sm);border:1.5px solid var(--control-border);background:var(--surface-raised);font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer">3D</button>
      </div>
    </div>
    <p style="margin:0;font-size:13px;line-height:18px;color:var(--ink-muted)">Seat 2B is held for [HOLD TIME]. Choose another seat if the hold expires.</p>
    <button type="button" style="margin-top:auto;min-height:48px;padding:12px 24px;border:0;border-radius:var(--radius-md);background:var(--primary);color:var(--on-primary);font:inherit;font-size:16px;font-weight:600;cursor:pointer">Confirm seat 2B</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
