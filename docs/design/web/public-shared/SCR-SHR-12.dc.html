<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCR-SHR-12 Receipt and invoice view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:var(--primary-text)}</style>
</helmet>
<div style="--surface:#f6f3e4;--surface-raised:#ffffff;--surface-inverse:#262a67;--ink:#262a67;--ink-muted:#5b5f86;--ink-inverse:#f6f3e4;--hairline:#e3dfc9;--primary:#ff6c2e;--on-primary:#262a67;--primary-text:#c93a00;--accent:#fb8030;--highlight:#f89e23;--focus-ring:#262a67;--control-border:#7b7fa6;--danger:#b42318;--danger-soft:#fde8e6;--success:#1f7a4d;--success-soft:#e3f3ea;--warning:#8a4b00;--warning-soft:#fff1d6;--info-soft:#e6e8f5;--glass-dim:rgba(16,18,48,.35);--card-shadow:0 1px 2px rgba(38,42,103,.06),0 6px 20px rgba(38,42,103,.08);--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--surface);color:var(--ink);font-family:Outfit,Nunito,system-ui,sans-serif;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--surface-raised);border-bottom:1px solid var(--hairline)">
    <a href="#" style="font-size:14px;font-weight:600;color:var(--ink)">Back</a>
    <div style="font-size:18px;font-weight:700">Receipt</div>
    <span style="width:40px"></span>
  </header>
  <main style="flex:1;display:flex;flex-direction:column;gap:14px;padding:16px;box-sizing:border-box">
    <section style="background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--card-shadow);padding:18px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span style="font-size:13px;font-weight:600;color:var(--ink-muted)">[INVOICE NUMBER]</span>
        <span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--success-soft);color:var(--success);font-size:13px;font-weight:600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Issued</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;font-size:14px">
        <span style="color:var(--ink-muted)">Date</span><span style="font-weight:600">[ISSUE DATE]</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;font-size:14px">
        <span style="color:var(--ink-muted)">Billed to</span><span style="font-weight:600">[BUYER NAME]</span>
      </div>
    </section>
    <section style="background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--card-shadow);padding:18px;display:flex;flex-direction:column;gap:10px;font-size:14px">
      <div style="display:flex;justify-content:space-between;gap:8px;font-weight:600;color:var(--ink-muted);font-size:13px"><span>Item</span><span>Amount</span></div>
      <div style="display:flex;justify-content:space-between;gap:8px"><span>[Item description] × [QTY]</span><span style="font-weight:600">[AMOUNT]</span></div>
      <div style="display:flex;justify-content:space-between;gap:8px"><span>[Item description] × [QTY]</span><span style="font-weight:600">[AMOUNT]</span></div>
      <div style="height:1px;background:var(--hairline);margin:4px 0"></div>
      <div style="display:flex;justify-content:space-between;gap:8px"><span>Subtotal</span><span>[SUBTOTAL]</span></div>
      <div style="display:flex;justify-content:space-between;gap:8px"><span>Tax [TAX RATE]</span><span>[TAX AMOUNT]</span></div>
      <div style="display:flex;justify-content:space-between;gap:8px;font-size:17px;font-weight:700;margin-top:4px"><span>Total</span><span>[TOTAL] [CURRENCY]</span></div>
    </section>
    <button type="button" style="margin-top:auto;min-height:48px;padding:12px 24px;border:0;border-radius:var(--radius-md);background:var(--primary);color:var(--on-primary);font:inherit;font-size:16px;font-weight:600;cursor:pointer">Download PDF</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
