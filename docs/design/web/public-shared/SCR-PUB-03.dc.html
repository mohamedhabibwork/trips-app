<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCR-PUB-03 Traveler sign-up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:var(--primary-text)}</style>
</helmet>
<div style="--surface:#f6f3e4;--surface-raised:#ffffff;--surface-inverse:#262a67;--ink:#262a67;--ink-muted:#5b5f86;--ink-inverse:#f6f3e4;--hairline:#e3dfc9;--primary:#ff6c2e;--on-primary:#262a67;--primary-text:#c93a00;--accent:#fb8030;--highlight:#f89e23;--focus-ring:#262a67;--control-border:#7b7fa6;--danger:#b42318;--danger-soft:#fde8e6;--success:#1f7a4d;--success-soft:#e3f3ea;--warning:#8a4b00;--warning-soft:#fff1d6;--info-soft:#e6e8f5;--glass-dim:rgba(16,18,48,.35);--card-shadow:0 1px 2px rgba(38,42,103,.06),0 6px 20px rgba(38,42,103,.08);--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--surface);color:var(--ink);font-family:Outfit,Nunito,system-ui,sans-serif;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--surface-raised);border-bottom:1px solid var(--hairline)">
    <div style="font-size:20px;font-weight:700">Trips <span style="color:var(--primary-text)">Enjoy</span></div>
    <a href="#" lang="ar" style="font-size:14px;font-weight:600;color:var(--ink)">العربية</a>
  </header>
  <main style="flex:1;display:flex;flex-direction:column;gap:14px;padding:20px 16px;box-sizing:border-box">
    <h1 style="margin:0;font-size:28px;line-height:36px;font-weight:700">Create your traveler account</h1>
    <p style="margin:0;font-size:14px;line-height:20px;color:var(--ink-muted)">Add an email, a phone number, or both. You verify at least one.</p>
    <label style="display:flex;flex-direction:column;font-size:14px;font-weight:600">Full name<input type="text" style="box-sizing:border-box;height:48px;margin-top:6px;padding:0 14px;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:16px;font-weight:400"></label>
    <label style="display:flex;flex-direction:column;font-size:14px;font-weight:600">Email<input type="email" placeholder="name@example.com" style="box-sizing:border-box;height:48px;margin-top:6px;padding:0 14px;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:16px;font-weight:400"></label>
    <label style="display:flex;flex-direction:column;font-size:14px;font-weight:600">Phone<input type="tel" placeholder="+[COUNTRY CODE] [NUMBER]" style="box-sizing:border-box;height:48px;margin-top:6px;padding:0 14px;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:16px;font-weight:400"></label>
    <label style="display:flex;flex-direction:column;font-size:14px;font-weight:600">Country<select style="box-sizing:border-box;height:48px;margin-top:6px;padding:0 14px;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:16px;font-weight:400"><option>Select country</option></select></label>
    <label style="display:flex;flex-direction:column;font-size:14px;font-weight:600">Language<select style="box-sizing:border-box;height:48px;margin-top:6px;padding:0 14px;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:16px;font-weight:400"><option>English</option><option>العربية</option></select></label>
    <div style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-md);background:var(--danger-soft);color:var(--danger);font-size:14px;line-height:20px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
      <span>Select your country to continue.</span>
    </div>
    <button type="button" style="margin-top:auto;min-height:48px;padding:12px 24px;border:0;border-radius:var(--radius-md);background:var(--primary);color:var(--on-primary);font:inherit;font-size:16px;font-weight:600;cursor:pointer">Create account</button>
  </main>
</div>
</x-dc>

</body>
</html>
