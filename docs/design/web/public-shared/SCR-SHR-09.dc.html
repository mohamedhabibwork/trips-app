<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCR-SHR-09 Confirmation dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:var(--primary-text)}</style>
</helmet>
<div style="--surface:#f6f3e4;--surface-raised:#ffffff;--surface-inverse:#262a67;--ink:#262a67;--ink-muted:#5b5f86;--ink-inverse:#f6f3e4;--hairline:#e3dfc9;--primary:#ff6c2e;--on-primary:#262a67;--primary-text:#c93a00;--accent:#fb8030;--highlight:#f89e23;--focus-ring:#262a67;--control-border:#7b7fa6;--danger:#b42318;--danger-soft:#fde8e6;--success:#1f7a4d;--success-soft:#e3f3ea;--warning:#8a4b00;--warning-soft:#fff1d6;--info-soft:#e6e8f5;--glass-dim:rgba(16,18,48,.35);--card-shadow:0 1px 2px rgba(38,42,103,.06),0 6px 20px rgba(38,42,103,.08);--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--surface);color:var(--ink);font-family:Outfit,Nunito,system-ui,sans-serif">
  <div style="padding:16px;background:var(--surface-raised);border-bottom:1px solid var(--hairline);font-size:20px;font-weight:700">Trips <span style="color:var(--primary-text)">Enjoy</span></div>
  <div style="padding:16px;display:flex;flex-direction:column;gap:12px" aria-hidden="true">
    <div style="height:72px;border-radius:var(--radius-md);background:var(--surface-raised)"></div>
    <div style="height:72px;border-radius:var(--radius-md);background:var(--surface-raised)"></div>
  </div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:var(--glass-dim)"></div>
  <section role="alertdialog" aria-modal="true" aria-labelledby="d1" style="position:absolute;left:20px;right:20px;top:200px;background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--card-shadow);padding:24px;display:flex;flex-direction:column;gap:14px">
    <h1 id="d1" style="margin:0;font-size:22px;line-height:30px;font-weight:700">Remove [PASSENGER NAME] from the trip?</h1>
    <p style="margin:0;font-size:15px;line-height:22px;color:var(--ink-muted)">They will be notified before this takes effect. The seat is released and this action is recorded.</p>
    <label style="display:flex;flex-direction:column;font-size:14px;font-weight:600">Reason (required)<textarea rows="3" placeholder="Write the reason" style="box-sizing:border-box;margin-top:6px;padding:10px 14px;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:16px;font-weight:400;resize:none"></textarea></label>
    <button type="button" style="min-height:48px;padding:12px 24px;border:0;border-radius:var(--radius-md);background:var(--danger);color:#ffffff;font:inherit;font-size:16px;font-weight:600;cursor:pointer">Remove passenger</button>
    <button type="button" style="min-height:48px;padding:12px 24px;border:2px solid var(--ink);border-radius:var(--radius-md);background:transparent;color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer">Cancel</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
