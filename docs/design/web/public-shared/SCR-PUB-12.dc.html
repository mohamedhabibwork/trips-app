<div style="--surface:#f6f3e4;--surface-raised:#ffffff;--surface-inverse:#262a67;--ink:#262a67;--ink-muted:#5b5f86;--ink-inverse:#f6f3e4;--hairline:#e3dfc9;--primary:#ff6c2e;--on-primary:#262a67;--primary-text:#c93a00;--accent:#fb8030;--highlight:#f89e23;--focus-ring:#262a67;--control-border:#7b7fa6;--danger:#b42318;--danger-soft:#fde8e6;--success:#1f7a4d;--success-soft:#e3f3ea;--warning:#8a4b00;--warning-soft:#fff1d6;--info-soft:#e6e8f5;--glass-dim:rgba(16,18,48,.35);--card-shadow:0 1px 2px rgba(38,42,103,.06),0 6px 20px rgba(38,42,103,.08);--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-pill:999px;width:1280px;height:900px;box-sizing:border-box;overflow:hidden;background:var(--surface);color:var(--ink);font-family:Outfit,Nunito,system-ui,sans-serif;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;padding:20px 48px;background:var(--surface-raised);border-bottom:1px solid var(--hairline)">
    <div style="font-size:24px;font-weight:700">Trips <span style="color:var(--primary-text)">Enjoy</span></div>
  </header>
  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:48px">
    <section style="width:560px;background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--card-shadow);padding:36px;display:flex;flex-direction:column;gap:20px">
      <span style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:var(--radius-pill);background:var(--warning-soft);color:var(--warning);font-size:13px;font-weight:600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Required before the workspace opens</span>
      <h1 style="margin:0;font-size:32px;line-height:40px;font-weight:700">Set your sign-in code</h1>
      <p style="margin:0;font-size:16px;line-height:24px;color:var(--ink-muted)">Each staff sign-in needs a second code. Choose how you receive it.</p>
      <fieldset style="margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:12px">
        <legend style="font-size:14px;font-weight:600;margin-bottom:8px">Code method</legend>
        <label style="display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--radius-md);border:2px solid var(--ink);font-size:16px;font-weight:600"><input type="radio" name="method" checked style="width:20px;height:20px;margin:0">Authenticator app</label>
        <label style="display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--radius-md);border:1.5px solid var(--control-border);font-size:16px"><input type="radio" name="method" style="width:20px;height:20px;margin:0">Text message (SMS) to [MASKED PHONE]</label>
      </fieldset>
      <label style="display:flex;flex-direction:column;font-size:14px;font-weight:600">Code from your app<input inputmode="numeric" maxlength="6" placeholder="6-digit code" style="box-sizing:border-box;height:48px;margin-top:6px;padding:0 14px;border:1.5px solid var(--control-border);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:inherit;font-size:16px;font-weight:400;letter-spacing:6px"></label>
      <button type="button" style="min-height:48px;padding:12px 28px;border:0;border-radius:var(--radius-md);background:var(--primary);color:var(--on-primary);font:inherit;font-size:16px;font-weight:600;cursor:pointer">Confirm</button>
    </section>
  </main>
