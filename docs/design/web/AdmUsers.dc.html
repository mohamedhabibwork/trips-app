<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · All users</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f6f3e4}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #262a67;outline-offset:2px}
.te-tr:hover{background:#fbf9f0}
</style>
</helmet>
<div style="min-height: 1000px; display: flex; flex-wrap: wrap; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif">
<div style="flex: 1 1 248px; display: flex"><dc-import name="AdmNav" active="Users" hint-size="248px,1000px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; color: #5b5f86">50,138 accounts · 1,962 hold more than one role</span><h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Users</h1></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" style="height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>Export CSV</button>
<a href="AdminApplications.dc.html" style="height: 48px; padding: 0 20px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; text-decoration: none">Review 14 role applications</a>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; background: #ffffff; border-radius: 20px; padding: 16px 20px">
<div style="flex: 2 1 260px; display: flex; flex-direction: column; gap: 6px">
<label for="u-q" style="font-size: 14px; font-weight: 600">Search</label>
<div style="position: relative"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b5f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 14px; top: 15px"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg><input id="u-q" type="search" placeholder="Name, email, phone or user ID" style="width: 100%; box-sizing: border-box; height: 48px; border-radius: 8px; border: 1px solid #7b7fa6; background: #fff; padding: 0 14px 0 40px; font: inherit; font-size: 16px; color: #262a67"></div>
</div>
<div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px"><label for="u-role" style="font-size: 14px; font-weight: 600">Role</label><select id="u-role" style="height: 48px; border-radius: 8px; border: 1px solid #7b7fa6; background: #fff; padding: 0 12px; font: inherit; font-size: 15px; color: #262a67"><option>All roles</option><option>Traveller</option><option>Parent</option><option>Driver</option><option>Photographer</option><option>Organization staff</option></select></div>
<div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px"><label for="u-st" style="font-size: 14px; font-weight: 600">Status</label><select id="u-st" style="height: 48px; border-radius: 8px; border: 1px solid #7b7fa6; background: #fff; padding: 0 12px; font: inherit; font-size: 15px; color: #262a67"><option>All statuses</option><option>Active</option><option>Suspended</option><option>Pending deletion</option></select></div>
<div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px"><label for="u-c" style="font-size: 14px; font-weight: 600">Country</label><select id="u-c" style="height: 48px; border-radius: 8px; border: 1px solid #7b7fa6; background: #fff; padding: 0 12px; font: inherit; font-size: 15px; color: #262a67"><option>All countries</option><option>Saudi Arabia</option><option>United Arab Emirates</option><option>Egypt</option></select></div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 8px" role="group" aria-label="Quick filters">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.on}}" aria-pressed="{{c.pr}}" style="{{c.st}}">{{c.t}}</button>
</sc-for>
</div>

<sc-if value="{{hasSel}}" hint-placeholder-val="{{true}}">
<div role="region" aria-label="Bulk actions" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 12px; background: #262a67; color: #f6f3e4">
<span style="font-size: 15px; font-weight: 600">{{selLabel}}</span>
<span style="flex-grow: 1"></span>
<button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #b8bad6; background: transparent; color: #f6f3e4; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Send message</button>
<button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #b8bad6; background: transparent; color: #f6f3e4; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Require lab test</button>
<button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #b8bad6; background: transparent; color: #f6f3e4; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Export selected</button>
<button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: #b42318; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Suspend…</button>
<button type="button" onClick="{{clearSel}}" style="height: 40px; padding: 0 10px; border: 0; background: transparent; color: #ff8655; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Clear</button>
</div>
</sc-if>

<section aria-label="Users" style="background: #ffffff; border-radius: 20px; padding: 8px 0">
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 1060px; border-collapse: collapse; font-size: 15px">
<thead><tr style="color: #5b5f86; font-size: 13px"><th scope="col" style="width: 44px; padding: 10px 0 10px 20px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Select</span></th><th scope="col" style="text-align: start; padding: 10px 12px; font-weight: 600">Name</th><th scope="col" style="text-align: start; padding: 10px 12px; font-weight: 600">Roles</th><th scope="col" style="text-align: start; padding: 10px 12px; font-weight: 600">Country</th><th scope="col" style="text-align: start; padding: 10px 12px; font-weight: 600">Plan</th><th scope="col" style="text-align: start; padding: 10px 12px; font-weight: 600">Status</th><th scope="col" style="text-align: start; padding: 10px 12px; font-weight: 600">Joined</th><th scope="col" style="text-align: start; padding: 10px 20px; font-weight: 600">Last active</th></tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<tr class="te-tr" style="border-top: 1px solid #e3dfc9">
<td style="padding: 10px 0 10px 20px"><input type="checkbox" checked="{{r.sel}}" onChange="{{r.toggle}}" aria-label="{{r.selLabel}}" style="width: 18px; height: 18px; accent-color: #262a67"></td>
<td style="padding: 10px 12px"><a href="AdmUser.dc.html" style="display: flex; align-items: center; gap: 12px; color: #262a67; text-decoration: none"><sc-if value="{{r.hasAv}}" hint-placeholder-val="{{true}}"><img src="{{r.av}}" alt="" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; object-fit: cover"></sc-if><sc-if value="{{r.noAv}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: #e6e8f5; color: #262a67; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.ini}}</span></sc-if><span style="display: flex; flex-direction: column"><span style="font-weight: 600">{{r.n}}</span><span style="font-size: 13px; color: #5b5f86">{{r.e}}</span></span></a></td>
<td style="padding: 10px 12px"><span style="display: flex; flex-wrap: wrap; gap: 4px"><sc-for list="{{r.roles}}" as="b" hint-placeholder-count="2"><span style="{{b.st}}">{{b.t}}</span></sc-for></span></td>
<td style="padding: 10px 12px">{{r.c}}</td>
<td style="padding: 10px 12px">{{r.p}}</td>
<td style="padding: 10px 12px"><span style="{{r.ss}}">{{r.s}}</span></td>
<td style="padding: 10px 12px; color: #5b5f86; white-space: nowrap">{{r.j}}</td>
<td style="padding: 10px 20px; color: #5b5f86; white-space: nowrap">{{r.la}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 12px 20px 8px; border-top: 1px solid #e3dfc9; font-size: 14px; color: #5b5f86">
<span>Showing 1–10 of 50,138</span>
<span style="display: flex; gap: 8px"><button type="button" disabled="disabled" style="height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid #e3dfc9; background: #fff; color: #5b5f86; font: inherit; font-size: 14px">Previous</button><button type="button" style="height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid #7b7fa6; background: #fff; color: #262a67; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Next</button></span>
</div>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1160}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: { 2: true, 6: true }, chip: 'All' }; }
  renderVals() {
    const pill = (tone) => 'display: inline-flex; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; ' + ({ ok: 'background: #e3f3ea; color: #1f7a4d;', warn: 'background: #fdf0d5; color: #8a4b00;', bad: 'background: #fde8e6; color: #b42318;', info: 'background: #e6e8f5; color: #262a67;', live: 'background: #ffe7dc; color: #c93a00;' })[tone];
    const role = (t) => ({ t, st: 'display: inline-flex; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; ' + ({ Traveller: 'background: #e6e8f5; color: #262a67;', Parent: 'background: #f6f3e4; color: #262a67; border: 1px solid #e3dfc9;', Driver: 'background: #262a67; color: #f6f3e4;', Photographer: 'background: #ffe7dc; color: #c93a00;', 'Org staff': 'background: #fdf0d5; color: #8a4b00;' })[t] });
    const stT = { Active: 'ok', Suspended: 'bad', 'Pending deletion': 'warn' };
    const data = [
      ['Khalid Al-Harbi', 'khalid.harbi@mail.sa', ['Traveller', 'Driver'], 'Saudi Arabia', 'Driver Professional', 'Active', '12 Mar 2025', 'Today 07:51'],
      ['Sara Al-Qahtani', 'sara.q@mail.sa', ['Traveller', 'Parent'], 'Saudi Arabia', 'User Explorer', 'Active', '03 Jan 2025', 'Today 09:12'],
      ['Noura Al-Shehri', 'noura@shehristudio.sa', ['Traveller', 'Photographer'], 'Saudi Arabia', 'Photographer Studio', 'Active', '21 Feb 2025', 'Yesterday'],
      ['Mona Saleh', 'mona@sunrisetours.sa', ['Org staff', 'Traveller'], 'Saudi Arabia', 'Company Growth', 'Active', '08 Nov 2024', 'Today 08:40'],
      ['Hala Nasser', 'hala@sunrisetours.sa', ['Org staff'], 'Saudi Arabia', 'via Sunrise Tours Co.', 'Active', '14 Nov 2024', 'Today 08:02'],
      ['Ahmed Fathy', 'ahmed.fathy@mail.eg', ['Traveller', 'Driver', 'Photographer'], 'Egypt', 'Driver Basic', 'Active', '30 Jul 2025', '3 days ago'],
      ['Majed Al-Otaibi', 'majed.o@mail.sa', ['Driver'], 'Saudi Arabia', 'Driver Basic', 'Suspended', '19 Aug 2025', '12 Sep'],
      ['Layla Haddad', 'layla.h@mail.ae', ['Traveller', 'Parent'], 'United Arab Emirates', 'User VIP', 'Active', '02 May 2025', 'Today 06:30'],
      ['Omar Bakr', 'omar.bakr@mail.sa', ['Traveller'], 'Saudi Arabia', 'User Free', 'Pending deletion', '17 Jun 2024', '28 Sep'],
      ['Rana Fadel', 'rana@sunrisetours.sa', ['Org staff', 'Traveller'], 'Saudi Arabia', 'via Sunrise Tours Co.', 'Active', '20 Nov 2024', 'Today 09:05']
    ];
    const sel = this.state.sel;
    const AVS = { 'Khalid Al-Harbi': '../assets/c311d0b40fa5c0d792261872e7c7b89d.svg', 'Sara Al-Qahtani': '../assets/9bae6808275a736bdbdad8b4ffd6c82b.svg', 'Noura Al-Shehri': '../assets/380d7985babc06d16544f4085cdec2d7.svg', 'Mona Saleh': '../assets/1da5f4a1d52001ce8dfc722d595c772b.svg', 'Hala Nasser': '../assets/17fb7a19876b9e012cc17bde6f69c632.svg', 'Ahmed Fathy': '../assets/3a4d2dfca2f7de1ed48b5ab6aa97969c.svg', 'Majed Al-Otaibi': '../assets/7f591a95b676f687e8c91ce1047f3169.svg', 'Layla Haddad': '../assets/0d922cfc36bb6ec3d9b9bc5efe08448e.svg', 'Rana Fadel': '../assets/1e346ba84a1175ce8c93e484460e54ec.svg' };
    const ini = (nm) => { const p = nm.split(' '); return (p[0][0] + p[p.length - 1].replace('Al-', '')[0]).toUpperCase(); };
    const rows = data.map((d, i) => ({ av: AVS[d[0]] || '', hasAv: !!AVS[d[0]], noAv: !AVS[d[0]], ini: ini(d[0]), n: d[0], e: d[1], roles: d[2].map(role), c: d[3], p: d[4], s: d[5] === 'Pending deletion' ? 'Pending deletion · 24 d left' : d[5], ss: pill(stT[d[5]]), j: d[6], la: d[7], sel: !!sel[i], selLabel: 'Select ' + d[0],
      toggle: () => this.setState({ sel: { ...this.state.sel, [i]: !this.state.sel[i] } }) }));
    const n = Object.values(sel).filter(Boolean).length;
    const chipNames = ['All', 'Multi-role', 'Drivers', 'Photographers', 'Suspended', 'Pending deletion'];
    const chips = chipNames.map((t) => { const on = this.state.chip === t; return { t, pr: on ? 'true' : 'false', on: () => this.setState({ chip: t }),
      st: 'height: 36px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #262a67; color: #f6f3e4; border: 1px solid #262a67;' : 'background: #ffffff; color: #262a67; border: 1px solid #7b7fa6;') }; });
    return { rows, chips, hasSel: n > 0, selLabel: n + (n === 1 ? ' user selected' : ' users selected'), clearSel: () => this.setState({ sel: {} }) };
  }
}
</script>
</body>
</html>
