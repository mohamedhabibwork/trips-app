<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Organization navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Cairo:wght@500;600;700&amp;display=swap">
<style>body{margin:0} .te-on:focus-visible{outline:2px solid #f89e23;outline-offset:2px} .te-on:hover{background:#31367a}</style>
</helmet>
<nav aria-label="Organization" dir="{{dir}}" style="font-family: {{font}}; width: 100%; min-height: 1000px; height: 100%; box-sizing: border-box; background: #262a67; color: #f6f3e4; font-family: Outfit, Nunito, system-ui, sans-serif; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 12px">
<img src="../assets/6ea846350ba3adc0e289d47fa0612c3b.svg" alt="Trips Enjoy" style="height: 36px; width: auto; align-self: flex-start">
<a href="OrgSwitcher.dc.html" class="te-on" aria-label="{{orgLabel}}" style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: #31367a; color: #f6f3e4; text-decoration: none">
<img src="{{orgLogo}}" alt="" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; object-fit: cover">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">{{orgName}}</span><span style="font-size: 12px; color: #b8bad6">{{orgMeta}}</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="12">
<sc-if value="{{i.isHead}}" hint-placeholder-val="{{false}}"><span style="padding: 8px 12px 2px; font-size: 11px; font-weight: 700; letter-spacing: .6px; color: #b8bad6">{{i.t}}</span></sc-if>
<sc-if value="{{i.isLink}}" hint-placeholder-val="{{true}}">
<a href="{{i.href}}" class="te-on" aria-current="{{i.cur}}" style="{{i.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"></path></svg><span style="flex-grow: 1">{{i.t}}</span><sc-if value="{{i.hasN}}" hint-placeholder-val="{{false}}"><span style="padding: 0 8px; border-radius: 999px; background: #f89e23; color: #262a67; font-size: 12px; font-weight: 700; line-height: 20px">{{i.n}}</span></sc-if></a>
</sc-if>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; padding-top: 12px; border-top: 1px solid #31367a"><img src="{{avatar}}" alt="" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; object-fit: cover"><span style="display: flex; flex-direction: column"><span style="font-weight: 600">{{person}}</span><span style="font-size: 12px; color: #b8bad6">{{personRole}}</span></span></div>
</nav>
</x-dc>

</html>
