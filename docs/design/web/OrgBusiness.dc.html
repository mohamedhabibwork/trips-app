<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="height: 72px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; background: #ffffff; border-bottom: 1px solid #e3dfc9">
<img src="../assets/1fbce194fcb16bf54904c32c189fca31.svg" alt="Trips Enjoy" style="height: 40px; width: auto">
<span style="font-size: 14px; color: #5b5f86">Organization registration · Step 3 of 5 · <a href="#" style="font-weight: 600">Save and exit</a></span>
</div>
<div style="flex-grow: 1; display: flex; justify-content: center; padding: 32px 48px">
<div style="width: 760px; background: #ffffff; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 2px rgba(38,42,103,.06), 0 6px 20px rgba(38,42,103,.08)">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Business information</h1>
<p style="margin: 0; font-size: 15px; color: #5b5f86">Must match your Commercial Registration and VAT certificate.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ob-en" style="font-size: 14px; font-weight: 600">Legal name (English)</label><input id="ob-en" value="Sunrise Tours Co." style="height: 48px; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; font-family: inherit; font-size: 16px; color: #262a67"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ob-ar" style="font-size: 14px; font-weight: 600">Legal name (Arabic)</label><input id="ob-ar" dir="rtl" value="شركة شروق للسياحة" style="height: 48px; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; font-family: Cairo, sans-serif; font-size: 16px; color: #262a67"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ob-cr" style="font-size: 14px; font-weight: 600">Commercial Registration (CR) number</label><input id="ob-cr" inputmode="numeric" value="1010734512" style="height: 48px; padding: 0 14px; border-radius: 8px; border: 1px solid #7b7fa6; font-family: inherit; font-size: 16px; color: #262a67"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ob-vat" style="font-size: 14px; font-weight: 600">VAT number (ZATCA)</label><input id="ob-vat" inputmode="numeric" value="31024" style="height: 48px; padding: 0 14px; border-radius: 8px; border: 1.5px solid #b42318; font-family: inherit; font-size: 16px; color: #262a67"><span style="font-size: 13px; color: #b42318; font-weight: 500">VAT numbers have 15 digits, starting and ending with 3.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ob-type" style="font-size: 14px; font-weight: 600">Organization type</label><select id="ob-type" style="height: 48px; padding: 0 10px; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; font-family: inherit; font-size: 16px; color: #262a67"><option>Travel and tourism company</option><option>School</option><option>Company (employee trips)</option><option>Event organizer</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ob-city" style="font-size: 14px; font-weight: 600">Head office city</label><select id="ob-city" style="height: 48px; padding: 0 10px; border-radius: 8px; border: 1px solid #7b7fa6; background: #ffffff; font-family: inherit; font-size: 16px; color: #262a67"><option>Riyadh</option><option>Jeddah</option><option>Dammam</option></select></div>
</div>
<dc-import name="PhoneField" label="Customer support number" value="920001234" country="SA" helper="Shown to travelers who book your trips." field-id="ob-support" hint-size="100%,106px"></dc-import>
<div style="display: flex; justify-content: space-between; margin-top: auto">
<a href="OrgVerify.dc.html" style="height: 48px; padding: 0 24px; box-sizing: border-box; border-radius: 12px; border: 1px solid #7b7fa6; color: #262a67; font-size: 16px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Back</a>
<a href="OrgDocs.dc.html" style="height: 48px; padding: 0 28px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Continue</a>
</div>
