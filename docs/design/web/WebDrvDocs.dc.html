<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver · Documents — web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#c93a00}a:hover{color:#262a67}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #262a67;outline-offset:2px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #f6f3e4; color: #262a67; font-family: Outfit, Nunito, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="height: 72px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; background: #ffffff; border-bottom: 1px solid #e3dfc9">
<img src="../assets/1fbce194fcb16bf54904c32c189fca31.svg" alt="Trips Enjoy" style="height: 40px; width: auto">
<span style="font-size: 14px; color: #5b5f86">trips-enjoy.com/register/driver · Saved as draft · <a href="#" style="font-weight: 600">Save and exit</a></span>
</div>
<div style="flex-grow: 1; display: flex; justify-content: center; padding: 40px 48px; gap: 48px">
<dc-import name="WebStepper" role="driver" active="{{four}}" hint-size="240px,300px"></dc-import>
<div style="width: 640px; background: #ffffff; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 2px rgba(38,42,103,.06), 0 6px 20px rgba(38,42,103,.08)">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Documents</h1>
<p style="margin: 0; font-size: 15px; color: #5b5f86">Clear photos or PDFs, all four corners visible, up to 10 MB each.</p>
</div>
<sc-for list="{{docs}}" as="d" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid #e3dfc9">
<sc-if value="{{d.thumb}}" hint-placeholder-val="{{false}}"><img src="{{d.img}}" alt="{{d.alt}}" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 8px; object-fit: cover"></sc-if><sc-if value="{{d.noThumb}}" hint-placeholder-val="{{true}}"><span style="{{d.iconStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{d.icon}}"></path></svg></span></sc-if>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{d.t}}</span><span style="{{d.noteStyle}}">{{d.note}}</span></span>
<button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #7b7fa6; background: #ffffff; color: #262a67; font-family: inherit; font-size: 14px; font-weight: 600">{{d.btn}}</button>
</div>
</sc-for>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 20px"><input type="checkbox" checked="" style="width: 18px; height: 18px; margin: 0; accent-color: #262a67; flex-shrink: 0">I agree to random lab tests (drug and medical) whenever Trips Enjoy requests one. My driver account is paused until results are approved.</label>
<div style="display: flex; justify-content: space-between; margin-top: auto">
<a href="WebDrvVehicle.dc.html" style="height: 48px; padding: 0 24px; box-sizing: border-box; border-radius: 12px; border: 1px solid #7b7fa6; color: #262a67; font-size: 16px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Back</a>
<a href="WebReview.dc.html" style="height: 48px; padding: 0 28px; border-radius: 12px; background: #ff6c2e; color: #262a67; font-size: 16px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Submit for review</a>
</div>
</div>
</div>
</div>
</x-dc>

</body>
</html>
